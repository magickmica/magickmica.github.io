<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Sigil &middot; MagickMica</title>
<meta name="description" content="One five-letter sigil a day. Same word for everyone. Six tries.">
<meta property="og:title" content="Daily Sigil &middot; MagickMica">
<meta property="og:description" content="One word a day. Six tries. Share your grid.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --void:#07060e;--violet:#a020f0;--magenta:#ff44cc;--gold:#ffd166;--cyan:#22e0ff;
  --mist:#b8b0d4;--dim:#6f6890;--slate:#221a3a;--slate-2:#2d2350;--miss:#171227;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;padding:0 12px 30px;background:var(--void);color:var(--mist);
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:15px;line-height:1.5;
  min-height:100vh;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.4;
  background:
    radial-gradient(110% 60% at 50% -12%, #1b1038 0%, transparent 58%),
    radial-gradient(1px 1px at 18% 28%, rgba(255,255,255,.7) 50%, transparent 50%),
    radial-gradient(1px 1px at 70% 48%, rgba(255,209,102,.6) 50%, transparent 50%);
  background-size:auto,200px 200px,200px 200px;
}
a{color:var(--cyan)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:500px;margin:0 auto}

header{text-align:center;padding:22px 0 10px}
.eyebrow{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);margin:0 0 9px}
h1{
  font-family:"Orbitron",sans-serif;font-weight:700;font-size:clamp(19px,5.2vw,28px);
  letter-spacing:.06em;margin:0;color:transparent;
  background:linear-gradient(96deg,var(--violet),var(--magenta) 28%,var(--gold) 58%,var(--cyan) 86%,var(--violet));
  background-size:220% 100%;-webkit-background-clip:text;background-clip:text;
  animation:holo 11s linear infinite;
}
@keyframes holo{to{background-position:220% 0}}
.sub{text-align:center;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:9px 0 0}

/* ------------------------------------------------------- board */
.board{display:grid;gap:6px;justify-content:center;margin:18px 0 14px}
.line{display:grid;grid-template-columns:repeat(5,minmax(0,58px));gap:6px}
.box{
  aspect-ratio:1;display:grid;place-items:center;border-radius:8px;
  border:2px solid rgba(184,176,212,.2);background:transparent;
  font-family:"Orbitron",sans-serif;font-weight:700;
  font-size:clamp(19px,5.5vw,26px);color:#fff;text-transform:uppercase;
}
.box[data-full="true"]{border-color:rgba(184,176,212,.45)}
.box[data-r="hit"]{background:linear-gradient(150deg,var(--gold),#e8a833);border-color:transparent;color:#0d0a18}
.box[data-r="near"]{background:linear-gradient(150deg,var(--magenta),var(--violet));border-color:transparent;color:#fff}
.box[data-r="miss"]{background:var(--miss);border-color:transparent;color:var(--dim)}
.line.shake{animation:shake .38s}
@keyframes shake{10%,90%{transform:translateX(-3px)}30%,70%{transform:translateX(5px)}50%{transform:translateX(-5px)}}

.msg{text-align:center;min-height:22px;font-size:12px;letter-spacing:.1em;color:var(--gold)}

/* ------------------------------------------------------- keyboard */
.keys{display:grid;gap:6px;margin-top:12px}
.krow{display:flex;gap:5px;justify-content:center}
.key{
  flex:1 1 0;min-width:0;max-width:44px;height:52px;
  border:0;border-radius:7px;background:var(--slate-2);color:var(--mist);
  font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:500;
  text-transform:uppercase;cursor:pointer;padding:0;
}
.key:hover{background:#3a2d66}
.key.wide{flex:1.6 1 0;max-width:70px;font-size:10px;letter-spacing:.08em}
.key[data-r="hit"]{background:linear-gradient(150deg,var(--gold),#e8a833);color:#0d0a18}
.key[data-r="near"]{background:linear-gradient(150deg,var(--magenta),var(--violet));color:#fff}
.key[data-r="miss"]{background:var(--miss);color:#514a70}

/* ------------------------------------------------------- end card */
.veil{position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:20px;
  background:rgba(4,3,10,.9);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.veil[data-on="true"]{display:grid}
.card{max-width:380px;width:100%;text-align:center;border:1px solid rgba(184,176,212,.18);
  border-radius:15px;padding:24px 20px;background:#100a1e}
.card h2{font-family:"Orbitron",sans-serif;font-size:19px;letter-spacing:.06em;margin:0 0 6px;color:var(--gold)}
.card .word{font-family:"Orbitron",sans-serif;font-size:26px;letter-spacing:.2em;color:#fff;margin:6px 0 14px;text-transform:uppercase}
.stats{display:flex;justify-content:center;gap:20px;margin:0 0 16px}
.stat b{display:block;font-family:"Orbitron",sans-serif;font-size:22px;color:var(--gold)}
.stat span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.grid-preview{font-size:17px;line-height:1.24;letter-spacing:2px;margin:0 0 16px;white-space:pre-line}
.btn{
  font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:500;letter-spacing:.16em;
  text-transform:uppercase;color:var(--void);border:0;border-radius:999px;
  background:linear-gradient(96deg,var(--gold),#ffe9b5 55%,var(--gold));
  padding:13px 22px;min-height:46px;cursor:pointer;
}
.btn.ghost{background:transparent;color:var(--mist);border:1px solid rgba(184,176,212,.3)}
.next{font-size:11px;letter-spacing:.12em;color:var(--dim);margin:14px 0 0}

@media(prefers-reduced-motion:reduce){h1{animation:none}.line.shake{animation:none}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <p class="eyebrow">MagickMica</p>
    <h1>DAILY SIGIL</h1>
    <p class="sub">Sigil <span id="dayNo">1</span> &middot; one word a day</p>
  </header>

  <div class="board" id="board"></div>
  <p class="msg" id="msg"></p>
  <div class="keys" id="keys"></div>
</div>

<div class="veil" id="veil">
  <div class="card">
    <h2 id="endTitle"></h2>
    <p class="word" id="endWord"></p>
    <div class="grid-preview" id="endGrid"></div>
    <div class="stats">
      <div class="stat"><b id="stPlayed">0</b><span>played</span></div>
      <div class="stat"><b id="stWins">0</b><span>won</span></div>
      <div class="stat"><b id="stStreak">0</b><span>streak</span></div>
    </div>
    <button class="btn" id="share">Copy your grid</button>
    <p class="next" id="next"></p>
    <p style="margin:14px 0 0"><button class="btn ghost" id="close">Close</button></p>
  </div>
</div>

const ANSWERS = "stagejudgestyleurbanaurasshadysteamvenushellosharetribedrivesorrycrowsstaffquitebraveblamehotelpridequeenbeachthiefblazemoonsmouthfleshmonthsleepluckycoralstorminputbloodtriedwhiteidealskiesshellcreeksparkfalsemoralflashsmartearthstakemayorveinsphonepressscrapclimbplaintowershoresteerstickplanequicknaivemarchtitanclothwitchtigerkarmafleetissuechildangelclearcloseouncetorchreferprintcreamscenehobbycrowngrainunderhorsealoneherbsgeodemixedearlyrigidfancytouchmyrrhguestsnakeprimequietfaithuncleplutoloyalimagequiltstripmossyowneroceanpetallunarfevermounttastecleandoubtglowsamongjuiceslopeneverelbowexistgriefcloudbloomnoblewatercourtworsetopazlaughnervesouthroughwherepapersevenlayertakencrushrealmthrowsadlyouterroundslicetheremothsmeantstampshinemidstflourmajorsunnykingsworrycatchravenpiecehauntupperflowncryptcurveberryironyfiftyvalidkelpsrelicvinesleavevideocarrywakentraceyoungpoweroriontablespeakvoterphotosolvetodaywastemaybequillmoistruralmeternovelpyresfunnyfoundlyriclearnyieldslidemedalspeedminusquoteupsetsteelpausetrialswanswoundvocalmediadozenuntilcabinroastolivecountwagonfruitlimitfrontmakersaintreplystarslodgejeweltempoagateclassscoreblackstateproveworldnursestuffgleamsillymovieswepttitlecheergrapecoastskillabovesharpmighttraitthesebroomhumorbuildclockfreshmodelsweetrivalsuperdressmagicglobeshirtloosehousewicksshownstairthickeventshakelinenlightchestbegingiantgracepartyfightflamewholebreaklegalsoliddizzyharesstrawcolorthymepianoporchthreevenuedeitycovervaportenthwaiststoveomensscopeshiftsincecandyteethbreadswordromanrighttrainrebelfirstlaborboarddawnssightsaladswiftsmokedancebonesfeastlevelroutefoamsglassseerstwistblesssixtytotemthosewriteemberchinaequalhoneysigiltimerwidowsoulsmousewhilephasesuiteunionsagesguarddunesnewlytreatscentwhoseradiotrailvisiteeriescaleaboutsheettotalshortforthvitalalivemotorcedarwavesordermapleofferfloorgreetplacestoodenjoymistysmileshelfstartyourssolarcrazypearlbrainatlasreadytruckambertokenappleshadestockeverysprayspl (function () {
  'use strict';

  var LEN = 5, TRIES = 6;
  var LS = 'mm_sigil_v1';
  var EPOCH = Date.UTC(2026, 0, 1);          // sigil 1 = 1 Jan 2026

  // both lists are stored as one long string, five characters per word
  function unpack(s) {
    var out = [];
    for (var i = 0; i < s.length; i += LEN) out.push(s.substr(i, LEN));
    return out;
  }
  var VALID = {}, ANS = unpack(ANSWERS);
  (function () {
    var all = unpack(WORDS);
    for (var i = 0; i < all.length; i++) VALID[all[i]] = 1;
    for (var j = 0; j < ANS.length; j++) VALID[ANS[j]] = 1;
  })();

  function todayIndex() {
    var now = new Date();
    var utc = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.floor((utc - EPOCH) / 86400000);
  }
  var DAY = todayIndex();
  var TARGET = ANS[((DAY % ANS.length) + ANS.length) % ANS.length];

  var boardEl = document.getElementById('board');
  var keysEl = document.getElementById('keys');
  var msgEl = document.getElementById('msg');
  var veil = document.getElementById('veil');

  var rows = [], guesses = [], cur = '', done = false, won = false;

  document.getElementById('dayNo').textContent = DAY + 1;

  /* ------------------------------------------------ storage */
  function load() {
    try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch (e) { return {}; }
  }
  function save(d) { try { localStorage.setItem(LS, JSON.stringify(d)); } catch (e) {} }
  var data = load();
  if (!data.stats) data.stats = { played: 0, wins: 0, streak: 0, bestStreak: 0, lastDay: null };

  /* ------------------------------------------------ board */
  for (var r = 0; r < TRIES; r++) {
    var line = document.createElement('div');
    line.className = 'line';
    var boxes = [];
    for (var c = 0; c < LEN; c++) {
      var b = document.createElement('div');
      b.className = 'box';
      line.appendChild(b);
      boxes.push(b);
    }
    boardEl.appendChild(line);
    rows.push({ line: line, boxes: boxes });
  }

  var KEYS = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'];
  var keyEls = {};
  KEYS.forEach(function (rowStr, i) {
    var kr = document.createElement('div');
    kr.className = 'krow';
    if (i === 2) kr.appendChild(mkKey('ENTER', 'enter', true));
    rowStr.split('').forEach(function (ch) { kr.appendChild(mkKey(ch.toUpperCase(), ch)); });
    if (i === 2) kr.appendChild(mkKey('DEL', 'del', true));
    keysEl.appendChild(kr);
  });
  function mkKey(label, val, wide) {
    var b = document.createElement('button');
    b.className = 'key' + (wide ? ' wide' : '');
    b.type = 'button';
    b.textContent = label;
    b.addEventListener('click', function () { press(val); });
    if (val.length === 1) keyEls[val] = b;
    return b;
  }

  /* ------------------------------------------------ scoring */
  // two passes, so repeated letters score the way players expect
  function score(guess, target) {
    var res = new Array(LEN).fill('miss');
    var left = {};
    for (var i = 0; i < LEN; i++) {
      if (guess[i] === target[i]) res[i] = 'hit';
      else left[target[i]] = (left[target[i]] || 0) + 1;
    }
    for (var j = 0; j < LEN; j++) {
      if (res[j] === 'hit') continue;
      var g = guess[j];
      if (left[g] > 0) { res[j] = 'near'; left[g]--; }
    }
    return res;
  }

  function flash(t) {
    msgEl.textContent = t;
    clearTimeout(flash.t);
    flash.t = setTimeout(function () { msgEl.textContent = ''; }, 1800);
  }

  function paintCur() {
    var row = rows[guesses.length];
    if (!row) return;
    for (var i = 0; i < LEN; i++) {
      row.boxes[i].textContent = cur[i] || '';
      row.boxes[i].dataset.full = cur[i] ? 'true' : 'false';
    }
  }

  var RANK = { miss: 0, near: 1, hit: 2 };
  function paintRow(idx, guess, res) {
    var row = rows[idx];
    for (var i = 0; i < LEN; i++) {
      row.boxes[i].textContent = guess[i];
      row.boxes[i].dataset.r = res[i];
      var k = keyEls[guess[i]];
      if (k) {
        var prev = k.dataset.r;
        if (!prev || RANK[res[i]] > RANK[prev]) k.dataset.r = res[i];
      }
    }
  }

  function press(v) {
    if (done) return;
    if (v === 'del') { cur = cur.slice(0, -1); paintCur(); return; }
    if (v === 'enter') { submit(); return; }
    if (cur.length >= LEN) return;
    cur += v;
    paintCur();
  }

  function submit() {
    if (cur.length < LEN) { shake(); flash('Five letters.'); return; }
    if (!VALID[cur]) { shake(); flash('Not in the grimoire.'); return; }
    var res = score(cur, TARGET);
    paintRow(guesses.length, cur, res);
    guesses.push({ w: cur, r: res });
    var guessed = cur;
    cur = '';
    if (guessed === TARGET) { finish(true); }
    else if (guesses.length >= TRIES) { finish(false); }
    save(stateForToday());
  }

  function shake() {
    var row = rows[guesses.length];
    if (!row) return;
    row.line.classList.add('shake');
    setTimeout(function () { row.line.classList.remove('shake'); }, 400);
  }

  function stateForToday() {
    data.day = DAY;
    data.guesses = guesses.map(function (g) { return g.w; });
    data.done = done;
    data.won = won;
    return data;
  }

  /* ------------------------------------------------ finish */
  function finish(didWin, silent) {
    done = true; won = didWin;
    if (!silent) {
      var s = data.stats;
      s.played++;
      if (didWin) {
        s.wins++;
        s.streak = (s.lastDay === DAY - 1) ? s.streak + 1 : 1;
        if (s.streak > s.bestStreak) s.bestStreak = s.streak;
      } else { s.streak = 0; }
      s.lastDay = DAY;
      save(stateForToday());
    }
    setTimeout(showEnd, silent ? 0 : 520);
  }

  function gridText() {
    var sq = { hit: '\uD83D\uDFE8', near: '\uD83D\uDFEA', miss: '\u2B1B' };
    return guesses.map(function (g) {
      return g.r.map(function (x) { return sq[x]; }).join('');
    }).join('\n');
  }

  function showEnd() {
    document.getElementById('endTitle').textContent = won
      ? ['Uncanny.', 'Second sight.', 'Well read.', 'Steady.', 'Close one.', 'By a thread.'][guesses.length - 1]
      : 'The sigil holds.';
    document.getElementById('endWord').textContent = TARGET;
    document.getElementById('endGrid').textContent = gridText();
    document.getElementById('stPlayed').textContent = data.stats.played;
    document.getElementById('stWins').textContent = data.stats.wins;
    document.getElementById('stStreak').textContent = data.stats.streak;
    tickNext();
    veil.dataset.on = 'true';
  }

  function tickNext() {
    var n = new Date();
    var midnight = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1);
    var ms = midnight - n;
    var h = Math.floor(ms / 3600000), m = Math.floor(ms % 3600000 / 60000);
    document.getElementById('next').textContent = 'Next sigil in ' + h + 'h ' + m + 'm';
  }

  document.getElementById('share').addEventListener('click', function () {
    var head = 'Daily Sigil ' + (DAY + 1) + '  ' + (won ? guesses.length : 'X') + '/' + TRIES;
    var txt = head + '\n' + gridText() + '\nmagickmica.github.io/daily-sigil.html';
    var btn = this;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(
        function () { btn.textContent = 'Copied'; },
        function () { btn.textContent = 'Copy blocked'; });
    } else { btn.textContent = 'Copy blocked'; }
  });
  document.getElementById('close').addEventListener('click', function () { veil.dataset.on = 'false'; });

  document.addEventListener('keydown', function (e) {
    if (veil.dataset.on === 'true') return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (k === 'Enter') { e.preventDefault(); press('enter'); }
    else if (k === 'Backspace') { e.preventDefault(); press('del'); }
    else if (/^[a-zA-Z]$/.test(k)) { press(k.toLowerCase()); }
  });

  /* ------------------------------------------------ restore today */
  if (data.day === DAY && data.guesses && data.guesses.length) {
    data.guesses.forEach(function (w) {
      var res = score(w, TARGET);
      paintRow(guesses.length, w, res);
      guesses.push({ w: w, r: res });
    });
    if (data.done) { finish(data.won, true); }
  } else if (data.day !== DAY) {
    data.day = DAY; data.guesses = []; data.done = false; data.won = false;
    save(data);
  }
})();
</script>
