<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moon Shot &middot; MagickMica</title>
<meta name="description" content="Flick the moon through the ring. Three misses and the night is over.">
<meta property="og:title" content="Moon Shot &middot; MagickMica">
<meta property="og:description" content="Drag back, let go, sink the moon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --void:#07060e;--violet:#a020f0;--magenta:#ff44cc;--gold:#ffd166;--cyan:#22e0ff;
  --mist:#b8b0d4;--dim:#6f6890;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;padding:0 12px 40px;background:var(--void);color:var(--mist);
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:15px;line-height:1.5;
  overflow-x:hidden;
}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:520px;margin:0 auto;text-align:center}

header{padding:22px 0 4px}
.eyebrow{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);margin:0 0 9px}
h1{
  font-family:"Orbitron",sans-serif;font-weight:700;font-size:clamp(20px,5.2vw,30px);
  letter-spacing:.06em;margin:0;color:transparent;
  background:linear-gradient(96deg,var(--violet),var(--magenta) 28%,var(--gold) 58%,var(--cyan) 86%,var(--violet));
  background-size:220% 100%;-webkit-background-clip:text;background-clip:text;
  animation:holo 11s linear infinite;
}
@keyframes holo{to{background-position:220% 0}}

.scores{display:flex;justify-content:center;gap:22px;margin:14px 0 8px}
.sc b{display:block;font-family:"Orbitron",sans-serif;font-size:24px;color:var(--gold);line-height:1.1}
.sc span{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.sc.miss b{color:var(--magenta)}

.court{
  position:relative;width:100%;aspect-ratio:3/4;max-height:64vh;margin:0 auto;
  border-radius:14px;overflow:hidden;touch-action:none;cursor:grab;
  background:
    radial-gradient(70% 44% at 50% 8%, rgba(160,32,240,.35), transparent 62%),
    radial-gradient(1px 1px at 18% 22%, rgba(255,255,255,.75) 50%, transparent 50%),
    radial-gradient(1px 1px at 72% 36%, rgba(255,255,255,.55) 50%, transparent 50%),
    radial-gradient(1.4px 1.4px at 44% 62%, rgba(255,209,102,.7) 50%, transparent 50%),
    linear-gradient(180deg,#120b26,#08060f);
  background-size:auto,180px 180px,180px 180px,180px 180px,auto;
  border:1px solid rgba(184,176,212,.16);
}
.court:active{cursor:grabbing}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

.msg{
  position:absolute;left:0;right:0;top:38%;pointer-events:none;
  font-family:"Orbitron",sans-serif;font-weight:900;font-size:clamp(22px,7vw,38px);
  letter-spacing:.08em;color:var(--gold);text-shadow:0 0 26px rgba(255,209,102,.7);
  opacity:0;transition:opacity .2s,transform .45s;
}
.msg[data-on="true"]{opacity:1;transform:translateY(-14px)}

.bar{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.btn{
  font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:500;letter-spacing:.16em;
  text-transform:uppercase;color:var(--void);border:0;border-radius:999px;
  background:linear-gradient(96deg,var(--gold),#ffe9b5 55%,var(--gold));
  padding:13px 24px;min-height:46px;cursor:pointer;
}
.btn.ghost{background:transparent;color:var(--mist);border:1px solid rgba(184,176,212,.3)}
.hint{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#544f70;margin:12px 0 0}

.veil{position:absolute;inset:0;display:none;place-items:center;background:rgba(6,4,14,.88);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border-radius:14px}
.veil[data-on="true"]{display:grid}
.veil h2{font-family:"Orbitron",sans-serif;font-size:20px;letter-spacing:.06em;margin:0 0 6px;color:var(--gold)}
.veil p{margin:0 0 16px;font-size:13px;color:var(--mist)}

@media(prefers-reduced-motion:reduce){h1{animation:none}.msg{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <p class="eyebrow">MagickMica</p>
    <h1>MOON SHOT</h1>
  </header>

  <div class="scores">
    <div class="sc"><b id="score">0</b><span>sunk</span></div>
    <div class="sc"><b id="streak">0</b><span>streak</span></div>
    <div class="sc"><b id="best">0</b><span>best</span></div>
    <div class="sc miss"><b id="miss">0</b><span>of 3 missed</span></div>
  </div>

  <div class="court" id="court">
    <canvas id="cv"></canvas>
    <div class="msg" id="msg"></div>
    <div class="veil" id="veil">
      <div>
        <h2 id="endTitle">Night over</h2>
        <p id="endText"></p>
        <button class="btn" id="again">Shoot again</button>
      </div>
    </div>
  </div>

  <div class="bar">
    <button class="btn ghost" id="restart">Restart</button>
  </div>
  <p class="hint">drag back from the moon, let go</p>
</div>

<script>
(function () {
  'use strict';

  var LS = 'mm_moonshot_v1';
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var court = document.getElementById('court');
  var msgEl = document.getElementById('msg');
  var veil = document.getElementById('veil');
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var W = 0, H = 0, dpr = 1;
  // Tuned, not guessed: for a full-power shot to rise ~60% of the court and
  // hang ~1.4s, g = 8*rise/hang^2. The first value here was ~376x too strong
  // and slammed the moon down before it could arc.
  var GRAV = 2.45e-6;          // multiplied by court height -> px/ms^2
  // Full-power launch speed, multiplied by court height -> px/ms.
  // Raise it to make the ring easier to reach, lower it to make shots harder.
  // 0.00235 lets a shot score from about 78% pull upward; 0.00205 is the
  // stricter old desktop feel, where you needed nearly a full pull every time.
  var SHOT = 0.00235;
  var ball, hoop, sparks = [], trail = [];
  var aiming = false, aimFrom = null, aimTo = null;
  var score = 0, streak = 0, misses = 0, over = false;
  var scored = false, counted = false;

  var best = 0;
  try { best = parseInt(localStorage.getItem(LS), 10) || 0; } catch (e) {}
  document.getElementById('best').textContent = best;

  function resize() {
    var r = court.getBoundingClientRect();
    if (!r.width) return;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.width = Math.round(r.width * dpr);
    H = cv.height = Math.round(r.height * dpr);
    if (!ball) newBall(); else { ball.r = W * 0.055; }
    placeHoop(true);
  }

  function newBall() {
    ball = { x: W * 0.5, y: H * 0.86, vx: 0, vy: 0, r: W * 0.055, live: false, spin: 0 };
    scored = false; counted = false; trail = [];
  }

  function placeHoop(init) {
    var span = W * 0.5;
    var x = init && !hoop ? W * 0.5 : W * 0.25 + Math.random() * span;
    hoop = {
      x: Math.max(W * 0.22, Math.min(W * 0.78, x)),
      y: H * 0.27,
      r: W * 0.105,               // half-width of the ring
      rimR: W * 0.016,            // rim posts, as circles to bounce off
      dir: Math.random() < 0.5 ? -1 : 1
    };
  }

  // the board hangs on whichever side gives the ball the most room
  function board() {
    var w = W * 0.035, h = H * 0.20;
    var right = hoop.x < W * 0.5;
    var x = right ? hoop.x + hoop.r : hoop.x - hoop.r - w;
    return { x: x, y: hoop.y - h * 0.78, w: w, h: h, right: right };
  }

  /* ------------------------------------------------ drawing */
  function draw() {
    ctx.clearRect(0, 0, W, H);

    // backboard: stands behind the rim so the ring stays open from above
    var bb = board();
    ctx.fillStyle = 'rgba(160,32,240,.16)';
    ctx.strokeStyle = 'rgba(184,176,212,.5)';
    ctx.lineWidth = Math.max(1, W * 0.005);
    ctx.beginPath(); ctx.rect(bb.x, bb.y, bb.w, bb.h); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,209,102,.45)';
    ctx.beginPath();
    ctx.rect(bb.x + bb.w * 0.2, hoop.y - bb.h * 0.44, bb.w * 0.6, bb.h * 0.3);
    ctx.stroke();

    // net
    ctx.strokeStyle = 'rgba(184,176,212,.35)';
    ctx.lineWidth = Math.max(1, W * 0.0035);
    for (var i = 0; i <= 6; i++) {
      var t = i / 6;
      var sx = hoop.x - hoop.r + hoop.r * 2 * t;
      ctx.beginPath();
      ctx.moveTo(sx, hoop.y);
      ctx.lineTo(hoop.x - hoop.r * 0.55 + hoop.r * 1.1 * t, hoop.y + H * 0.075);
      ctx.stroke();
    }

    // rim
    var g = ctx.createLinearGradient(hoop.x - hoop.r, 0, hoop.x + hoop.r, 0);
    g.addColorStop(0, '#ff44cc'); g.addColorStop(.5, '#ffd166'); g.addColorStop(1, '#22e0ff');
    ctx.strokeStyle = g;
    ctx.lineWidth = hoop.rimR * 2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(hoop.x - hoop.r, hoop.y);
    ctx.lineTo(hoop.x + hoop.r, hoop.y);
    ctx.stroke();

    // trail
    for (var t2 = 0; t2 < trail.length; t2++) {
      var p = trail[t2];
      ctx.globalAlpha = (t2 / trail.length) * 0.32;
      ctx.fillStyle = '#ffd166';
      ctx.beginPath(); ctx.arc(p.x, p.y, ball.r * 0.34, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // aim guide
    if (aiming && aimFrom && aimTo) {
      var v = shotVector();
      ctx.setLineDash([W * 0.014, W * 0.02]);
      ctx.strokeStyle = 'rgba(255,209,102,.6)';
      ctx.lineWidth = Math.max(1, W * 0.006);
      ctx.beginPath();
      var px = ball.x, py = ball.y, pvx = v.vx, pvy = v.vy;
      ctx.moveTo(px, py);
      for (var s = 0; s < 26; s++) {
        px += pvx * 26; py += pvy * 26; pvy += GRAV * H * 26;
        ctx.lineTo(px, py);
      }
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // the moon
    var mg = ctx.createRadialGradient(ball.x - ball.r * .35, ball.y - ball.r * .4, ball.r * .12,
                                      ball.x, ball.y, ball.r);
    mg.addColorStop(0, '#fff8e2'); mg.addColorStop(.6, '#ffd166'); mg.addColorStop(1, '#c98f28');
    ctx.fillStyle = mg;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, 6.283); ctx.fill();
    ctx.fillStyle = 'rgba(160,110,30,.32)';
    ctx.beginPath(); ctx.arc(ball.x + ball.r * .28, ball.y - ball.r * .2, ball.r * .17, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(ball.x - ball.r * .22, ball.y + ball.r * .3, ball.r * .12, 0, 6.283); ctx.fill();

    // sparks
    for (var k = 0; k < sparks.length; k++) {
      var sp = sparks[k];
      ctx.globalAlpha = Math.max(0, sp.life / 600);
      ctx.fillStyle = sp.c;
      ctx.beginPath(); ctx.arc(sp.x, sp.y, sp.r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function shotVector() {
    var dx = aimFrom.x - aimTo.x, dy = aimFrom.y - aimTo.y;
    var d = Math.hypot(dx, dy);
    if (!d) return { vx: 0, vy: 0 };

    // How far you drag is measured against the SHORT side, so the pull feels
    // the same length on any screen.
    var maxPull = Math.min(W, H) * 0.42;
    var power = Math.min(1, d / maxPull);

    // But launch speed has to scale with court HEIGHT, because gravity does
    // (GRAV * H). Speed used to scale with width, which quietly made the game
    // unwinnable whenever the court got tall and narrow: on a 3:4 phone court a
    // full-power, perfectly vertical shot only just reached rim height with
    // zero speed left, so nothing could ever drop through. Desktop was capped
    // by max-height:64vh to a squarer 0.9:1, which is why it played fine there.
    // Tied to H, the required pull is now identical on phone and desktop.
    var vmax = H * SHOT;

    return { vx: (dx / d) * power * vmax, vy: (dy / d) * power * vmax };
  }

  /* ------------------------------------------------ physics */
  function bounceOffRim(px, py) {
    var dx = ball.x - px, dy = ball.y - py;
    var d = Math.hypot(dx, dy);
    var min = ball.r + hoop.rimR;
    if (d >= min || d === 0) return;
    var nx = dx / d, ny = dy / d;
    ball.x = px + nx * min;
    ball.y = py + ny * min;
    var dot = ball.vx * nx + ball.vy * ny;
    ball.vx = (ball.vx - 2 * dot * nx) * 0.62;
    ball.vy = (ball.vy - 2 * dot * ny) * 0.62;
  }

  function step(dt) {
    if (hoop && score >= 3) {                 // the ring starts drifting once you find range
      var sp = W * 0.00016 * Math.min(2.4, 1 + score * 0.06);
      hoop.x += sp * hoop.dir * dt;
      var lo = W * 0.22, hi = W * 0.78;
      if (hoop.x < lo) { hoop.x = lo; hoop.dir = 1; }
      if (hoop.x > hi) { hoop.x = hi; hoop.dir = -1; }
    }
    if (!ball.live) return;

    var prevY = ball.y;
    ball.vy += GRAV * H * dt;
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    trail.push({ x: ball.x, y: ball.y });
    if (trail.length > 16) trail.shift();

    // walls
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = -ball.vx * 0.7; }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -ball.vx * 0.7; }

    // backboard: a vertical board, so only its facing side rebounds
    var bb = board();
    if (ball.y + ball.r > bb.y && ball.y - ball.r < bb.y + bb.h &&
        ball.x + ball.r > bb.x && ball.x - ball.r < bb.x + bb.w) {
      if (bb.right) { ball.x = bb.x - ball.r; ball.vx = -Math.abs(ball.vx) * 0.66; }
      else { ball.x = bb.x + bb.w + ball.r; ball.vx = Math.abs(ball.vx) * 0.66; }
    }

    bounceOffRim(hoop.x - hoop.r, hoop.y);
    bounceOffRim(hoop.x + hoop.r, hoop.y);

    // through the ring, downward, between the posts
    if (!counted && prevY + ball.r <= hoop.y && ball.y + ball.r > hoop.y && ball.vy > 0) {
      if (ball.x > hoop.x - hoop.r + ball.r * 0.15 && ball.x < hoop.x + hoop.r - ball.r * 0.15) {
        counted = true; scored = true; sink();
      }
    }

    if (ball.y - ball.r > H + H * 0.1) { settle(); }
  }

  function burst(x, y) {
    if (reduced) return;
    var cols = ['#ffd166', '#ff44cc', '#22e0ff', '#ffffff'];
    for (var i = 0; i < 22; i++) {
      sparks.push({ x: x, y: y, vx: (Math.random() - .5) * 0.6, vy: (Math.random() - .8) * 0.6,
                    r: Math.random() * W * 0.008 + 1, life: 600, c: cols[i % cols.length] });
    }
  }

  function flash(text) {
    msgEl.textContent = text;
    msgEl.dataset.on = 'true';
    clearTimeout(flash.t);
    flash.t = setTimeout(function () { msgEl.dataset.on = 'false'; }, 900);
  }

  function sink() {
    score++; streak++;
    document.getElementById('score').textContent = score;
    document.getElementById('streak').textContent = streak;
    if (streak > best) {
      best = streak;
      document.getElementById('best').textContent = best;
      try { localStorage.setItem(LS, String(best)); } catch (e) {}
    }
    burst(hoop.x, hoop.y);
    flash(streak >= 3 ? 'ON FIRE \u00d7' + streak : 'SWISH');
  }

  function settle() {
    if (!scored) {
      misses++; streak = 0;
      document.getElementById('miss').textContent = misses;
      document.getElementById('streak').textContent = 0;
      if (misses >= 3) { finish(); return; }
      flash('MISS');
    }
    placeHoop(false);
    newBall();
  }

  function finish() {
    over = true;
    ball.live = false;
    document.getElementById('endText').textContent =
      'You sank ' + score + '. Longest streak ' + best + '.';
    veil.dataset.on = 'true';
  }

  function reset() {
    score = 0; streak = 0; misses = 0; over = false;
    document.getElementById('score').textContent = 0;
    document.getElementById('streak').textContent = 0;
    document.getElementById('miss').textContent = 0;
    veil.dataset.on = 'false';
    hoop = null; placeHoop(true); newBall();
  }

  /* ------------------------------------------------ input */
  function pt(e) {
    var r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
  }
  court.addEventListener('pointerdown', function (e) {
    if (over || ball.live) return;
    var p = pt(e);
    aiming = true; aimFrom = { x: ball.x, y: ball.y }; aimTo = p;
    try { court.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });
  court.addEventListener('pointermove', function (e) {
    if (!aiming) return;
    aimTo = pt(e);
    e.preventDefault();
  });
  ['pointerup', 'pointercancel'].forEach(function (ev) {
    court.addEventListener(ev, function () {
      if (!aiming) return;
      aiming = false;
      var v = shotVector();
      if (Math.hypot(v.vx, v.vy) < 0.06) { aimFrom = aimTo = null; return; }
      ball.vx = v.vx; ball.vy = v.vy; ball.live = true;
      aimFrom = aimTo = null;
    });
  });

  document.getElementById('again').addEventListener('click', reset);
  document.getElementById('restart').addEventListener('click', reset);
  window.addEventListener('resize', function () { resize(); });

  /* ------------------------------------------------ loop */
  var last = performance.now();
  function loop(now) {
    var dt = Math.min(34, now - last);
    last = now;
    if (!over) step(dt);
    for (var i = sparks.length - 1; i >= 0; i--) {
      var s = sparks[i];
      s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 0.0016 * dt; s.life -= dt;
      if (s.life <= 0) sparks.splice(i, 1);
    }
    draw();
    requestAnimationFrame(loop);
  }

  resize();
  requestAnimationFrame(loop);
})();
</script>
<script src="mm-nav.js?v=3" defer></script>
</body>
</html>
