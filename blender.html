<style>
:root{
  --void:#07060e;--violet:#a020f0;--magenta:#ff44cc;--gold:#ffd166;--cyan:#22e0ff;
  --mist:#b8b0d4;--dim:#6f6890;--line:rgba(184,176,212,.15);--panel:rgba(18,12,34,.66);
  --brew:#6b5cc4;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;padding:0 14px 50px;background:var(--void);color:var(--mist);
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:15px;line-height:1.5;
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.4;
  background:
    radial-gradient(110% 60% at 50% -12%, #1d1140 0%, transparent 58%),
    radial-gradient(1px 1px at 16% 26%, rgba(255,255,255,.7) 50%, transparent 50%),
    radial-gradient(1px 1px at 68% 48%, rgba(255,209,102,.6) 50%, transparent 50%);
  background-size:auto,190px 190px,190px 190px;
}
a{color:var(--cyan)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:600px;margin:0 auto}

header{text-align:center;padding:24px 0 6px}
.eyebrow{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);margin:0 0 10px}
h1{
  font-family:"Orbitron",sans-serif;font-weight:700;font-size:clamp(20px,5.2vw,30px);
  letter-spacing:.05em;margin:0;color:transparent;
  background:linear-gradient(96deg,var(--violet),var(--magenta) 28%,var(--gold) 58%,var(--cyan) 86%,var(--violet));
  background-size:220% 100%;-webkit-background-clip:text;background-clip:text;
  animation:holo 11s linear infinite;
}
@keyframes holo{to{background-position:220% 0}}

/* --------------------------------------------------------- jar */
.rig{display:flex;flex-direction:column;align-items:center;margin:18px 0 6px}
.jar{
  position:relative;width:min(200px,52vw);aspect-ratio:.78;
  border:2px solid rgba(184,176,212,.4);border-radius:10px 10px 26px 26px;
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.01));
  overflow:hidden;box-shadow:0 0 34px rgba(160,32,240,.28), inset 0 0 26px rgba(0,0,0,.5);
}
.jar::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(112deg,rgba(255,255,255,.16) 0 18%,transparent 24%);
}
.liquid{
  position:absolute;left:0;right:0;bottom:0;height:0%;
  background:var(--brew);
  transition:height .45s ease, background .5s ease;
}
.liquid::before{
  content:"";position:absolute;left:-50%;right:-50%;top:-14px;height:26px;border-radius:50%;
  background:inherit;filter:brightness(1.2);
}
.blending .liquid{animation:churn .6s linear infinite}
@keyframes churn{
  0%,100%{transform:translateX(0) skewY(0)}
  25%{transform:translateX(-5px) skewY(1.2deg)}
  75%{transform:translateX(5px) skewY(-1.2deg)}
}
.bub{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);pointer-events:none;
  animation:up 1.1s linear forwards}
@keyframes up{to{transform:translateY(-120px);opacity:0}}

.lid{
  width:min(150px,42vw);height:16px;border-radius:5px 5px 2px 2px;margin-bottom:-2px;
  background:linear-gradient(180deg,#4b3a72,#2a1f45);border:1px solid rgba(184,176,212,.35);
}
.base{
  width:min(180px,48vw);height:44px;border-radius:4px 4px 12px 12px;margin-top:-3px;
  background:linear-gradient(180deg,#3b2a5e,#191029);border:1px solid rgba(184,176,212,.3);
  display:grid;place-items:center;
}
.switch{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--void);border:0;border-radius:999px;padding:10px 20px;min-height:36px;cursor:pointer;
  background:linear-gradient(96deg,var(--gold),#ffe9b5 55%,var(--gold));
  touch-action:none;user-select:none;
}
.switch:disabled{opacity:.35;cursor:default;background:#3a2f56;color:var(--dim)}
.gauge{width:min(180px,48vw);height:4px;border-radius:3px;background:rgba(255,255,255,.09);margin-top:9px;overflow:hidden}
.gauge i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--magenta),var(--gold));transition:width .08s linear}

.slots{display:flex;gap:7px;justify-content:center;margin:14px 0 0;flex-wrap:wrap;min-height:34px}
.slot{
  border:1px dashed rgba(184,176,212,.3);border-radius:999px;padding:6px 12px;font-size:12px;
  color:var(--mist);background:rgba(255,255,255,.03);cursor:pointer;
}
.slot b{font-style:normal;margin-right:5px}
.slot.empty{color:var(--dim);cursor:default;border-style:dotted}

/* --------------------------------------------------------- shelf */
h2{
  font-family:"Orbitron",sans-serif;font-size:10px;font-weight:500;letter-spacing:.26em;
  text-transform:uppercase;color:var(--dim);text-align:center;margin:26px 0 11px;
}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:7px}
.ing{
  border:1px solid var(--line);border-radius:11px;padding:9px 6px;background:var(--panel);
  cursor:pointer;text-align:center;color:inherit;font:inherit;
  transition:border-color .15s,opacity .15s;
}
.ing:hover:not(:disabled){border-color:var(--gold)}
.ing:disabled{opacity:.3;cursor:default}
.ing[data-in="true"]{border-color:var(--magenta);background:rgba(255,68,204,.13)}
.ing .g{display:block;font-size:19px;line-height:1.3}
.ing .n{display:block;font-size:10px;letter-spacing:.03em;color:var(--mist)}

/* --------------------------------------------------------- result */
.result{
  margin:22px 0 0;border:1px solid var(--line);border-radius:14px;padding:20px 17px;
  background:var(--panel);text-align:center;
}
.result[hidden]{display:none}
.swatch{width:52px;height:52px;border-radius:50%;margin:0 auto 12px;
  border:2px solid rgba(255,255,255,.25);box-shadow:0 0 22px rgba(255,255,255,.14)}
.bname{font-family:"Orbitron",sans-serif;font-size:19px;letter-spacing:.05em;color:var(--gold);margin:0 0 4px}
.btag{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin:0 0 13px}
.reading{font-family:"Spectral",Georgia,serif;font-style:italic;font-size:16px;color:#fff;margin:0 0 14px;line-height:1.5}
.sign{
  font-family:"Spectral",Georgia,serif;font-style:italic;font-size:14px;color:var(--cyan);
  border-top:1px solid var(--line);padding-top:13px;margin:0;
}
.rare{color:var(--magenta);font-size:10px;letter-spacing:.2em;text-transform:uppercase;margin:0 0 8px}

.bar{display:flex;gap:9px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.btn{
  font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;color:var(--mist);background:transparent;
  border:1px solid rgba(184,176,212,.3);border-radius:999px;padding:11px 17px;min-height:44px;cursor:pointer;
}
.btn:hover{border-color:var(--gold);color:var(--gold)}

.book{margin:26px 0 0}
.book ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.book li{
  display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;
  padding:9px 12px;background:rgba(12,8,24,.5);font-size:13px;
}
.book .dot{width:15px;height:15px;border-radius:50%;flex:none;border:1px solid rgba(255,255,255,.2)}
.book .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff}
.book .ing2{font-size:10px;color:var(--dim);white-space:nowrap}
.empty{text-align:center;color:var(--dim);font-size:12px}

@media(prefers-reduced-motion:reduce){h1{animation:none}.blending .liquid{animation:none}.bub{display:none}}
</style>
</head>

</div>

    if (reduced) return;
    var b = document.createElement('span');
    b.className = 'bub';
    var sz = Math.random() * 7 + 3;
    b.style.width = b.style.height = sz + 'px';
    b.style.left = (10 + Math.random() * 78) + '%';
    b.style.bottom = '6%';
    jar.appendChild(b);
    setTimeout(function () { b.remove(); }, 1100);
  }

  function startHold(e) {
    if (sw.disabled || holding) return;
    e.preventDefault();
    holding = true; held = 0;
    jar.classList.add('blending');
    whirr(true);
    timer = setInterval(function () {
      held += 40;
      gauge.style.width = Math.min(100, held / NEED * 100) + '%';
      if (held % 160 === 0) bubble();
      if (held >= NEED) { stopHold(); brew(); }
    }, 40);
  }
  function stopHold() {
    if (!holding) return;
    holding = false;
    clearInterval(timer); timer = null;
    jar.classList.remove('blending');
    whirr(false);
    gauge.style.width = '0';
  }
  sw.addEventListener('pointerdown', startHold);
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) {
    sw.addEventListener(ev, stopHold);
  });

  /* a short motor whirr, only while the switch is held */
  var ac = null, motor = null, motorGain = null;
  function whirr(on) {
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      if (on) {
        motor = ac.createOscillator(); motorGain = ac.createGain();
        motor.type = 'sawtooth';
        motor.frequency.setValueAtTime(72, ac.currentTime);
        motor.frequency.linearRampToValueAtTime(118, ac.currentTime + 0.9);
        motorGain.gain.setValueAtTime(0.0001, ac.currentTime);
        motorGain.gain.linearRampToValueAtTime(0.035, ac.currentTime + 0.12);
        motor.connect(motorGain); motorGain.connect(ac.destination);
        motor.start();
      } else if (motor) {
        motorGain.gain.linearRampToValueAtTime(0.0001, ac.currentTime + 0.12);
        motor.stop(ac.currentTime + 0.16);
        motor = null;
      }
    } catch (e) {}
  }

  /* ------------------------------------------------ the brew */
  function dominant() {
    var tally = {};
    chosen.forEach(function (i) { tally[i.e] = (tally[i.e] || 0) + 1; });
    var bestK = null, bestV = -1;
    Object.keys(tally).forEach(function (k) { if (tally[k] > bestV) { bestV = tally[k]; bestK = k; } });
    return { el: bestK, n: bestV, pure: bestV === chosen.length };
  }

  function secretFor(ids) {
    var key = ids.slice().sort().join(',');
    for (var i = 0; i < SECRETS.length; i++) {
      if (SECRETS[i].k.slice().sort().join(',') === key) return SECRETS[i];
    }
    return null;
  }

  // the same jar always gives the same brew
  function seedOf(ids) {
    var s = 0, str = ids.slice().sort().join(',');
    for (var i = 0; i < str.length; i++) { s = (s * 31 + str.charCodeAt(i)) >>> 0; }
    return s;
  }

  function brew() {
    var ids = chosen.map(function (i) { return i.id; });
    var seed = seedOf(ids);
    var d = dominant();
    var lex = LEX[d.el];
    var secret = secretFor(ids);

    var name = secret ? secret.n
      : lex.adj[seed % lex.adj.length] + ' ' + lex.nz[(seed >>> 3) % lex.nz.length];

    var tag = secret ? secret.s
      : d.pure ? ('Pure ' + d.el) : (d.el + ', mostly');

    var reading = lex.say;
    if (chosen.length === 4) reading += ' Four things is a lot to ask of one jar.';
    else if (d.pure && chosen.length > 2) reading += ' Nothing in here disagrees with anything else.';

    var sign = SIGNS.length ? SIGNS[seed % SIGNS.length].a : '';

    lastBrew = { ids: ids, name: name, tag: tag, colour: mix(chosen) };

    document.getElementById('swatch').style.background = lastBrew.colour;
    document.getElementById('bname').textContent = name;
    document.getElementById('btag').textContent = tag;
    document.getElementById('reading').textContent = reading;
    document.getElementById('sign').textContent = sign ? '\u2726 ' + sign : '';
    var rare = document.getElementById('rare');
    rare.hidden = !secret;
    if (secret) rare.textContent = 'you found something';
    res.hidden = false;
    res.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'nearest' });
  }

  /* ------------------------------------------------ recipe book */
  function readBook() {
    try { return JSON.parse(localStorage.getItem(LS)) || []; } catch (e) { return []; }
  }
  function writeBook(b) { try { localStorage.setItem(LS, JSON.stringify(b)); } catch (e) {} }

  function renderBook() {
    var book = readBook();
    var ul = document.getElementById('bookList');
    ul.textContent = '';
    if (!book.length) {
      var li = document.createElement('li');
      li.className = 'empty';
      li.textContent = 'Nothing written down yet.';
      ul.appendChild(li);
      return;
    }
    book.slice().reverse().forEach(function (b) {
      var li = document.createElement('li');
      var d = document.createElement('span');
      d.className = 'dot'; d.style.background = b.colour;
      var n = document.createElement('span');
      n.className = 'nm'; n.textContent = b.name;
      var g = document.createElement('span');
      g.className = 'ing2';
      g.textContent = b.ids.map(function (id) {
        var f = SHELF.filter(function (s) { return s.id === id; })[0];
        return f ? f.g : '';
      }).join(' ');
      li.appendChild(d); li.appendChild(n); li.appendChild(g);
      li.title = 'Put this back in the jar';
      li.style.cursor = 'pointer';
      li.addEventListener('click', function () {
        chosen = b.ids.map(function (id) {
          return SHELF.filter(function (s) { return s.id === id; })[0];
        }).filter(Boolean);
        paint();
        window.scrollTo({ top: 0, behavior: reduced ? 'auto' : 'smooth' });
      });
      ul.appendChild(li);
    });
  }

  document.getElementById('keep').addEventListener('click', function () {
    if (!lastBrew) return;
    var book = readBook();
    if (book.some(function (b) { return b.name === lastBrew.name; })) return;
    book.push(lastBrew);
    if (book.length > 40) book.shift();
    writeBook(book);
    renderBook();
  });

  document.getElementById('clear').addEventListener('click', function () {
    chosen = [];
    lastBrew = null;
    res.hidden = true;
    paint();
  });

  paint();
  renderBook();
})();
</script>

    + '.mm-sheet{position:absolute;top:0;right:0;bottom:0;width:min(400px,88vw);'

    + '@media(min-width:900px){.mm-links{display:flex}.mm-spacer{display:none}}'

  function el(tag, cls, text) {

    if (cls) e.className = cls;
    if (text) e.textContent = text;

  }

  var here = (location.pathname.split('/').pop() || 'index.html').toLowerCase();

  function link(href, label) {
    var a = el('a', null, label);
    a.href = href;
    if (href.toLowerCase() === here) a.setAttribute('aria-current', 'page');
    if (/^https?:/.test(href) && href.indexOf('magickmica.github.io') === -1) {

      a.rel = 'noopener';
      a.textContent = label + ' \u2197';

    if (document.querySelector('.mm-bar')) return;   // never inject twice

    var style = el('style');

    /* ---------------- bar ---------------- */
    var bar = el('nav', 'mm-bar');

    var brand = el('a', 'mm-brand', '\u2726 MAGICKMICA');

    close.addEventListener('click', shut);
    scrim.addEventListener('click', shut);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && drawer.getAttribute('data-open') === 'true') shut();

      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
