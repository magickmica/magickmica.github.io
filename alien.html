<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Visitor</title>

<!--
  Save this file anywhere and double-click it.
  Needs an internet connection the first time (it pulls three.js and the
  fonts from a CDN). Everything else — the craft, the beam, every sound —
  is generated in this file. No images, no audio files, no build step.

  Drag the sky to walk around him. The switches are at the bottom.
-->

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;800&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet" />

<style>
	:root {
		--night:   #120d24;   /* top of the sky */
		--dusk:    #3d2456;   /* mid sky */
		--horizon: #9d5a6b;   /* dusty rose down at the treeline */
		--sodium:  #ffb84d;   /* the beam, the lamps, every ON state */
		--mint:    #7ff0c4;   /* dome glass and alien. Used sparingly. */
		--ivory:   #f2e9dc;
		--slab:    #1b1430;   /* the console body */
	}

	* { box-sizing: border-box; }

	html, body {
		margin: 0;
		height: 100%;
		overflow: hidden;
		background: var(--night);
	}

	body {
		font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
		color: var(--ivory);
		/* Dusk, not midnight. The sky is the largest surface on the page, so
		   it does the most work: rose glow at the bottom, deep violet up top. */
		background:
			radial-gradient(120% 62% at 50% 108%, var(--horizon) 0%, transparent 62%),
			linear-gradient(180deg, var(--night) 0%, var(--dusk) 68%, #5c3358 100%);
	}

	#stage {
		position: fixed;
		inset: 0;
		touch-action: none;
		cursor: grab;
	}
	#stage.dragging { cursor: grabbing; }
	#stage canvas { display: block; }

	.overlay {
		position: fixed;
		inset: 0;
		display: flex;
		flex-direction: column;
		justify-content: space-between;
		padding: clamp(1.1rem, 3.5vw, 2.4rem);
		pointer-events: none;   /* so drags fall through to the sky */
	}

	/* ── masthead ── */
	.masthead { max-width: 30ch; }

	.title {
		font-family: 'Big Shoulders Display', ui-sans-serif, sans-serif;
		font-weight: 800;
		font-size: clamp(3.6rem, 14vw, 8.5rem);
		line-height: 0.82;
		letter-spacing: -0.02em;
		text-transform: uppercase;
		margin: 0;
	}

	.standfirst {
		margin: 0.85rem 0 0;
		font-size: 0.9rem;
		line-height: 1.5;
		max-width: 26ch;
		color: color-mix(in srgb, var(--ivory) 66%, transparent);
	}

	/* ── console ── */
	.console {
		pointer-events: auto;
		align-self: center;
		display: flex;
		flex-wrap: wrap;
		justify-content: center;
		gap: clamp(0.5rem, 2vw, 1.1rem);
		padding: clamp(0.7rem, 2vw, 1rem) clamp(0.9rem, 2.5vw, 1.4rem);
		border-radius: 14px;
		background: color-mix(in srgb, var(--slab) 82%, transparent);
		border: 1px solid color-mix(in srgb, var(--ivory) 14%, transparent);
		box-shadow: 0 18px 50px -18px #000, inset 0 1px 0 color-mix(in srgb, var(--ivory) 12%, transparent);
		backdrop-filter: blur(9px);
	}

	/* The switches are the signature: chunky panel throws with a real
	   indicator lamp, not chips. The lamp carries the state — the knob is
	   just there to tell you it moved. */
	.switch {
		appearance: none;
		border: 0;
		background: none;
		padding: 0.35rem 0.15rem;
		display: grid;
		justify-items: center;
		gap: 0.5rem;
		cursor: pointer;
		font: inherit;
		color: inherit;
		border-radius: 9px;
	}
	.switch:focus-visible { outline: 2px solid var(--sodium); outline-offset: 3px; }

	.throw {
		width: 56px;
		height: 27px;
		border-radius: 999px;
		background: #0d0a1a;
		border: 1px solid color-mix(in srgb, var(--ivory) 16%, transparent);
		box-shadow: inset 0 2px 6px #000;
		position: relative;
	}
	.knob {
		position: absolute;
		top: 3px;
		left: 3px;
		width: 19px;
		height: 19px;
		border-radius: 50%;
		background: linear-gradient(180deg, #fffaf2, #c9bda9);
		box-shadow: 0 2px 4px #000a;
		transition: transform 0.34s cubic-bezier(0.34, 1.7, 0.5, 1);
	}
	.switch[aria-pressed="true"] .knob { transform: translateX(29px); }
	.switch[aria-pressed="true"] .throw {
		background: color-mix(in srgb, var(--sodium) 26%, #0d0a1a);
		box-shadow: inset 0 2px 6px #0008, 0 0 16px -2px var(--sodium);
	}

	.label {
		font-family: 'Big Shoulders Display', ui-sans-serif, sans-serif;
		font-weight: 500;
		font-size: 0.95rem;
		letter-spacing: 0.16em;
		text-transform: uppercase;
		color: color-mix(in srgb, var(--ivory) 60%, transparent);
	}
	.switch[aria-pressed="true"] .label { color: var(--ivory); }

	/* Momentary button. It fires once and springs back, so it is shaped
	   like a button and not like a switch. */
	.press .throw {
		display: grid;
		place-items: center;
		background: linear-gradient(180deg, #4a2f66, #2a1a40);
		border-color: color-mix(in srgb, var(--mint) 30%, transparent);
		transition: transform 0.1s ease;
	}
	.press:active .throw { transform: translateY(2px); }
	.press .dot {
		width: 9px; height: 9px; border-radius: 50%;
		background: var(--mint);
		box-shadow: 0 0 12px var(--mint);
		opacity: 0.55;
	}
	.press:active .dot, .press.lit .dot { opacity: 1; }

	/* ── the dock ──
	   Top corner, out of the way of the craft and the console. Each link
	   lights in its own colour on hover so they read as two destinations
	   rather than one menu. */
	.dock {
		position: fixed;
		top: clamp(0.9rem, 3vw, 1.6rem);
		right: clamp(0.9rem, 3vw, 1.6rem);
		display: flex;
		gap: 0.5rem;
		z-index: 5;
	}

	.chip {
		display: inline-flex;
		align-items: center;
		gap: 0.45rem;
		padding: 0.5rem 0.8rem;
		border-radius: 999px;
		text-decoration: none;
		font-family: 'Big Shoulders Display', ui-sans-serif, sans-serif;
		font-weight: 500;
		font-size: 0.9rem;
		letter-spacing: 0.14em;
		text-transform: uppercase;
		color: color-mix(in srgb, var(--ivory) 68%, transparent);
		background: color-mix(in srgb, var(--slab) 80%, transparent);
		border: 1px solid color-mix(in srgb, var(--ivory) 16%, transparent);
		backdrop-filter: blur(8px);
		transition: color 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, transform 0.1s ease;
	}
	.chip svg { width: 18px; height: 18px; flex: none; }
	.chip:active { transform: translateY(1px); }
	.chip:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }

	.chip.tip:hover, .chip.tip:focus-visible {
		color: var(--sodium);
		border-color: var(--sodium);
		box-shadow: 0 0 20px -6px var(--sodium);
	}
	.chip.arcade:hover, .chip.arcade:focus-visible {
		color: var(--mint);
		border-color: var(--mint);
		box-shadow: 0 0 20px -6px var(--mint);
	}

	.fallback {
		position: fixed;
		inset: 0;
		display: none;
		place-items: center;
		text-align: center;
		padding: 2rem;
		line-height: 1.6;
	}

	@media (max-width: 620px) {
		/* labels go, icons stay — the dock shrinks to two round buttons */
		.chip span { display: none; }
		.chip { padding: 0.6rem; }
	}

	@media (max-width: 460px) {
		.console { gap: 0.35rem; padding: 0.6rem 0.7rem; }
		.throw { width: 46px; }
		.switch[aria-pressed="true"] .knob { transform: translateX(19px); }
		.label { font-size: 0.8rem; letter-spacing: 0.1em; }
		.standfirst { display: none; }
	}

	@media (prefers-reduced-motion: reduce) {
		.knob { transition: none; }
	}
</style>
</head>
<body>

<div id="stage"></div>

<nav class="dock" aria-label="Elsewhere">
	<a class="chip tip" href="https://ko-fi.com/magickmica/tip" target="_blank" rel="noopener noreferrer" title="Leave a tip on Ko-fi">
		<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true">
			<path d="M12 2.8l2.85 5.9 6.4.95-4.63 4.55 1.1 6.4L12 17.55 6.28 20.6l1.1-6.4L2.75 9.65l6.4-.95z" />
		</svg>
		<span>Tip</span>
	</a>
	<a class="chip arcade" href="https://magickmica.github.io/arcade.html" target="_blank" rel="noopener noreferrer" title="Go to the Arcade">
		<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
			<rect x="2.4" y="7.4" width="19.2" height="9.2" rx="4.6" />
			<path d="M7 10.6v2.8M5.6 12h2.8" />
			<circle cx="16.1" cy="11.2" r="0.95" fill="currentColor" stroke="none" />
			<circle cx="18.3" cy="13.4" r="0.95" fill="currentColor" stroke="none" />
		</svg>
		<span>Arcade</span>
	</a>
</nav>

<div class="overlay">
	<header class="masthead">
		<h1 class="title">Visitor</h1>
		<p class="standfirst">Hovering, engine warm, a long way from anywhere. Drag the sky to walk around him.</p>
	</header>

	<div class="console" role="group" aria-label="Craft controls">
		<button class="switch" id="sw-beam" aria-pressed="true">
			<span class="throw"><span class="knob"></span></span>
			<span class="label">Beam</span>
		</button>
		<button class="switch" id="sw-lights" aria-pressed="true">
			<span class="throw"><span class="knob"></span></span>
			<span class="label">Lights</span>
		</button>
		<button class="switch" id="sw-sound" aria-pressed="false">
			<span class="throw"><span class="knob"></span></span>
			<span class="label">Hum</span>
		</button>
		<button class="switch press" id="btn-hail">
			<span class="throw"><span class="dot"></span></span>
			<span class="label">Say hello</span>
		</button>
	</div>
</div>

<div class="fallback" id="fallback">
	<p>This browser can't run WebGL, so the craft has nowhere to land.<br />
	Try opening the file in Chrome, Firefox, or Safari.</p>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.184.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

const TWO_PI = Math.PI * 2;
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ══ THE ALIEN ════════════════════════════════════════════════════════════
   Unchanged from the standalone file. The head is still one function.
*/

const A = 0.72;   // lower toward 0.4 and the jaw fills out
const B = 0.3;    // raise it and the skull domes harder
const PEAK = Math.pow(A / (A + B), A) * Math.pow(B / (A + B), B);
const WIDTH = (t) => Math.pow(Math.max(t, 0), A) * Math.pow(Math.max(1 - t, 0), B) / PEAK;
const DEPTH = (t) => 0.74 + 0.26 * Math.min(1, Math.max(0, (t - 0.15) / 0.5));
const HEIGHT_AT = (t) => (t - 0.48) * 2.15;
const FLAT = 0.22;

const surfacePoint = (t, a) => {
	const w = WIDTH(t);
	const zn = Math.sin(a);
	const band = Math.exp(-(((t - 0.46) / 0.42) ** 2));
	const flat = 1 - FLAT * band * (zn > 0 ? zn * zn : 0);
	return new THREE.Vector3(Math.cos(a) * w, HEIGHT_AT(t), zn * w * DEPTH(t) * flat);
};

const normalAt = (t, a) => {
	const e = 1e-3;
	const dt = surfacePoint(Math.min(1, t + e), a).sub(surfacePoint(Math.max(0, t - e), a));
	const da = surfacePoint(t, a + e).sub(surfacePoint(t, a - e));
	return new THREE.Vector3().crossVectors(dt, da).normalize();
};

const SKIN = [0.55, 0.63, 0.55];
const RIM  = [0.62, 0.86, 0.90];

const skinMatcap = () => {
	const S = 256;
	const d = new Uint8Array(S * S * 4);
	const unit = (x, y, z) => { const l = Math.hypot(x, y, z); return [x / l, y / l, z / l]; };
	const L1 = unit(-0.42, 0.55, 0.72);
	const L2 = unit(0.66, -0.12, 0.74);
	const H1 = unit(L1[0], L1[1], L1[2] + 1);
	const enc = (v) => Math.max(0, Math.min(255, Math.round(Math.pow(Math.max(0, v), 1 / 2.2) * 255)));
	for (let j = 0; j < S; j++) {
		for (let i = 0; i < S; i++) {
			let nx = (i / (S - 1)) * 2 - 1;
			let ny = 1 - (j / (S - 1)) * 2;
			const r = Math.hypot(nx, ny);
			if (r > 1) { nx /= r; ny /= r; }
			const nz = Math.sqrt(Math.max(0, 1 - nx * nx - ny * ny));
			const d1 = Math.max(0, (nx * L1[0] + ny * L1[1] + nz * L1[2] + 0.35) / 1.35);
			const d2 = Math.max(0, nx * L2[0] + ny * L2[1] + nz * L2[2]);
			const sp = Math.pow(Math.max(0, nx * H1[0] + ny * H1[1] + nz * H1[2]), 46);
			const fr = Math.pow(1 - nz, 3.2);
			const lum = 0.14 + 0.78 * d1 * d1 + 0.2 * d2;
			const o = (j * S + i) * 4;
			d[o]     = enc(SKIN[0] * lum + 0.5 * sp + RIM[0] * fr * 0.22);
			d[o + 1] = enc(SKIN[1] * lum + 0.5 * sp + RIM[1] * fr * 0.22);
			d[o + 2] = enc(SKIN[2] * lum + 0.5 * sp + RIM[2] * fr * 0.22);
			d[o + 3] = 255;
		}
	}
	const tex = new THREE.DataTexture(d, S, S);
	tex.colorSpace = THREE.SRGBColorSpace;
	tex.magFilter = THREE.LinearFilter;
	tex.minFilter = THREE.LinearFilter;
	tex.needsUpdate = true;
	return tex;
};

function buildAlien() {
	const group = new THREE.Group();
	const skin = new THREE.MeshMatcapMaterial({ matcap: skinMatcap() });

	const WS = 200, HS = 140;
	const g = new THREE.SphereGeometry(1, WS, HS);
	const P = g.attributes.position;
	for (let i = 0; i < P.count; i++) {
		const row = Math.floor(i / (WS + 1));
		const col = i % (WS + 1);
		const p = surfacePoint(1 - row / HS, (col / WS) * TWO_PI);
		P.setXYZ(i, p.x, p.y, p.z);
	}
	g.computeVertexNormals();

	// average normals across coincident verts, or the seam and the poles
	// draw as hairlines under a matcap
	const N = g.attributes.normal;
	const key = (i) => Math.round(P.getX(i) * 4000) + '_' + Math.round(P.getY(i) * 4000) + '_' + Math.round(P.getZ(i) * 4000);
	const acc = new Map();
	for (let i = 0; i < P.count; i++) {
		const k = key(i);
		const e = acc.get(k) || [0, 0, 0];
		e[0] += N.getX(i); e[1] += N.getY(i); e[2] += N.getZ(i);
		acc.set(k, e);
	}
	for (let i = 0; i < P.count; i++) {
		const e = acc.get(key(i));
		const l = Math.hypot(e[0], e[1], e[2]) || 1;
		N.setXYZ(i, e[0] / l, e[1] / l, e[2] / l);
	}
	group.add(new THREE.Mesh(g, skin));

	const inset = (mesh, t, a, depth) => {
		const p = surfacePoint(t, a);
		const n = normalAt(t, a);
		mesh.position.copy(p).addScaledVector(n, -depth);
		mesh.lookAt(p.clone().addScaledVector(n, 1));
		return mesh;
	};

	const eyeGeo = new THREE.SphereGeometry(1, 64, 48);
	const EP = eyeGeo.attributes.position;
	for (let i = 0; i < EP.count; i++) EP.setY(i, EP.getY(i) * (1 - 0.62 * EP.getX(i) ** 2));
	eyeGeo.computeVertexNormals();
	const eyeMat = new THREE.MeshPhysicalMaterial({
		color: 0x07080a, roughness: 0.05, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.05,
	});
	for (const side of [-1, 1]) {
		const eye = new THREE.Mesh(eyeGeo, eyeMat);
		eye.scale.set(0.34, 0.19, 0.26);
		inset(eye, 0.53, Math.PI / 2 + side * 0.6, 0.1);
		eye.rotateZ(side * 0.34);
		group.add(eye);
	}

	const dark = new THREE.MeshStandardMaterial({ color: 0x171b19, roughness: 0.85 });
	const slit = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 20), dark);
	slit.scale.set(0.12, 0.016, 0.05);
	group.add(inset(slit, 0.16, Math.PI / 2, 0.012));
	for (const side of [-1, 1]) {
		const n = new THREE.Mesh(new THREE.SphereGeometry(0.02, 16, 12), dark);
		group.add(inset(n, 0.3, Math.PI / 2 + side * 0.075, 0.012));
	}
	return group;
}

/* ══ THE CRAFT ════════════════════════════════════════════════════════════
   The hull is a LATHE: one 2D profile spun around the Y axis. That's the
   right tool for anything with rotational symmetry — you draw the edge you
   want in cross-section and the geometry follows it exactly, instead of
   stacking cones and hoping the joins hide.
*/

function buildHull() {
	const craft = new THREE.Group();

	// half the saucer's cross-section: belly, out to the rim, back up to
	// where the dome seats. Splined so the rim reads as an edge, not a fold.
	const profile = new THREE.CatmullRomCurve3([
		new THREE.Vector3(0.001, -0.30, 0),
		new THREE.Vector3(0.42, -0.315, 0),
		new THREE.Vector3(0.86, -0.255, 0),
		new THREE.Vector3(1.26, -0.135, 0),
		new THREE.Vector3(1.55, -0.005, 0),
		new THREE.Vector3(1.24, 0.095, 0),
		new THREE.Vector3(0.84, 0.155, 0),
		new THREE.Vector3(0.55, 0.175, 0),
	]).getPoints(56).map((p) => new THREE.Vector2(p.x, p.y));

	const hull = new THREE.Mesh(
		new THREE.LatheGeometry(profile, 128),
		new THREE.MeshStandardMaterial({ color: 0xb7c0cb, metalness: 0.95, roughness: 0.24 }),
	);
	craft.add(hull);

	// dark inlay ring — gives the eye a scale reference on a plain disc
	const inlay = new THREE.Mesh(
		new THREE.TorusGeometry(1.02, 0.035, 20, 128),
		new THREE.MeshStandardMaterial({ color: 0x2c3542, metalness: 0.7, roughness: 0.45 }),
	);
	inlay.rotation.x = Math.PI / 2;
	inlay.position.y = 0.085;
	craft.add(inlay);

	// ── rim lamps ──
	// Each gets its own material so it can be driven alone. The chase is a
	// travelling wave, not a flicker: brightness is sin(t − i·spacing)
	// raised to a high power, which keeps one lamp hot and lets the rest
	// fall away. That falloff is what reads as "going around".
	const lamps = [];
	const COUNT = 16;
	for (let i = 0; i < COUNT; i++) {
		const a = (i / COUNT) * TWO_PI;
		const bulb = new THREE.Mesh(
			new THREE.SphereGeometry(0.075, 20, 14),
			new THREE.MeshBasicMaterial({ color: 0xffb84d, toneMapped: false }),
		);
		bulb.position.set(Math.cos(a) * 1.44, -0.085, Math.sin(a) * 1.44);
		bulb.scale.y = 0.8;
		craft.add(bulb);
		lamps.push(bulb);
	}

	// Glass dome. Real transmission is expensive and tends to swallow what's
	// behind it; a light transparent shell with clearcoat sells it for a
	// fraction of the cost. depthWrite off so the head never punches through.
	const dome = new THREE.Mesh(
		new THREE.SphereGeometry(0.53, 64, 40, 0, TWO_PI, 0, Math.PI / 2),
		new THREE.MeshPhysicalMaterial({
			color: 0x9fe8d0, transparent: true, opacity: 0.24, roughness: 0.06,
			metalness: 0, clearcoat: 1, clearcoatRoughness: 0.04,
			side: THREE.DoubleSide, depthWrite: false,
		}),
	);
	dome.position.y = 0.16;
	dome.renderOrder = 4;
	craft.add(dome);

	// the seal where glass meets hull, so the dome isn't just pasted on
	const collar = new THREE.Mesh(
		new THREE.TorusGeometry(0.53, 0.028, 16, 96),
		new THREE.MeshStandardMaterial({ color: 0x8e99a6, metalness: 0.9, roughness: 0.3 }),
	);
	collar.rotation.x = Math.PI / 2;
	collar.position.y = 0.165;
	craft.add(collar);

	return { craft, lamps, dome };
}

/* ── the beam ──
   A cone with a hand-written shader. Additive blending plus DoubleSide does
   the heavy lifting: you see the far wall through the near one, so the
   silhouette edges add twice and glow on their own — no faked rim term.
   depthWrite off, or the cone carves a hole in the sky behind it.
*/
const beamMaterial = new THREE.ShaderMaterial({
	uniforms: {
		uTime: { value: 0 },
		uStrength: { value: 1 },
		uColor: { value: new THREE.Color(0xffb84d) },
	},
	vertexShader: `
		varying vec2 vUv;
		void main() {
			vUv = uv;
			gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
		}
	`,
	fragmentShader: `
		uniform float uTime;
		uniform float uStrength;
		uniform vec3 uColor;
		varying vec2 vUv;
		void main() {
			// uv.y is 0 at the wide bottom, 1 at the apex
			float fall = pow(vUv.y, 1.7);
			float scan = 0.78 + 0.22 * sin(vUv.y * 34.0 - uTime * 2.6);
			float a = fall * scan * 0.42 * uStrength;
			gl_FragColor = vec4(uColor * (0.6 + fall * 0.8), a);
		}
	`,
	transparent: true,
	blending: THREE.AdditiveBlending,
	depthWrite: false,
	side: THREE.DoubleSide,
});

const BEAM_TOP = -0.30, BEAM_BOTTOM = -5.6, BEAM_TOP_R = 0.5, BEAM_BOT_R = 2.75;

function buildBeam() {
	const h = BEAM_TOP - BEAM_BOTTOM;
	const cone = new THREE.Mesh(
		new THREE.CylinderGeometry(BEAM_TOP_R, BEAM_BOT_R, h, 72, 1, true),
		beamMaterial,
	);
	cone.position.y = (BEAM_TOP + BEAM_BOTTOM) / 2;
	cone.renderOrder = 2;
	return cone;
}

// Motes drifting UP the beam. Rising, not falling — falling dust is just
// weather; rising dust is the thing doing the pulling.
function buildMotes(count = 240) {
	const pos = new Float32Array(count * 3);
	const u = new Float32Array(count);      // 0 at the ground, 1 at the apex
	const ang = new Float32Array(count);
	const rad = new Float32Array(count);
	const spd = new Float32Array(count);
	for (let i = 0; i < count; i++) {
		u[i] = Math.random();
		ang[i] = Math.random() * TWO_PI;
		rad[i] = Math.sqrt(Math.random());   // sqrt, or they all crowd the axis
		spd[i] = 0.05 + Math.random() * 0.09;
	}
	const geo = new THREE.BufferGeometry();
	geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

	const c = document.createElement('canvas');
	c.width = c.height = 64;
	const cx = c.getContext('2d');
	const gr = cx.createRadialGradient(32, 32, 0, 32, 32, 32);
	gr.addColorStop(0, 'rgba(255,255,255,1)');
	gr.addColorStop(1, 'rgba(255,255,255,0)');
	cx.fillStyle = gr;
	cx.fillRect(0, 0, 64, 64);

	const points = new THREE.Points(geo, new THREE.PointsMaterial({
		size: 0.075, map: new THREE.CanvasTexture(c), color: 0xffd79a, transparent: true,
		blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
	}));
	points.renderOrder = 3;

	points.userData.step = (dt) => {
		for (let i = 0; i < count; i++) {
			u[i] += spd[i] * dt;
			if (u[i] > 1) u[i] -= 1;
			const y = BEAM_BOTTOM + (BEAM_TOP - BEAM_BOTTOM) * u[i];
			const r = (BEAM_BOT_R + (BEAM_TOP_R - BEAM_BOT_R) * u[i]) * rad[i] * 0.94;
			const a = ang[i] + u[i] * 0.6;
			pos[i * 3] = Math.cos(a) * r;
			pos[i * 3 + 1] = y;
			pos[i * 3 + 2] = Math.sin(a) * r;
		}
		geo.attributes.position.needsUpdate = true;
	};
	points.userData.step(0);
	return points;
}

function buildStars(count = 1100) {
	const pos = new Float32Array(count * 3);
	for (let i = 0; i < count; i++) {
		const th = Math.random() * TWO_PI;
		const ph = Math.acos(2 * Math.random() - 1);   // even over the sphere
		const r = 34 + Math.random() * 10;
		pos[i * 3] = r * Math.sin(ph) * Math.cos(th);
		pos[i * 3 + 1] = r * Math.cos(ph) * 0.7 + 6;
		pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
	}
	const geo = new THREE.BufferGeometry();
	geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
	return new THREE.Points(geo, new THREE.PointsMaterial({
		size: 0.28, color: 0xdfe6ff, transparent: true, opacity: 0.75,
		blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
	}));
}

/* ── the light room ──
   Softbox panels baked into an environment map. The hull is 95% metal, so
   nearly everything you see on it is a reflection of this room. Change the
   room and you change the craft.
*/
const buildLightRoom = () => {
	const room = new THREE.Scene();
	room.background = new THREE.Color(0x2c2438);
	const c = document.createElement('canvas');
	c.width = c.height = 256;
	const ctx = c.getContext('2d');
	const grad = ctx.createRadialGradient(128, 128, 24, 128, 128, 128);
	grad.addColorStop(0, '#ffffff');
	grad.addColorStop(1, '#000000');
	ctx.fillStyle = grad;
	ctx.fillRect(0, 0, 256, 256);
	const tex = new THREE.CanvasTexture(c);
	const panel = (w, h, x, y, z, intensity, tint) => {
		const m = new THREE.Mesh(
			new THREE.PlaneGeometry(w, h),
			new THREE.MeshBasicMaterial({
				map: tex, color: new THREE.Color(tint).multiplyScalar(intensity), side: THREE.DoubleSide,
			}),
		);
		m.position.set(x, y, z);
		m.lookAt(0, 0, 0);
		room.add(m);
	};
	panel(9, 6, -6, 6, 4, 2.6, 0xdfe8ff);   // key — cool, high, camera-left
	panel(7, 5, 6, 2, 4, 0.9, 0xffe2c2);    // fill — warm, camera-right
	panel(9, 3, 0, 6, -6, 1.5, 0xc9b6ff);   // rim — behind and above
	panel(9, 9, 0, -7, 0, 0.7, 0xff9d6b);   // ground bounce — the sodium beam
	return room;
};

/* ══ SOUND ════════════════════════════════════════════════════════════════
   Every sound here is synthesized. No audio files. Browsers refuse to start
   audio until you interact with the page, so the context is created lazily
   on the first press and Hum starts OFF.
*/
const Sfx = (() => {
	let ctx = null, master = null, noiseBuf = null;

	const init = () => {
		if (ctx) return;
		ctx = new (window.AudioContext || window.webkitAudioContext)();
		master = ctx.createGain();
		master.gain.value = 0;
		master.connect(ctx.destination);

		// a second of white noise, reused for clicks and the beam wash
		noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
		const d = noiseBuf.getChannelData(0);
		for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

		// Engine: two saws a few cents apart, beating against each other,
		// through a lowpass that breathes. The detune is what stops a drone
		// from sounding like a test tone.
		const filt = ctx.createBiquadFilter();
		filt.type = 'lowpass';
		filt.frequency.value = 300;
		filt.Q.value = 1.2;
		const humGain = ctx.createGain();
		humGain.gain.value = 0.085;
		filt.connect(humGain).connect(master);

		[52, 52.4, 78].forEach((f, i) => {
			const o = ctx.createOscillator();
			o.type = i === 2 ? 'triangle' : 'sawtooth';
			o.frequency.value = f;
			const g = ctx.createGain();
			g.gain.value = i === 2 ? 0.35 : 1;
			o.connect(g).connect(filt);
			o.start();
		});

		const lfo = ctx.createOscillator();
		lfo.frequency.value = 0.17;
		const lfoAmt = ctx.createGain();
		lfoAmt.gain.value = 130;
		lfo.connect(lfoAmt).connect(filt.frequency);
		lfo.start();
	};

	const noise = (dur, type, freq, q, gain) => {
		const src = ctx.createBufferSource();
		src.buffer = noiseBuf;
		const f = ctx.createBiquadFilter();
		f.type = type; f.frequency.value = freq; f.Q.value = q;
		const g = ctx.createGain();
		g.gain.setValueAtTime(gain, ctx.currentTime);
		g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
		src.connect(f).connect(g).connect(master);
		src.start();
		src.stop(ctx.currentTime + dur);
		return f;
	};

	return {
		// called on every press, so audio is always unlocked by a real gesture
		wake() {
			init();
			if (ctx.state === 'suspended') ctx.resume();
		},
		setOn(v) {
			if (!ctx) return;
			master.gain.cancelScheduledValues(ctx.currentTime);
			master.gain.setTargetAtTime(v ? 0.9 : 0, ctx.currentTime, 0.25);
		},
		click() {
			if (ctx) noise(0.05, 'highpass', 1400, 0.7, 0.5);
		},
		// beam: a filter sweeping open, with a sub gliding underneath it
		beam(up) {
			if (!ctx) return;
			const f = noise(0.9, 'bandpass', 500, 2.2, 0.35);
			f.frequency.exponentialRampToValueAtTime(up ? 2400 : 240, ctx.currentTime + 0.85);
			const o = ctx.createOscillator();
			o.type = 'sine';
			o.frequency.setValueAtTime(up ? 90 : 210, ctx.currentTime);
			o.frequency.exponentialRampToValueAtTime(up ? 220 : 70, ctx.currentTime + 0.7);
			const g = ctx.createGain();
			g.gain.setValueAtTime(0.22, ctx.currentTime);
			g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.8);
			o.connect(g).connect(master);
			o.start(); o.stop(ctx.currentTime + 0.85);
		},
		// The theremin. A sine sliding BETWEEN notes instead of stepping to
		// them, with vibrato that widens as it goes. The slide is the whole
		// instrument — it's why this reads as 1954 and not as a beep.
		hail() {
			if (!ctx) return;
			const t0 = ctx.currentTime;
			const o = ctx.createOscillator();
			o.type = 'sine';
			const notes = [392, 587, 494, 740, 659];
			o.frequency.setValueAtTime(notes[0], t0);
			notes.forEach((n, i) => { if (i) o.frequency.exponentialRampToValueAtTime(n, t0 + i * 0.34); });

			const vib = ctx.createOscillator();
			vib.frequency.value = 5.6;
			const vibAmt = ctx.createGain();
			vibAmt.gain.setValueAtTime(2, t0);
			vibAmt.gain.linearRampToValueAtTime(16, t0 + 1.7);
			vib.connect(vibAmt).connect(o.frequency);

			const g = ctx.createGain();
			g.gain.setValueAtTime(0.0001, t0);
			g.gain.exponentialRampToValueAtTime(0.3, t0 + 0.18);
			g.gain.setValueAtTime(0.3, t0 + 1.5);
			g.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.1);

			o.connect(g).connect(master);
			o.start(t0); vib.start(t0);
			o.stop(t0 + 2.2); vib.stop(t0 + 2.2);
		},
	};
})();

/* ══ SCENE ════════════════════════════════════════════════════════════════ */

const mount = document.getElementById('stage');
let renderer;
try {
	renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
} catch (err) {
	document.getElementById('fallback').style.display = 'grid';
	mount.style.display = 'none';
	throw err;
}

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
mount.appendChild(renderer.domElement);

// The canvas is transparent, so the CSS sky behind it stays crisp — a
// gradient painted in CSS beats one rendered into a texture.
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 200);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(buildLightRoom(), 0.04).texture;

const key = new THREE.DirectionalLight(0xd8e2ff, 1.1);
key.position.set(4, 7, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0xffc38a, 0.35);
fill.position.set(-5, -2, 3);
scene.add(fill);
// the beam's own spill, lighting the belly of the craft from below
const underglow = new THREE.PointLight(0xffb84d, 6, 6, 2);
underglow.position.set(0, -0.9, 0);
scene.add(underglow);

const { craft, lamps, dome } = buildHull();
const saucer = new THREE.Group();     // bobs and tilts; everything rides it
saucer.add(craft);

const alien = buildAlien();
alien.scale.setScalar(0.155);
alien.position.y = 0.175;
saucer.add(alien);

const beam = buildBeam();
const motes = buildMotes();
saucer.add(beam, motes);

scene.add(saucer);
scene.add(buildStars());

/* ── camera orbit ──
   Spherical coordinates around a fixed target. Elevation is clamped, so you
   can't tumble under the floor or over the top — that's the thing that makes
   hand-rolled orbit controls feel broken.
*/
const target = new THREE.Vector3(0, -0.25, 0);
let azim = 0.5, elev = 0.26;
const dist = 7.6;
let velA = 0, dragging = false, lastX = 0, lastY = 0;

const placeCamera = () => {
	camera.position.set(
		target.x + dist * Math.cos(elev) * Math.sin(azim),
		target.y + dist * Math.sin(elev),
		target.z + dist * Math.cos(elev) * Math.cos(azim),
	);
	camera.lookAt(target);
};
placeCamera();

mount.addEventListener('pointerdown', (e) => {
	dragging = true; lastX = e.clientX; lastY = e.clientY; velA = 0;
	mount.classList.add('dragging');
});
const release = () => { dragging = false; mount.classList.remove('dragging'); };
window.addEventListener('pointerup', release);
window.addEventListener('pointercancel', release);
window.addEventListener('pointermove', (e) => {
	if (!dragging) return;
	const dx = e.clientX - lastX, dy = e.clientY - lastY;
	lastX = e.clientX; lastY = e.clientY;
	azim -= dx * 0.006;
	elev = Math.max(-0.15, Math.min(0.95, elev + dy * 0.005));
	velA = -dx * 0.006;
	if (reduce) placeCamera();
}, { passive: true });

window.addEventListener('resize', () => {
	camera.aspect = window.innerWidth / window.innerHeight;
	camera.updateProjectionMatrix();
	renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ── controls ── */
const state = { beam: true, lights: true, sound: false };
let beamLevel = 1;      // eased, so the beam swells instead of popping
let hailPulse = 0;

const bind = (id, prop, after) => {
	const el = document.getElementById(id);
	el.addEventListener('click', () => {
		Sfx.wake();
		state[prop] = !state[prop];
		el.setAttribute('aria-pressed', String(state[prop]));
		Sfx.click();
		if (after) after(state[prop]);
	});
};

bind('sw-beam', 'beam', (v) => { if (state.sound) Sfx.beam(v); });
bind('sw-lights', 'lights');
bind('sw-sound', 'sound', (v) => Sfx.setOn(v));

const hailBtn = document.getElementById('btn-hail');
hailBtn.addEventListener('click', () => {
	Sfx.wake();
	Sfx.click();
	Sfx.hail();
	hailPulse = 1;
	hailBtn.classList.add('lit');
	setTimeout(() => hailBtn.classList.remove('lit'), 2100);
});

/* ── frame ── */
const clock = new THREE.Clock();
let t = 0;

const frame = () => {
	requestAnimationFrame(frame);
	const dt = Math.min(clock.getDelta(), 0.05);
	if (!reduce) t += dt;

	// The craft turns and breathes; the alien inside stays level, because a
	// pilot spinning with his own ship reads as a bug.
	if (!reduce) {
		craft.rotation.y += dt * 0.22;
		saucer.position.y = Math.sin(t * 0.7) * 0.09;
		saucer.rotation.z = Math.sin(t * 0.43) * 0.025;
		saucer.rotation.x = Math.cos(t * 0.31) * 0.02;
		alien.rotation.y = -0.15 + Math.sin(t * 0.5) * 0.22;
	}

	// beam eases toward its switch position, and flares on a hail
	const goal = (state.beam ? 1 : 0) + hailPulse * 0.9;
	beamLevel += (goal - beamLevel) * Math.min(1, dt * 5);
	hailPulse *= Math.pow(0.25, dt);
	beamMaterial.uniforms.uStrength.value = beamLevel;
	beamMaterial.uniforms.uTime.value = t;
	beam.visible = beamLevel > 0.01;
	motes.visible = beamLevel > 0.05;
	motes.material.opacity = Math.min(1, beamLevel);
	underglow.intensity = 6 * beamLevel;
	if (!reduce) motes.userData.step(dt);

	// lamp chase — a travelling wave around the rim
	for (let i = 0; i < lamps.length; i++) {
		let v;
		if (!state.lights) v = 0.06;
		else if (reduce) v = 0.75;
		else v = 0.1 + Math.pow(Math.max(0, Math.sin(t * 2.4 - i * 0.42)), 5) * 1.5;
		v += hailPulse * 0.8;
		lamps[i].material.color.setRGB(v, v * 0.72, v * 0.3);
	}
	dome.material.opacity = 0.24 + hailPulse * 0.14;

	// spin-down after a fling, plus a slow drift so it's never dead still
	if (!dragging && !reduce) {
		azim += velA;
		velA *= 0.93;
		azim += dt * 0.012;
	}
	if (!reduce || dragging) placeCamera();

	renderer.render(scene, camera);
};

frame();
</script>
</body>
</html>
