<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Send a Visitor</title>

<!--
  A CARD YOU CAN SEND, with no server behind it.

  The whole card — who it's for, the message, who it's from — is packed
  into the link itself, after the # sign. Nothing is stored anywhere. There
  is no database, no account, no backend. If someone has the link, they
  have the card; if they don't, it doesn't exist.

  ONE CATCH: opening this file straight off your computer gives you a
  file:/// link that only works on YOUR computer. To send cards to other
  people, the page needs to live at a web address first — drag this file
  onto netlify.com/drop and you'll have one in about a minute. The page
  will tell you this too if it notices you're on file://.
-->

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;800&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet" />

<style>
	:root {
		--night:   #120d24;
		--dusk:    #3d2456;
		--horizon: #9d5a6b;
		--accent:  #ffb84d;   /* swapped by the occasion picker — beam, lamps, lit states */
		--mint:    #7ff0c4;
		--ivory:   #f2e9dc;
		--slab:    #1b1430;
	}

	* { box-sizing: border-box; }

	html, body { margin: 0; height: 100%; overflow: hidden; background: var(--night); }

	body {
		font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
		color: var(--ivory);
		background:
			radial-gradient(120% 62% at 50% 108%, var(--horizon) 0%, transparent 62%),
			linear-gradient(180deg, var(--night) 0%, var(--dusk) 68%, #5c3358 100%);
	}

	#stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
	#stage.dragging { cursor: grabbing; }
	#stage canvas { display: block; }

	.overlay {
		position: fixed;
		inset: 0;
		display: flex;
		flex-direction: column;
		justify-content: space-between;
		padding: clamp(1rem, 3.5vw, 2.2rem);
		pointer-events: none;
	}

	.title {
		font-family: 'Big Shoulders Display', ui-sans-serif, sans-serif;
		font-weight: 800;
		text-transform: uppercase;
		letter-spacing: -0.02em;
		line-height: 0.84;
		margin: 0;
	}

	.masthead .title { font-size: clamp(2.6rem, 9vw, 5rem); }
	.masthead p {
		margin: 0.6rem 0 0;
		font-size: 0.88rem;
		max-width: 28ch;
		line-height: 1.5;
		color: color-mix(in srgb, var(--ivory) 62%, transparent);
	}

	/* ── shared panel look ── */
	.panel {
		pointer-events: auto;
		background: color-mix(in srgb, var(--slab) 86%, transparent);
		border: 1px solid color-mix(in srgb, var(--ivory) 14%, transparent);
		border-radius: 16px;
		box-shadow: 0 22px 60px -20px #000, inset 0 1px 0 color-mix(in srgb, var(--ivory) 12%, transparent);
		backdrop-filter: blur(10px);
	}

	/* ── composer ── */
	.composer {
		align-self: center;
		width: min(560px, 100%);
		max-height: 64vh;
		overflow-y: auto;
		padding: clamp(1rem, 3vw, 1.4rem);
		display: grid;
		gap: 0.95rem;
	}

	.field { display: grid; gap: 0.4rem; }

	.field label, .legend {
		font-family: 'Big Shoulders Display', ui-sans-serif, sans-serif;
		font-weight: 500;
		font-size: 0.9rem;
		letter-spacing: 0.16em;
		text-transform: uppercase;
		color: color-mix(in srgb, var(--ivory) 60%, transparent);
	}

	input[type="text"], textarea {
		font: inherit;
		color: var(--ivory);
		background: #0d0a1a;
		border: 1px solid color-mix(in srgb, var(--ivory) 15%, transparent);
		border-radius: 9px;
		padding: 0.6rem 0.75rem;
		width: 100%;
		resize: none;
	}
	input[type="text"]:focus, textarea:focus {
		outline: 2px solid var(--accent);
		outline-offset: 1px;
		border-color: transparent;
	}
	textarea { min-height: 4.6rem; line-height: 1.5; }

	.count {
		justify-self: end;
		font-size: 0.72rem;
		color: color-mix(in srgb, var(--ivory) 42%, transparent);
	}
	.count.warn { color: var(--accent); }

	/* occasion picker — chunky panel keys, same family as the switches */
	.vibes { display: flex; flex-wrap: wrap; gap: 0.4rem; }
	.vibe {
		font-family: 'Big Shoulders Display', ui-sans-serif, sans-serif;
		font-weight: 500;
		font-size: 0.95rem;
		letter-spacing: 0.12em;
		text-transform: uppercase;
		color: color-mix(in srgb, var(--ivory) 62%, transparent);
		background: linear-gradient(180deg, #2a1a40, #1a1030);
		border: 1px solid color-mix(in srgb, var(--ivory) 14%, transparent);
		border-radius: 9px;
		padding: 0.5rem 0.8rem;
		cursor: pointer;
		transition: transform 0.1s ease;
	}
	.vibe:active { transform: translateY(2px); }
	.vibe[aria-pressed="true"] {
		color: #16102a;
		background: var(--accent);
		border-color: var(--accent);
		box-shadow: 0 0 18px -4px var(--accent);
	}
	.vibe:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

	.row { display: flex; gap: 0.6rem; flex-wrap: wrap; }
	.row > * { flex: 1 1 12rem; }

	.go {
		font-family: 'Big Shoulders Display', ui-sans-serif, sans-serif;
		font-weight: 800;
		font-size: 1.35rem;
		letter-spacing: 0.06em;
		text-transform: uppercase;
		color: #16102a;
		background: var(--accent);
		border: 0;
		border-radius: 10px;
		padding: 0.7rem 1rem;
		cursor: pointer;
		box-shadow: 0 0 26px -8px var(--accent);
		transition: transform 0.1s ease;
	}
	.go:active { transform: translateY(2px); }
	.go:focus-visible { outline: 2px solid var(--ivory); outline-offset: 3px; }

	.ghost {
		font: inherit;
		color: color-mix(in srgb, var(--ivory) 70%, transparent);
		background: none;
		border: 1px solid color-mix(in srgb, var(--ivory) 20%, transparent);
		border-radius: 10px;
		padding: 0.7rem 1rem;
		cursor: pointer;
	}
	.ghost:hover { color: var(--ivory); }

	.result { display: none; gap: 0.5rem; }
	.result.on { display: grid; }
	.linkbox { display: flex; gap: 0.5rem; }
	.linkbox input { font-size: 0.8rem; }
	.note {
		font-size: 0.78rem;
		line-height: 1.5;
		color: color-mix(in srgb, var(--ivory) 55%, transparent);
	}
	.note strong { color: var(--accent); font-weight: 500; }

	/* ── the card itself ── */
	.card {
		position: fixed;
		inset: 0;
		display: none;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		text-align: center;
		padding: clamp(1.2rem, 5vw, 3rem);
		pointer-events: none;
	}
	.card.on { display: flex; }
	.card > * { pointer-events: auto; }

	.seal { display: grid; gap: 1.1rem; justify-items: center; }
	.seal p { margin: 0; color: color-mix(in srgb, var(--ivory) 70%, transparent); }

	.message { display: none; max-width: 34ch; }
	.message.on { display: block; }

	.message .headline {
		font-family: 'Big Shoulders Display', ui-sans-serif, sans-serif;
		font-weight: 800;
		font-size: clamp(2.8rem, 11vw, 6rem);
		line-height: 0.86;
		letter-spacing: -0.02em;
		text-transform: uppercase;
		margin: 0;
		color: var(--accent);
		text-shadow: 0 0 60px color-mix(in srgb, var(--accent) 45%, transparent);
	}
	.message .body {
		margin: 1.1rem 0 0;
		font-size: clamp(1rem, 2.6vw, 1.2rem);
		line-height: 1.6;
		white-space: pre-wrap;
	}
	.message .sig {
		margin: 1.3rem 0 0;
		font-family: 'Big Shoulders Display', ui-sans-serif, sans-serif;
		font-size: 1.1rem;
		letter-spacing: 0.2em;
		text-transform: uppercase;
		color: color-mix(in srgb, var(--ivory) 62%, transparent);
	}

	/* the reveal: everything rises a little, staggered, like the beam is
	   lifting it into view */
	.message > * {
		opacity: 0;
		transform: translateY(20px);
		transition: opacity 0.9s ease, transform 0.9s cubic-bezier(0.2, 0.8, 0.3, 1);
	}
	.message.lift > * { opacity: 1; transform: none; }
	.message.lift .body { transition-delay: 0.22s; }
	.message.lift .sig  { transition-delay: 0.44s; }

	.after {
		margin-top: 2rem;
		display: flex;
		gap: 0.6rem;
		flex-wrap: wrap;
		justify-content: center;
		opacity: 0;
		transition: opacity 0.7s ease 0.9s;
	}
	.message.lift ~ .after { opacity: 1; }

	/* ── the dock ──
	   Sound toggle plus the two outbound links, gathered into one corner so
	   the card and the composer both keep a clean stage. */
	.dock {
		position: fixed;
		top: clamp(0.9rem, 3vw, 1.6rem);
		right: clamp(0.9rem, 3vw, 1.6rem);
		display: flex;
		align-items: center;
		gap: 0.5rem;
		z-index: 5;
	}

	.chip {
		display: inline-flex;
		align-items: center;
		gap: 0.45rem;
		padding: 0.5rem 0.8rem;
		border-radius: 999px;
		text-decoration: none;
		font-family: 'Big Shoulders Display', ui-sans-serif, sans-serif;
		font-weight: 500;
		font-size: 0.9rem;
		letter-spacing: 0.14em;
		text-transform: uppercase;
		color: color-mix(in srgb, var(--ivory) 68%, transparent);
		background: color-mix(in srgb, var(--slab) 80%, transparent);
		border: 1px solid color-mix(in srgb, var(--ivory) 16%, transparent);
		backdrop-filter: blur(8px);
		transition: color 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, transform 0.1s ease;
	}
	.chip svg { width: 18px; height: 18px; flex: none; }
	.chip:active { transform: translateY(1px); }
	.chip:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }

	/* the tip star follows the occasion colour; the arcade keeps its own */
	.chip.tip:hover, .chip.tip:focus-visible {
		color: var(--accent);
		border-color: var(--accent);
		box-shadow: 0 0 20px -6px var(--accent);
	}
	.chip.arcade:hover, .chip.arcade:focus-visible {
		color: var(--mint);
		border-color: var(--mint);
		box-shadow: 0 0 20px -6px var(--mint);
	}

	/* ── sound toggle ── */
	.mute {
		width: 44px; height: 44px;
		display: grid; place-items: center;
		border-radius: 50%;
		cursor: pointer;
		background: color-mix(in srgb, var(--slab) 80%, transparent);
		border: 1px solid color-mix(in srgb, var(--ivory) 16%, transparent);
		backdrop-filter: blur(8px);
		color: color-mix(in srgb, var(--ivory) 55%, transparent);
		font-size: 1.1rem;
		line-height: 1;
	}
	.mute[aria-pressed="true"] {
		color: #16102a;
		background: var(--accent);
		border-color: var(--accent);
		box-shadow: 0 0 18px -4px var(--accent);
	}
	.mute:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

	.fallback {
		position: fixed; inset: 0; display: none; place-items: center;
		text-align: center; padding: 2rem; line-height: 1.6;
	}

	@media (max-width: 620px) {
		/* labels go, icons stay — the dock shrinks to round buttons */
		.chip span { display: none; }
		.chip { padding: 0.6rem; }
	}

	@media (max-width: 520px) {
		.masthead p { display: none; }
		.composer { max-height: 70vh; }
	}
	@media (prefers-reduced-motion: reduce) {
		.message > * { transition: none; }
		.after { transition: none; }
	}
</style>
</head>
<body>

<div id="stage"></div>

<nav class="dock" aria-label="Sound and links">
	<button class="mute" id="mute" aria-pressed="false" aria-label="Sound on or off">♪</button>
	<a class="chip tip" href="https://ko-fi.com/magickmica/tip" target="_blank" rel="noopener noreferrer" title="Leave a tip on Ko-fi">
		<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true">
			<path d="M12 2.8l2.85 5.9 6.4.95-4.63 4.55 1.1 6.4L12 17.55 6.28 20.6l1.1-6.4L2.75 9.65l6.4-.95z" />
		</svg>
		<span>Tip</span>
	</a>
	<a class="chip arcade" href="https://magickmica.github.io/arcade.html" target="_blank" rel="noopener noreferrer" title="Go to the Arcade">
		<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
			<rect x="2.4" y="7.4" width="19.2" height="9.2" rx="4.6" />
			<path d="M7 10.6v2.8M5.6 12h2.8" />
			<circle cx="16.1" cy="11.2" r="0.95" fill="currentColor" stroke="none" />
			<circle cx="18.3" cy="13.4" r="0.95" fill="currentColor" stroke="none" />
		</svg>
		<span>Arcade</span>
	</a>
</nav>

<!-- ══ compose mode ══ -->
<div class="overlay" id="composeView">
	<header class="masthead">
		<h1 class="title">Send a<br />visitor</h1>
		<p>Write something, get a link. The card lives inside the link — nothing is saved anywhere.</p>
	</header>

	<div class="panel composer">
		<div class="field">
			<span class="legend">Occasion</span>
			<div class="vibes" id="vibes" role="group" aria-label="Occasion"></div>
		</div>

		<div class="row">
			<div class="field">
				<label for="f-to">To</label>
				<input type="text" id="f-to" maxlength="32" placeholder="Sam" autocomplete="off" />
			</div>
			<div class="field">
				<label for="f-from">From</label>
				<input type="text" id="f-from" maxlength="32" placeholder="Alex" autocomplete="off" />
			</div>
		</div>

		<div class="field">
			<label for="f-msg">Message</label>
			<textarea id="f-msg" maxlength="240" placeholder="Came a long way to say this."></textarea>
			<span class="count" id="count">0 / 240</span>
		</div>

		<div class="row">
			<button class="go" id="make">Make the link</button>
			<button class="ghost" id="preview">Preview it</button>
		</div>

		<div class="result" id="result">
			<div class="linkbox">
				<input type="text" id="link" readonly aria-label="Your card link" />
				<button class="ghost" id="copy" style="flex:0 0 auto">Copy</button>
			</div>
			<p class="note" id="linkNote"></p>
		</div>
	</div>
</div>

<!-- ══ card mode ══ -->
<div class="card" id="cardView">
	<div class="seal" id="seal">
		<p id="sealLine">Someone sent you something.</p>
		<button class="go" id="open">Open it</button>
	</div>

	<div class="message" id="message">
		<h1 class="headline" id="headline"></h1>
		<p class="body" id="body"></p>
		<p class="sig" id="sig"></p>
	</div>

	<div class="after" id="after">
		<button class="ghost" id="again">Play it again</button>
		<button class="ghost" id="ownCard">Make your own</button>
	</div>
</div>

<div class="fallback" id="fallback">
	<p>This browser can't run WebGL, so the craft has nowhere to land.<br />
	Try opening the page in Chrome, Firefox, or Safari.</p>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.184.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

const TWO_PI = Math.PI * 2;
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ══ THE ALIEN ═══════════════════════════════════════════════════════════ */

const A = 0.72, B = 0.3;
const PEAK = Math.pow(A / (A + B), A) * Math.pow(B / (A + B), B);
const WIDTH = (t) => Math.pow(Math.max(t, 0), A) * Math.pow(Math.max(1 - t, 0), B) / PEAK;
const DEPTH = (t) => 0.74 + 0.26 * Math.min(1, Math.max(0, (t - 0.15) / 0.5));
const HEIGHT_AT = (t) => (t - 0.48) * 2.15;
const FLAT = 0.22;

const surfacePoint = (t, a) => {
	const w = WIDTH(t);
	const zn = Math.sin(a);
	const band = Math.exp(-(((t - 0.46) / 0.42) ** 2));
	const flat = 1 - FLAT * band * (zn > 0 ? zn * zn : 0);
	return new THREE.Vector3(Math.cos(a) * w, HEIGHT_AT(t), zn * w * DEPTH(t) * flat);
};

const normalAt = (t, a) => {
	const e = 1e-3;
	const dt = surfacePoint(Math.min(1, t + e), a).sub(surfacePoint(Math.max(0, t - e), a));
	const da = surfacePoint(t, a + e).sub(surfacePoint(t, a - e));
	return new THREE.Vector3().crossVectors(dt, da).normalize();
};

const SKIN = [0.55, 0.63, 0.55];
const RIMC = [0.62, 0.86, 0.90];

const skinMatcap = () => {
	const S = 256;
	const d = new Uint8Array(S * S * 4);
	const unit = (x, y, z) => { const l = Math.hypot(x, y, z); return [x / l, y / l, z / l]; };
	const L1 = unit(-0.42, 0.55, 0.72);
	const L2 = unit(0.66, -0.12, 0.74);
	const H1 = unit(L1[0], L1[1], L1[2] + 1);
	const enc = (v) => Math.max(0, Math.min(255, Math.round(Math.pow(Math.max(0, v), 1 / 2.2) * 255)));
	for (let j = 0; j < S; j++) {
		for (let i = 0; i < S; i++) {
			let nx = (i / (S - 1)) * 2 - 1;
			let ny = 1 - (j / (S - 1)) * 2;
			const r = Math.hypot(nx, ny);
			if (r > 1) { nx /= r; ny /= r; }
			const nz = Math.sqrt(Math.max(0, 1 - nx * nx - ny * ny));
			const d1 = Math.max(0, (nx * L1[0] + ny * L1[1] + nz * L1[2] + 0.35) / 1.35);
			const d2 = Math.max(0, nx * L2[0] + ny * L2[1] + nz * L2[2]);
			const sp = Math.pow(Math.max(0, nx * H1[0] + ny * H1[1] + nz * H1[2]), 46);
			const fr = Math.pow(1 - nz, 3.2);
			const lum = 0.14 + 0.78 * d1 * d1 + 0.2 * d2;
			const o = (j * S + i) * 4;
			d[o]     = enc(SKIN[0] * lum + 0.5 * sp + RIMC[0] * fr * 0.22);
			d[o + 1] = enc(SKIN[1] * lum + 0.5 * sp + RIMC[1] * fr * 0.22);
			d[o + 2] = enc(SKIN[2] * lum + 0.5 * sp + RIMC[2] * fr * 0.22);
			d[o + 3] = 255;
		}
	}
	const tex = new THREE.DataTexture(d, S, S);
	tex.colorSpace = THREE.SRGBColorSpace;
	tex.magFilter = THREE.LinearFilter;
	tex.minFilter = THREE.LinearFilter;
	tex.needsUpdate = true;
	return tex;
};

function buildAlien() {
	const group = new THREE.Group();
	const skin = new THREE.MeshMatcapMaterial({ matcap: skinMatcap() });

	const WS = 200, HS = 140;
	const g = new THREE.SphereGeometry(1, WS, HS);
	const P = g.attributes.position;
	for (let i = 0; i < P.count; i++) {
		const row = Math.floor(i / (WS + 1));
		const col = i % (WS + 1);
		const p = surfacePoint(1 - row / HS, (col / WS) * TWO_PI);
		P.setXYZ(i, p.x, p.y, p.z);
	}
	g.computeVertexNormals();

	const N = g.attributes.normal;
	const key = (i) => Math.round(P.getX(i) * 4000) + '_' + Math.round(P.getY(i) * 4000) + '_' + Math.round(P.getZ(i) * 4000);
	const acc = new Map();
	for (let i = 0; i < P.count; i++) {
		const k = key(i);
		const e = acc.get(k) || [0, 0, 0];
		e[0] += N.getX(i); e[1] += N.getY(i); e[2] += N.getZ(i);
		acc.set(k, e);
	}
	for (let i = 0; i < P.count; i++) {
		const e = acc.get(key(i));
		const l = Math.hypot(e[0], e[1], e[2]) || 1;
		N.setXYZ(i, e[0] / l, e[1] / l, e[2] / l);
	}
	group.add(new THREE.Mesh(g, skin));

	const inset = (mesh, t, a, depth) => {
		const p = surfacePoint(t, a);
		const n = normalAt(t, a);
		mesh.position.copy(p).addScaledVector(n, -depth);
		mesh.lookAt(p.clone().addScaledVector(n, 1));
		return mesh;
	};

	const eyeGeo = new THREE.SphereGeometry(1, 64, 48);
	const EP = eyeGeo.attributes.position;
	for (let i = 0; i < EP.count; i++) EP.setY(i, EP.getY(i) * (1 - 0.62 * EP.getX(i) ** 2));
	eyeGeo.computeVertexNormals();
	const eyeMat = new THREE.MeshPhysicalMaterial({
		color: 0x07080a, roughness: 0.05, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.05,
	});
	for (const side of [-1, 1]) {
		const eye = new THREE.Mesh(eyeGeo, eyeMat);
		eye.scale.set(0.34, 0.19, 0.26);
		inset(eye, 0.53, Math.PI / 2 + side * 0.6, 0.1);
		eye.rotateZ(side * 0.34);
		group.add(eye);
	}

	const dark = new THREE.MeshStandardMaterial({ color: 0x171b19, roughness: 0.85 });
	const slit = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 20), dark);
	slit.scale.set(0.12, 0.016, 0.05);
	group.add(inset(slit, 0.16, Math.PI / 2, 0.012));
	for (const side of [-1, 1]) {
		const n = new THREE.Mesh(new THREE.SphereGeometry(0.02, 16, 12), dark);
		group.add(inset(n, 0.3, Math.PI / 2 + side * 0.075, 0.012));
	}
	return group;
}

/* ══ THE CRAFT ═══════════════════════════════════════════════════════════ */

function buildHull() {
	const craft = new THREE.Group();

	const profile = new THREE.CatmullRomCurve3([
		new THREE.Vector3(0.001, -0.30, 0),
		new THREE.Vector3(0.42, -0.315, 0),
		new THREE.Vector3(0.86, -0.255, 0),
		new THREE.Vector3(1.26, -0.135, 0),
		new THREE.Vector3(1.55, -0.005, 0),
		new THREE.Vector3(1.24, 0.095, 0),
		new THREE.Vector3(0.84, 0.155, 0),
		new THREE.Vector3(0.55, 0.175, 0),
	]).getPoints(56).map((p) => new THREE.Vector2(p.x, p.y));

	craft.add(new THREE.Mesh(
		new THREE.LatheGeometry(profile, 128),
		new THREE.MeshStandardMaterial({ color: 0xb7c0cb, metalness: 0.95, roughness: 0.24 }),
	));

	const inlay = new THREE.Mesh(
		new THREE.TorusGeometry(1.02, 0.035, 20, 128),
		new THREE.MeshStandardMaterial({ color: 0x2c3542, metalness: 0.7, roughness: 0.45 }),
	);
	inlay.rotation.x = Math.PI / 2;
	inlay.position.y = 0.085;
	craft.add(inlay);

	const lamps = [];
	const COUNT = 16;
	for (let i = 0; i < COUNT; i++) {
		const a = (i / COUNT) * TWO_PI;
		const bulb = new THREE.Mesh(
			new THREE.SphereGeometry(0.075, 20, 14),
			new THREE.MeshBasicMaterial({ color: 0xffb84d, toneMapped: false }),
		);
		bulb.position.set(Math.cos(a) * 1.44, -0.085, Math.sin(a) * 1.44);
		bulb.scale.y = 0.8;
		craft.add(bulb);
		lamps.push(bulb);
	}

	const dome = new THREE.Mesh(
		new THREE.SphereGeometry(0.53, 64, 40, 0, TWO_PI, 0, Math.PI / 2),
		new THREE.MeshPhysicalMaterial({
			color: 0x9fe8d0, transparent: true, opacity: 0.24, roughness: 0.06,
			metalness: 0, clearcoat: 1, clearcoatRoughness: 0.04,
			side: THREE.DoubleSide, depthWrite: false,
		}),
	);
	dome.position.y = 0.16;
	dome.renderOrder = 4;
	craft.add(dome);

	const collar = new THREE.Mesh(
		new THREE.TorusGeometry(0.53, 0.028, 16, 96),
		new THREE.MeshStandardMaterial({ color: 0x8e99a6, metalness: 0.9, roughness: 0.3 }),
	);
	collar.rotation.x = Math.PI / 2;
	collar.position.y = 0.165;
	craft.add(collar);

	return { craft, lamps, dome };
}

const beamMaterial = new THREE.ShaderMaterial({
	uniforms: {
		uTime: { value: 0 },
		uStrength: { value: 1 },
		uColor: { value: new THREE.Color(0xffb84d) },
	},
	vertexShader: `
		varying vec2 vUv;
		void main() {
			vUv = uv;
			gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
		}
	`,
	fragmentShader: `
		uniform float uTime;
		uniform float uStrength;
		uniform vec3 uColor;
		varying vec2 vUv;
		void main() {
			float fall = pow(vUv.y, 1.7);
			float scan = 0.78 + 0.22 * sin(vUv.y * 34.0 - uTime * 2.6);
			float a = fall * scan * 0.42 * uStrength;
			gl_FragColor = vec4(uColor * (0.6 + fall * 0.8), a);
		}
	`,
	transparent: true,
	blending: THREE.AdditiveBlending,
	depthWrite: false,
	side: THREE.DoubleSide,
});

const BEAM_TOP = -0.30, BEAM_BOTTOM = -5.6, BEAM_TOP_R = 0.5, BEAM_BOT_R = 2.75;

function buildBeam() {
	const cone = new THREE.Mesh(
		new THREE.CylinderGeometry(BEAM_TOP_R, BEAM_BOT_R, BEAM_TOP - BEAM_BOTTOM, 72, 1, true),
		beamMaterial,
	);
	cone.position.y = (BEAM_TOP + BEAM_BOTTOM) / 2;
	cone.renderOrder = 2;
	return cone;
}

function buildMotes(count = 240) {
	const pos = new Float32Array(count * 3);
	const u = new Float32Array(count), ang = new Float32Array(count);
	const rad = new Float32Array(count), spd = new Float32Array(count);
	for (let i = 0; i < count; i++) {
		u[i] = Math.random();
		ang[i] = Math.random() * TWO_PI;
		rad[i] = Math.sqrt(Math.random());
		spd[i] = 0.05 + Math.random() * 0.09;
	}
	const geo = new THREE.BufferGeometry();
	geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

	const c = document.createElement('canvas');
	c.width = c.height = 64;
	const cx = c.getContext('2d');
	const gr = cx.createRadialGradient(32, 32, 0, 32, 32, 32);
	gr.addColorStop(0, 'rgba(255,255,255,1)');
	gr.addColorStop(1, 'rgba(255,255,255,0)');
	cx.fillStyle = gr;
	cx.fillRect(0, 0, 64, 64);

	const points = new THREE.Points(geo, new THREE.PointsMaterial({
		size: 0.075, map: new THREE.CanvasTexture(c), color: 0xffd79a, transparent: true,
		blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
	}));
	points.renderOrder = 3;
	points.userData.step = (dt) => {
		for (let i = 0; i < count; i++) {
			u[i] += spd[i] * dt;
			if (u[i] > 1) u[i] -= 1;
			const r = (BEAM_BOT_R + (BEAM_TOP_R - BEAM_BOT_R) * u[i]) * rad[i] * 0.94;
			const a = ang[i] + u[i] * 0.6;
			pos[i * 3] = Math.cos(a) * r;
			pos[i * 3 + 1] = BEAM_BOTTOM + (BEAM_TOP - BEAM_BOTTOM) * u[i];
			pos[i * 3 + 2] = Math.sin(a) * r;
		}
		geo.attributes.position.needsUpdate = true;
	};
	points.userData.step(0);
	return points;
}

function buildStars(count = 1100) {
	const pos = new Float32Array(count * 3);
	for (let i = 0; i < count; i++) {
		const th = Math.random() * TWO_PI;
		const ph = Math.acos(2 * Math.random() - 1);
		const r = 34 + Math.random() * 10;
		pos[i * 3] = r * Math.sin(ph) * Math.cos(th);
		pos[i * 3 + 1] = r * Math.cos(ph) * 0.7 + 6;
		pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
	}
	const geo = new THREE.BufferGeometry();
	geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
	return new THREE.Points(geo, new THREE.PointsMaterial({
		size: 0.28, color: 0xdfe6ff, transparent: true, opacity: 0.75,
		blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
	}));
}

const buildLightRoom = () => {
	const room = new THREE.Scene();
	room.background = new THREE.Color(0x2c2438);
	const c = document.createElement('canvas');
	c.width = c.height = 256;
	const ctx = c.getContext('2d');
	const grad = ctx.createRadialGradient(128, 128, 24, 128, 128, 128);
	grad.addColorStop(0, '#ffffff');
	grad.addColorStop(1, '#000000');
	ctx.fillStyle = grad;
	ctx.fillRect(0, 0, 256, 256);
	const tex = new THREE.CanvasTexture(c);
	const panel = (w, h, x, y, z, intensity, tint) => {
		const m = new THREE.Mesh(
			new THREE.PlaneGeometry(w, h),
			new THREE.MeshBasicMaterial({
				map: tex, color: new THREE.Color(tint).multiplyScalar(intensity), side: THREE.DoubleSide,
			}),
		);
		m.position.set(x, y, z);
		m.lookAt(0, 0, 0);
		room.add(m);
	};
	panel(9, 6, -6, 6, 4, 2.6, 0xdfe8ff);
	panel(7, 5, 6, 2, 4, 0.9, 0xffe2c2);
	panel(9, 3, 0, 6, -6, 1.5, 0xc9b6ff);
	panel(9, 9, 0, -7, 0, 0.7, 0xff9d6b);
	return room;
};

/* ══ SOUND ═══════════════════════════════════════════════════════════════ */

const Sfx = (() => {
	let ctx = null, master = null, noiseBuf = null;

	const init = () => {
		if (ctx) return;
		ctx = new (window.AudioContext || window.webkitAudioContext)();
		master = ctx.createGain();
		master.gain.value = 0;
		master.connect(ctx.destination);

		noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
		const d = noiseBuf.getChannelData(0);
		for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

		const filt = ctx.createBiquadFilter();
		filt.type = 'lowpass';
		filt.frequency.value = 300;
		filt.Q.value = 1.2;
		const humGain = ctx.createGain();
		humGain.gain.value = 0.085;
		filt.connect(humGain).connect(master);

		[52, 52.4, 78].forEach((f, i) => {
			const o = ctx.createOscillator();
			o.type = i === 2 ? 'triangle' : 'sawtooth';
			o.frequency.value = f;
			const g = ctx.createGain();
			g.gain.value = i === 2 ? 0.35 : 1;
			o.connect(g).connect(filt);
			o.start();
		});

		const lfo = ctx.createOscillator();
		lfo.frequency.value = 0.17;
		const lfoAmt = ctx.createGain();
		lfoAmt.gain.value = 130;
		lfo.connect(lfoAmt).connect(filt.frequency);
		lfo.start();
	};

	const noise = (dur, type, freq, q, gain) => {
		const src = ctx.createBufferSource();
		src.buffer = noiseBuf;
		const f = ctx.createBiquadFilter();
		f.type = type; f.frequency.value = freq; f.Q.value = q;
		const g = ctx.createGain();
		g.gain.setValueAtTime(gain, ctx.currentTime);
		g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
		src.connect(f).connect(g).connect(master);
		src.start();
		src.stop(ctx.currentTime + dur);
		return f;
	};

	return {
		wake() { init(); if (ctx.state === 'suspended') ctx.resume(); },
		setOn(v) {
			if (!ctx) return;
			master.gain.cancelScheduledValues(ctx.currentTime);
			master.gain.setTargetAtTime(v ? 0.9 : 0, ctx.currentTime, 0.25);
		},
		click() { if (ctx) noise(0.05, 'highpass', 1400, 0.7, 0.5); },
		swell() {
			if (!ctx) return;
			const f = noise(1.1, 'bandpass', 400, 2.2, 0.32);
			f.frequency.exponentialRampToValueAtTime(2600, ctx.currentTime + 1);
		},
		// theremin — a sine SLIDING between notes, vibrato widening as it
		// goes. The slide is the instrument; that's why it reads as 1954.
		hail() {
			if (!ctx) return;
			const t0 = ctx.currentTime;
			const o = ctx.createOscillator();
			o.type = 'sine';
			const notes = [392, 587, 494, 740, 659];
			o.frequency.setValueAtTime(notes[0], t0);
			notes.forEach((n, i) => { if (i) o.frequency.exponentialRampToValueAtTime(n, t0 + i * 0.34); });

			const vib = ctx.createOscillator();
			vib.frequency.value = 5.6;
			const vibAmt = ctx.createGain();
			vibAmt.gain.setValueAtTime(2, t0);
			vibAmt.gain.linearRampToValueAtTime(16, t0 + 1.7);
			vib.connect(vibAmt).connect(o.frequency);

			const g = ctx.createGain();
			g.gain.setValueAtTime(0.0001, t0);
			g.gain.exponentialRampToValueAtTime(0.3, t0 + 0.18);
			g.gain.setValueAtTime(0.3, t0 + 1.5);
			g.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.1);

			o.connect(g).connect(master);
			o.start(t0); vib.start(t0);
			o.stop(t0 + 2.2); vib.stop(t0 + 2.2);
		},
	};
})();

/* ══ SCENE ═══════════════════════════════════════════════════════════════ */

const mount = document.getElementById('stage');
let renderer;
try {
	renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
} catch (err) {
	document.getElementById('fallback').style.display = 'grid';
	mount.style.display = 'none';
	throw err;
}

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
mount.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 200);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(buildLightRoom(), 0.04).texture;

const keyLight = new THREE.DirectionalLight(0xd8e2ff, 1.1);
keyLight.position.set(4, 7, 5);
scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0xffc38a, 0.35);
fillLight.position.set(-5, -2, 3);
scene.add(fillLight);
const underglow = new THREE.PointLight(0xffb84d, 6, 6, 2);
underglow.position.set(0, -0.9, 0);
scene.add(underglow);

const { craft, lamps, dome } = buildHull();
const saucer = new THREE.Group();
saucer.add(craft);

const alien = buildAlien();
alien.scale.setScalar(0.155);
alien.position.y = 0.175;
saucer.add(alien);

const beam = buildBeam();
const motes = buildMotes();
saucer.add(beam, motes);

scene.add(saucer, buildStars());

const target = new THREE.Vector3(0, -0.25, 0);
let azim = 0.5, elev = 0.26;
const dist = 7.6;
let velA = 0, dragging = false, lastX = 0, lastY = 0;

const placeCamera = () => {
	camera.position.set(
		target.x + dist * Math.cos(elev) * Math.sin(azim),
		target.y + dist * Math.sin(elev),
		target.z + dist * Math.cos(elev) * Math.cos(azim),
	);
	camera.lookAt(target);
};
placeCamera();

mount.addEventListener('pointerdown', (e) => {
	dragging = true; lastX = e.clientX; lastY = e.clientY; velA = 0;
	mount.classList.add('dragging');
});
const release = () => { dragging = false; mount.classList.remove('dragging'); };
window.addEventListener('pointerup', release);
window.addEventListener('pointercancel', release);
window.addEventListener('pointermove', (e) => {
	if (!dragging) return;
	const dx = e.clientX - lastX, dy = e.clientY - lastY;
	lastX = e.clientX; lastY = e.clientY;
	azim -= dx * 0.006;
	elev = Math.max(-0.15, Math.min(0.95, elev + dy * 0.005));
	velA = -dx * 0.006;
	if (reduce) placeCamera();
}, { passive: true });

window.addEventListener('resize', () => {
	camera.aspect = window.innerWidth / window.innerHeight;
	camera.updateProjectionMatrix();
	renderer.setSize(window.innerWidth, window.innerHeight);
});

let beamLevel = 1, hailPulse = 0;
const accent = new THREE.Color(0xffb84d);

const clock = new THREE.Clock();
let t = 0;

const frame = () => {
	requestAnimationFrame(frame);
	const dt = Math.min(clock.getDelta(), 0.05);
	if (!reduce) t += dt;

	if (!reduce) {
		craft.rotation.y += dt * 0.22;
		saucer.position.y = Math.sin(t * 0.7) * 0.09;
		saucer.rotation.z = Math.sin(t * 0.43) * 0.025;
		saucer.rotation.x = Math.cos(t * 0.31) * 0.02;
		alien.rotation.y = -0.15 + Math.sin(t * 0.5) * 0.22;
	}

	const goal = 1 + hailPulse * 0.9;
	beamLevel += (goal - beamLevel) * Math.min(1, dt * 5);
	hailPulse *= Math.pow(0.25, dt);
	beamMaterial.uniforms.uStrength.value = beamLevel;
	beamMaterial.uniforms.uTime.value = t;
	underglow.intensity = 6 * beamLevel;
	if (!reduce) motes.userData.step(dt);

	for (let i = 0; i < lamps.length; i++) {
		const v = reduce ? 0.75 : 0.1 + Math.pow(Math.max(0, Math.sin(t * 2.4 - i * 0.42)), 5) * 1.5 + hailPulse * 0.8;
		lamps[i].material.color.setRGB(accent.r * v, accent.g * v, accent.b * v);
	}
	dome.material.opacity = 0.24 + hailPulse * 0.14;

	if (!dragging && !reduce) {
		azim += velA;
		velA *= 0.93;
		azim += dt * 0.012;
	}
	if (!reduce || dragging) placeCamera();

	renderer.render(scene, camera);
};
frame();

/* ══ THE CARD ════════════════════════════════════════════════════════════
   The whole card rides in the URL after the # — encoded as base64, so it
   survives being pasted into any messaging app. The # matters: everything
   after it never leaves the browser, so the message isn't even sent to
   whatever server is hosting the page.

   TextEncoder first, because btoa() alone chokes on anything non-ASCII and
   the first emoji anyone types would break the link.
*/
const packCard = (obj) => {
	const bytes = new TextEncoder().encode(JSON.stringify(obj));
	let bin = '';
	bytes.forEach((b) => { bin += String.fromCharCode(b); });
	return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
};

const unpackCard = (str) => {
	const bin = atob(str.replace(/-/g, '+').replace(/_/g, '/'));
	return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0))));
};

const VIBES = {
	hello:    { label: 'Hello',    head: 'Hello',           accent: '#ffb84d' },
	birthday: { label: 'Birthday', head: 'Happy Birthday',  accent: '#ff8fb1' },
	congrats: { label: 'Congrats', head: 'Congratulations', accent: '#7ff0c4' },
	miss:     { label: 'Miss you', head: 'Miss You',        accent: '#b98cff' },
};

let vibe = 'hello';

const applyVibe = (k) => {
	vibe = VIBES[k] ? k : 'hello';
	const hex = VIBES[vibe].accent;
	document.documentElement.style.setProperty('--accent', hex);
	accent.set(hex);
	beamMaterial.uniforms.uColor.value.set(hex);
	underglow.color.set(hex);
	motes.material.color.set(hex).lerp(new THREE.Color(0xffffff), 0.35);
	document.querySelectorAll('.vibe').forEach((b) => {
		b.setAttribute('aria-pressed', String(b.dataset.k === vibe));
	});
};

// ── compose ──
const $ = (id) => document.getElementById(id);
const composeView = $('composeView');
const cardView = $('cardView');

const vibeBox = $('vibes');
Object.entries(VIBES).forEach(([k, v]) => {
	const b = document.createElement('button');
	b.className = 'vibe';
	b.type = 'button';
	b.dataset.k = k;
	b.textContent = v.label;
	b.setAttribute('aria-pressed', String(k === vibe));
	b.addEventListener('click', () => { Sfx.wake(); Sfx.click(); applyVibe(k); });
	vibeBox.appendChild(b);
});

const msgEl = $('f-msg'), countEl = $('count');
msgEl.addEventListener('input', () => {
	const n = msgEl.value.length;
	countEl.textContent = n + ' / 240';
	countEl.classList.toggle('warn', n > 210);
});

const currentCard = () => ({
	v: vibe,
	t: $('f-to').value.trim(),
	m: msgEl.value.trim(),
	f: $('f-from').value.trim(),
});

const cardLink = (data) => location.href.split('#')[0] + '#c=' + packCard(data);

$('make').addEventListener('click', () => {
	Sfx.wake();
	Sfx.click();
	const data = currentCard();
	if (!data.m) {
		msgEl.focus();
		msgEl.placeholder = 'Write something first — even one line.';
		return;
	}
	const url = cardLink(data);
	$('link').value = url;
	$('result').classList.add('on');

	// A file:/// link is real, but only on this machine. Say so plainly
	// rather than letting them send a dead link to someone.
	const note = $('linkNote');
	if (location.protocol === 'file:') {
		note.innerHTML = '';
		note.append('This link only works on ');
		const s = document.createElement('strong');
		s.textContent = 'this computer';
		note.append(s, ' — it points at a file, not a website. To send it to someone, put this page online first (drag the file onto netlify.com/drop), then make the link again from there.');
	} else {
		note.textContent = 'Paste it anywhere. The message travels inside the link, so nothing is stored on any server.';
	}
});

$('copy').addEventListener('click', async () => {
	const input = $('link');
	const btn = $('copy');
	try {
		await navigator.clipboard.writeText(input.value);
		btn.textContent = 'Copied';
	} catch {
		// clipboard access needs a secure context, which file:// often isn't
		input.select();
		btn.textContent = document.execCommand?.('copy') ? 'Copied' : 'Press ⌘/Ctrl+C';
	}
	setTimeout(() => { btn.textContent = 'Copy'; }, 1800);
});

$('preview').addEventListener('click', () => {
	Sfx.wake();
	Sfx.click();
	const data = currentCard();
	if (!data.m) { msgEl.focus(); return; }
	showCard(data, true);
});

// ── show a card ──
let openedOnce = false;

function showCard(data, isPreview) {
	applyVibe(data.v);
	composeView.style.display = 'none';
	cardView.classList.add('on');

	const who = (data.t || '').trim();
	$('sealLine').textContent = who ? `Something arrived for ${who}.` : 'Someone sent you something.';

	// textContent, never innerHTML — the message comes out of a URL a
	// stranger could have written, and this is the line that keeps it text
	// instead of code.
	$('headline').textContent = who ? `${VIBES[data.v]?.head || 'Hello'}, ${who}` : (VIBES[data.v]?.head || 'Hello');
	$('body').textContent = data.m || '';
	$('sig').textContent = data.f ? `— ${data.f}` : '';

	$('ownCard').textContent = isPreview ? 'Back to editing' : 'Make your own';
	$('ownCard').onclick = () => {
		Sfx.click();
		if (isPreview) {
			cardView.classList.remove('on');
			$('message').classList.remove('lift', 'on');
			$('seal').style.display = '';
			composeView.style.display = '';
		} else {
			location.hash = '';
			location.reload();
		}
	};
}

$('open').addEventListener('click', () => {
	// The gate is here for a reason: browsers block audio until someone
	// interacts with the page, so the tap that opens the card is also the
	// tap that unlocks the sound.
	Sfx.wake();
	Sfx.setOn(true);
	$('mute').setAttribute('aria-pressed', 'true');
	Sfx.hail();
	Sfx.swell();
	hailPulse = 1;
	openedOnce = true;

	$('seal').style.display = 'none';
	const m = $('message');
	m.classList.add('on');
	requestAnimationFrame(() => m.classList.add('lift'));
});

$('again').addEventListener('click', () => {
	Sfx.wake();
	Sfx.hail();
	hailPulse = 1;
});

$('mute').addEventListener('click', () => {
	const el = $('mute');
	const on = el.getAttribute('aria-pressed') !== 'true';
	Sfx.wake();
	el.setAttribute('aria-pressed', String(on));
	Sfx.setOn(on);
});

// ── decide which mode we're in ──
const hash = location.hash.slice(1);
if (hash.startsWith('c=')) {
	try {
		showCard(unpackCard(hash.slice(2)), false);
	} catch {
		// a truncated or mangled link — say what happened, offer the way out
		showCard({ v: 'hello', t: '', m: "This link arrived damaged — some of it got lost on the way. Ask whoever sent it to send the whole thing again.", f: '' }, false);
	}
} else {
	applyVibe('hello');
}
</script>
</body>
</html>
