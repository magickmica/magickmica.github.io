<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Tape Library — Magick Mica</title>
<meta name="description" content="Every Magick Mica video note, shelved as a library of labelled tapes.">
<link rel="canonical" href="https://magickmica.github.io/explore/tapes.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Magick Mica">
<meta property="og:title" content="The Tape Library — Magick Mica">
<meta property="og:description" content="Every Magick Mica video note, shelved as a library of labelled tapes.">
<meta property="og:url" content="https://magickmica.github.io/explore/tapes.html">
<meta property="og:image" content="https://magickmica.github.io/og-card.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#040509">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="../archive.css?v=1">
<link rel="stylesheet" href="explore.css?v=1">
<style>
.tp-tools{display:flex; flex-wrap:wrap; gap:var(--ar-s3); align-items:end; margin:var(--ar-s4) 0 var(--ar-s5)}
.tp-tools .tp-q{flex:1 1 260px}
.tp-shelf{margin:var(--ar-s6) 0 0}
.tp-shelf__head{display:flex; justify-content:space-between; align-items:baseline; gap:var(--ar-s3); padding:0 var(--ar-s1) var(--ar-s2)}
.tp-shelf__head h2{font-family:var(--ar-font-display); font-weight:500; font-size:var(--ar-fs-lg); margin:0}
.tp-row{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:var(--ar-s4); padding:var(--ar-s4) var(--ar-s4) var(--ar-s5);
  border-radius:var(--ar-r) var(--ar-r) 4px 4px; background:linear-gradient(180deg,rgba(19,28,63,.35),rgba(19,28,63,.6));
  border:1px solid var(--ar-line); border-bottom:6px solid #3a3f63; box-shadow:0 14px 0 -8px rgba(0,0,0,.45)}
/* a cassette */
.tp-tape{all:unset; box-sizing:border-box; cursor:pointer; position:relative; display:flex; flex-direction:column; aspect-ratio:1.58/1;
  padding:8% 7% 6%; border-radius:10px; background:linear-gradient(160deg,#23263b,#121424 70%); color:#1b1630;
  box-shadow:0 8px 20px rgba(0,0,0,.5),inset 0 0 0 1px rgba(213,194,220,.14); transition:transform var(--ar-t) var(--ar-ease)}
.tp-tape:hover{transform:translateY(-3px) rotate(-.6deg)}
.tp-tape:focus-visible{outline:2px solid var(--ar-focus); outline-offset:4px}
.tp-label{flex:1; display:grid; grid-template-columns:42% 1fr; gap:6px; padding:6px; border-radius:4px;
  background:linear-gradient(180deg,#f1ebf4 0 18%,#e9e1ee 18% 100%); position:relative; overflow:hidden}
.tp-label::before{content:""; position:absolute; left:0; right:0; top:18%; height:3px; background:var(--ar-holo); opacity:.85}
.tp-win{position:relative; border-radius:3px; overflow:hidden; background:#0b0d18; margin-top:16%}
.tp-static::before{content:"\25B6" !important; padding:0 !important; font-size:.9rem !important}
.tp-win img{display:block; width:100%; height:100%; object-fit:cover; filter:saturate(1.05)}
.tp-text{display:flex; flex-direction:column; gap:2px; min-width:0; margin-top:16%}
.tp-title{font-family:"Fraunces",Georgia,serif; font-style:italic; font-size:.92rem; line-height:1.2; color:#1b1630; overflow:hidden;
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical}
.tp-rec{font-family:var(--ar-font-mono); font-size:.72rem; color:#4a4163; margin-top:auto}
.tp-brand{position:absolute; left:10px; top:6px; font-family:var(--ar-font-mono); font-size:.66rem; letter-spacing:.14em; color:#4a4163}
.tp-reels{display:flex; justify-content:center; gap:28%; margin-top:6px}
.tp-reels i{width:15%; aspect-ratio:1; border-radius:50%; background:radial-gradient(circle,#0b0d18 30%,#5a5f80 32% 40%,#22253a 42%); box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.tp-empty{padding:var(--ar-s7) 0}
@media (max-width:720px){.tp-row{grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:var(--ar-s3); padding:var(--ar-s3)} .tp-title{font-size:.8rem; -webkit-line-clamp:2}}
@media (prefers-reduced-motion:reduce){.tp-tape:hover{transform:none}}
</style>
</head>
<body class="ar-page mmx-page-tapes">
<a class="ar-skip" href="#main">Skip to the tapes</a>
<div class="ar-sky" aria-hidden="true"></div>
<header class="ar-wrap mmx-head" id="mmx-head"></header>
<main id="main" class="ar-wrap" tabindex="-1">
<div class="tp-tools">
  <div class="tp-q"><label class="ar-label" for="q">Search the tape labels</label><input class="ar-input" type="search" id="q" placeholder="words from the note…" autocomplete="off"></div>
  <div><span class="ar-label" id="ordL">Shelve</span><div class="ar-seg" role="group" aria-labelledby="ordL"><button type="button" data-o="new" aria-pressed="true">Newest first</button><button type="button" data-o="old" aria-pressed="false">Oldest first</button></div></div>
  <button type="button" class="ar-btn ar-btn--signal" id="rand">Play a random tape</button>
</div>
<p class="ar-meta" id="found" role="status"></p>
<div id="shelves"></div>
</main>
<footer class="ar-wrap mmx-foot" id="mmx-foot"></footer>
<script src="../archive.js?v=1"></script>
<script src="notes-data.js"></script>
<script src="explore.js?v=2"></script>
<script>
MMX.chrome({ here: 'tapes.html', title: 'THE TAPE LIBRARY',
  subtitle: 'Every video transmission, shelved month by month. Pick a tape to preview it, then watch it on Substack.' });
MMX.ready(function (notes) {
  var A = MMArchive, esc = MMX.esc, fmt = MMX.fmt;
  var tapes = notes.filter(function (n) { return n.kind === 'video'; });
  MMX.status('<span class="ar-count">' + fmt(tapes.length) + '</span> tapes on the shelves');
  var schema = { q: '', o: 'new' }, st = A.url.read(schema);
  var q = document.getElementById('q'); q.value = st.q;
  var shelves = document.getElementById('shelves'), found = document.getElementById('found');

  function tape(n, list) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'tp-tape';
    var title = MMX.firstLine(n.b, 70);
    var d = n.d.split('-');
    b.setAttribute('aria-label', 'Tape from ' + A.dates.label(n.d) + (title ? ': ' + title : ''));
    b.innerHTML = '<div class="tp-label"><span class="tp-brand" aria-hidden="true">MMTV · T-' + d[0].slice(2) + d[1] + '</span>' +
      '<span class="tp-win"><img src="' + esc(n.thumb) + '" alt="" loading="lazy" decoding="async"></span>' +
      '<span class="tp-text"><span class="tp-title">' + (title ? esc(title) : '<span style="opacity:.6">no label</span>') + '</span>' +
      '<span class="tp-rec">REC ' + d[0] + '·' + d[1] + '·' + d[2] + '</span></span></div>' +
      '<div class="tp-reels" aria-hidden="true"><i></i><i></i></div>';
    var im = b.querySelector('img');
    im.addEventListener('error', function () { im.replaceWith(Object.assign(document.createElement('span'), { className: 'ar-media--video tp-static', style: 'display:grid;height:100%;min-height:0' })); }, { once: true });
    b.addEventListener('click', function () { MMX.viewer.open(n, list); });
    return b;
  }
  function draw() {
    var term = st.q.trim().toLowerCase();
    var list = term ? tapes.filter(function (n) { return n.b.toLowerCase().indexOf(term) !== -1; }) : tapes.slice();
    if (st.o === 'new') list.reverse();
    shelves.innerHTML = '';
    found.textContent = term ? fmt(list.length) + ' tape' + (list.length === 1 ? '' : 's') + ' match “' + st.q.trim() + '”' : '';
    if (!list.length) {
      shelves.innerHTML = '<div class="ar-state tp-empty"><div class="ar-noise" aria-hidden="true"></div><p class="ar-state__title">NO SIGNAL FOUND.</p>' +
        '<p class="ar-state__body">No tape label matches that. Try another frequency, earthling.</p><button type="button" class="ar-btn" id="clr">Clear search</button></div>';
      document.getElementById('clr').onclick = function () { q.value = ''; st.q = ''; A.url.write(st, schema); draw(); q.focus(); };
      A.announce('No tapes match'); return;
    }
    var groups = [], cur = null;
    list.forEach(function (n) { var ym = n.d.slice(0, 7); if (!cur || cur.ym !== ym) { cur = { ym: ym, items: [] }; groups.push(cur); } cur.items.push(n); });
    var frag = document.createDocumentFragment();
    groups.forEach(function (g) {
      var s = document.createElement('section'); s.className = 'tp-shelf';
      var id = 'shelf-' + g.ym;
      s.innerHTML = '<div class="tp-shelf__head"><h2 id="' + id + '">' + A.dates.monthLabel(g.ym) + '</h2><span class="ar-meta">' + g.items.length + ' tape' + (g.items.length === 1 ? '' : 's') + '</span></div>';
      var row = document.createElement('div'); row.className = 'tp-row'; row.setAttribute('role', 'list'); row.setAttribute('aria-labelledby', id);
      g.items.forEach(function (n) { var w = document.createElement('div'); w.setAttribute('role', 'listitem'); w.appendChild(tape(n, list)); row.appendChild(w); });
      s.appendChild(row); frag.appendChild(s);
    });
    shelves.appendChild(frag);
    if (term) A.announce(list.length + ' tapes match');
  }
  q.addEventListener('input', A.util.debounce(function () { st.q = q.value; A.url.write(st, schema); draw(); }, 200));
  document.querySelectorAll('[data-o]').forEach(function (b) {
    b.setAttribute('aria-pressed', b.dataset.o === st.o ? 'true' : 'false');
    b.addEventListener('click', function () {
      st.o = b.dataset.o; A.url.write(st, schema);
      document.querySelectorAll('[data-o]').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      draw();
    });
  });
  document.getElementById('rand').addEventListener('click', function () {
    var n = A.random.pick(tapes);
    A.random.tune('Rewinding…').then(function () { MMX.viewer.open(n, tapes); });
  });
  draw();
});
</script>
<script src="../mm-nav.js?v=3" defer></script>
</body>
</html>
