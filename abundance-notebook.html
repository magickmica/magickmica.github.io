<style>
:root{
  --void:#07060e;
  --violet:#a020f0;
  --magenta:#ff44cc;
  --gold:#ffd166;
  --cyan:#22e0ff;
  --mist:#b8b0d4;
  --dim:#6f6890;

  --paper:#f7f2e6;
  --paper-edge:#e3dbc8;
  --rule:rgba(92,120,186,.32);
  --margin-rule:#e8879f;
  --ink:#2f3a52;

  --glow1:#a020f0;
  --glow2:#ff44cc;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}

body{
  margin:0;padding:0 18px 60px;
  background:var(--void);
  color:var(--mist);
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:15px;line-height:1.5;
  overflow-x:hidden;
}

.sky{
  position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:.32;
  background:
    radial-gradient(115% 74% at 50% -14%, var(--glow1) 0%, transparent 58%),
    radial-gradient(88% 58% at 86% 110%, var(--glow2) 0%, transparent 62%);
  transition:background 1s linear;
}
.grain{
  position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:
    radial-gradient(1px 1px at 14% 24%, rgba(255,255,255,.85) 50%, transparent 50%),
    radial-gradient(1px 1px at 66% 44%, rgba(255,255,255,.5) 50%, transparent 50%),
    radial-gradient(1.5px 1.5px at 34% 78%, rgba(255,209,102,.75) 50%, transparent 50%),
    radial-gradient(1px 1px at 88% 86%, rgba(34,224,255,.65) 50%, transparent 50%);
  background-size:200px 200px,200px 200px,200px 200px,200px 200px;
}

a{color:var(--cyan)}
a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

.wrap{max-width:660px;margin:0 auto}

/* ---------------------------------------------------------- header */
header{text-align:center;padding:44px 0 26px}
.eyebrow{
  font-size:10px;letter-spacing:.32em;text-transform:uppercase;
  color:var(--dim);margin:0 0 14px;
}
h1{
  font-family:"Orbitron",sans-serif;font-weight:700;
  font-size:clamp(20px,4.8vw,31px);letter-spacing:.03em;margin:0;
  color:transparent;
  background:linear-gradient(96deg,var(--violet),var(--magenta) 28%,var(--gold) 56%,var(--cyan) 84%,var(--violet));
  background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;
  animation:holo 11s linear infinite;
}
@keyframes holo{to{background-position:220% 0}}

/* ---------------------------------------------------------- notebook */
.desk{position:relative;perspective:1700px;margin:0 auto}

.book{
  position:relative;
  width:100%;
  aspect-ratio:1/1.28;
  max-height:66vh;
  transform-style:preserve-3d;
}

/* the unturned pages stacked underneath, right edge */
.stack{
  position:absolute;top:8px;bottom:8px;right:-1px;
  width:14px;border-radius:0 5px 5px 0;
  background:
    repeating-linear-gradient(180deg,
      var(--paper-edge) 0 2px, rgba(255,255,255,.75) 2px 4px);
  box-shadow:2px 2px 9px rgba(0,0,0,.5);
  transition:width .5s ease, opacity .5s ease;
  z-index:1;
}

.sheet{
  position:absolute;inset:0;
  transform-origin:left center;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  border-radius:3px 7px 7px 3px;
  background-color:var(--paper);
  background-image:
    linear-gradient(180deg, rgba(0,0,0,.05), transparent 12%),
    repeating-linear-gradient(180deg,
      transparent 0 33px, var(--rule) 33px 34px);
  background-position:0 0, 0 84px;
  box-shadow:0 16px 40px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.35);
  transition:transform .62s cubic-bezier(.42,.06,.28,1);
  overflow:hidden;
  display:flex;flex-direction:column;
}
/* the punched margin column + red rule */
.sheet::before{
  content:"";position:absolute;top:0;bottom:0;left:0;width:62px;
  background:linear-gradient(90deg, rgba(0,0,0,.09), transparent);
  border-right:1px solid var(--margin-rule);
  pointer-events:none;
}
/* shading that deepens toward the spine as the page lifts */
.sheet::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg, rgba(60,40,20,.22), transparent 22%);
}

.sheet.flip-fwd{transform:rotateY(-174deg)}
.sheet.instant{transition:none}

.sheet-body{
  position:relative;z-index:2;
  flex:1;display:flex;align-items:center;
  padding:64px 34px 64px 84px;
}
.sheet-text{
  font-family:"Caveat",cursive;
  font-weight:500;
  font-size:clamp(27px,5.6vw,38px);
  line-height:34px;           /* locks the handwriting onto the ruled lines */
  color:var(--ink);
  margin:0;
  text-wrap:balance;
  transform:rotate(-.5deg);
}
.sheet-no{
  position:absolute;right:26px;bottom:20px;z-index:2;
  font-family:"Caveat",cursive;font-size:21px;color:#8d93a8;
}
.sheet-star{
  position:absolute;left:20px;bottom:18px;z-index:2;
  font-size:15px;color:var(--margin-rule);opacity:.75;
}

/* spiral binding sits above every sheet */
.rings{
  position:absolute;top:0;bottom:0;left:-9px;width:40px;z-index:6;
  display:flex;flex-direction:column;justify-content:space-around;
  padding:16px 0;pointer-events:none;
}
.rings i{
  display:block;width:38px;height:11px;border-radius:999px;
  background:linear-gradient(90deg,#cfc7e6,#8f86ad 42%,#efe9ff 62%,#6f6890);
  box-shadow:0 2px 3px rgba(0,0,0,.55), inset 0 -1px 1px rgba(0,0,0,.35);
}

/* ---------------------------------------------------------- controls */
.controls{
  display:flex;align-items:center;justify-content:center;gap:12px;
  margin:26px 0 0;flex-wrap:wrap;
}
.btn{
  font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:500;
  letter-spacing:.16em;text-transform:uppercase;
  color:var(--mist);background:transparent;
  border:1px solid rgba(184,176,212,.34);border-radius:999px;
  padding:12px 20px;min-height:44px;min-width:44px;cursor:pointer;
  transition:border-color .18s ease,color .18s ease;
}
.btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
.btn:disabled{opacity:.32;cursor:default}
.btn.gold{
  color:var(--void);border:0;
  background:linear-gradient(96deg,var(--gold),#ffe9b5 55%,var(--gold));
  box-shadow:0 0 24px rgba(255,209,102,.3);
}
.btn.gold:hover{box-shadow:0 0 34px rgba(255,209,102,.5);color:var(--void)}

.counter{
  font-size:11px;letter-spacing:.2em;color:var(--dim);
  text-align:center;margin:16px 0 0;
}
.counter b{color:var(--gold);font-weight:500}

.hint{
  text-align:center;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:#544f70;margin:10px 0 0;
}

/* ---------------------------------------------------------- foot */
.foot{text-align:center;margin-top:52px;font-size:12px;color:var(--dim)}
.foot nav{margin:0 0 14px;line-height:2.2}
.foot nav a{margin:0 9px;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.foot .fine{font-size:11px;color:#514c70}

@media (max-width:560px){
  .book{aspect-ratio:1/1.3;max-height:none}
  .sheet-body{padding:48px 22px 52px 74px}
  .sheet::before{width:54px}
  .rings i{width:32px;height:9px}
  .rings{left:-7px;width:34px}
}

@media (prefers-reduced-motion:reduce){
  h1{animation:none}
  .sheet{transition:none}
  .sky,.stack{transition:none}
}
</style>

d in glitter and impossible timing."},{"i":24,"a":"Your next level is calling. Pick up the cosmic phone."},{"i":25,"a":"You are stepping into the version of yourself who receives without fear."},{"i":26,"a":"Your energy is expensive. Your dreams are priceless."},{"i":27,"a":"The universe is opening treasure chests you didn’t even know existed."},{"i":28,"a":"Your reality is upgrading from survival mode to magical creation mode."},{"i":29,"a":"The stars are rearranging themselves around your new beginning."},{"i":30,"a":"Your quiet season is ending. Your blooming season has arrived."},{"i":31,"a":"The universe has been collecting miracles with your name on them."},{"i":32,"a":"Your abundance portal is open. Walk through with confidence."},{"i":33,"a":"What’s coming next will make you grateful you never gave up."},{"i":34,"a":"Your future is glowing brighter than your doubts."},{"i":35,"a":"A wave of unexpected joy is heading toward you."},{"i":36,"a":"Your life is becoming a masterpiece written in cosmic ink."},{"i":37,"a":"The universe is about to surprise you in ways your imagination hasn’t reached yet."},{"i":38,"a":"Your dreams are not unrealistic. They are invitations from your future self."},{"i":39,"a":"You are entering a season where things finally begin to make sense."},{"i":40,"a":"Your patience is transforming into prosperity."},{"i":41,"a":"The universe is delivering blessings with extra sparkle."},{"i":42,"a":"Your heart has been preparing for the abundance your hands are about to hold."},{"i":43,"a":"Your next miracle is already in motion."},{"i":44,"a":"The invisible work is becoming visible magic."},{"i":45,"a":"Your timeline just received a cosmic upgrade."},{"i":46,"a":"Your energy is calling in opportunities that match your highest vision."},{"i":47,"a":"The universe is opening golden doors you didn’t even know existed."},{"i":48,"a":"Your dreams are blooming beyond the limits you placed on them."},{"i":49,"a":"A magical chapter is beginning, and y (function () {
  'use strict';

  var TOTAL = SIGNS.length;
  var sheetA = document.getElementById('sheetA');
  var sheetB = document.getElementById('sheetB');
  var stackEl = document.getElementById('stack');
  var ringsEl = document.getElementById('rings');
  var skyEl = document.getElementById('sky');
  var curEl = document.getElementById('cur');
  var prevEl = document.getElementById('prev');
  var nextEl = document.getElementById('next');
  var randEl = document.getElementById('rand');

  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var FLIP = 640;

  var front = sheetA;   // the sheet currently facing up
  var back = sheetB;    // the sheet waiting underneath
  var idx = 0;
  var busy = false;

  /* ------------------------------------------------ spiral binding */
  for (var r = 0; r < 11; r++) { ringsEl.appendChild(document.createElement('i')); }

  function pad(n) {
    var s = String(n);
    while (s.length < 3) { s = '0' + s; }
    return s;
  }

  function setHash(hash) {
    try {
      if (history.replaceState) { history.replaceState(null, '', hash); }
    } catch (e) {}
  }

  /* ------------------------------------------------ paint a sheet */
  function draw(sheet, i) {
    var sign = SIGNS[i];
    if (!sign) return;
    sheet.querySelector('.sheet-text').textContent = sign.a;
    sheet.querySelector('.sheet-no').textContent = pad(sign.i);
  }

  /* backdrop drifts through the same spectrum as the portal's descent */
  var STOPS = [
    ['#a020f0', '#ff44cc'],
    ['#ff44cc', '#ffd166'],
    ['#ffd166', '#22e0ff'],
    ['#22e0ff', '#a020f0']
  ];
  var lastBand = -1;

  function chrome() {
    curEl.textContent = pad(idx + 1);
    prevEl.disabled = idx === 0;
    nextEl.disabled = idx === TOTAL - 1;
    nextEl.textContent = idx === TOTAL - 1 ? 'Last sheet' : 'Turn the page \u2192';

    var remaining = (TOTAL - 1 - idx) / (TOTAL - 1);
    stackEl.style.width = Math.max(2, remaining * 14) + 'px';
    stackEl.style.opacity = remaining <= 0 ? 0 : 1;

    var band = Math.min(STOPS.length - 1, Math.floor((idx / TOTAL) * STOPS.length));
    if (band !== lastBand) {
      lastBand = band;
      skyEl.style.setProperty('--glow1', STOPS[band][0]);
      skyEl.style.setProperty('--glow2', STOPS[band][1]);
    }

    setHash('#sheet-' + pad(idx + 1));
  }

  /* ------------------------------------------------ turning */
  function swapRoles() {
    var t = front; front = back; back = t;
    front.style.zIndex = 4;
    back.style.zIndex = 3;
    front.removeAttribute('aria-hidden');
    front.setAttribute('aria-live', 'polite');
    back.setAttribute('aria-hidden', 'true');
    back.removeAttribute('aria-live');
  }

  function turn(to, dir) {
    if (busy || to < 0 || to >= TOTAL || to === idx) return;
    busy = true;

    if (reduced) {
      draw(front, to);
      idx = to; chrome(); busy = false;
      return;
    }

    if (dir === 'next') {
      // the incoming sheet waits underneath; the current one lifts away
      draw(back, to);
      back.style.zIndex = 3;
      front.style.zIndex = 4;
      front.classList.add('flip-fwd');

      window.setTimeout(function () {
        front.classList.add('instant');
        front.classList.remove('flip-fwd');
        swapRoles();
        // reset the sheet that just turned, now waiting underneath
        void back.offsetWidth;
        back.classList.remove('instant');
        idx = to; chrome(); busy = false;
      }, FLIP);

    } else {
      // the incoming sheet swings back in from the spine, over the top
      draw(back, to);
      back.classList.add('instant', 'flip-fwd');
      back.style.zIndex = 5;
      void back.offsetWidth;
      back.classList.remove('instant');
      back.classList.remove('flip-fwd');

      window.setTimeout(function () {
        swapRoles();
        idx = to; chrome(); busy = false;
      }, FLIP);
    }
  }

  /* ------------------------------------------------ events */
  nextEl.addEventListener('click', function () { turn(idx + 1, 'next'); });
  prevEl.addEventListener('click', function () { turn(idx - 1, 'prev'); });
  randEl.addEventListener('click', function () {
    var to = idx;
    while (to === idx && TOTAL > 1) { to = Math.floor(Math.random() * TOTAL); }
    turn(to, to > idx ? 'next' : 'prev');
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') { turn(idx + 1, 'next'); }
    else if (e.key === 'ArrowLeft') { turn(idx - 1, 'prev'); }
  });

  var touchX = null;
  var book = document.getElementById('book');
  book.addEventListener('touchstart', function (e) {
    touchX = e.changedTouches[0].clientX;
  }, { passive: true });
  book.addEventListener('touchend', function (e) {
    if (touchX === null) return;
    var dx = e.changedTouches[0].clientX - touchX;
    touchX = null;
    if (Math.abs(dx) < 45) return;
    turn(dx < 0 ? idx + 1 : idx - 1, dx < 0 ? 'next' : 'prev');
  }, { passive: true });

  book.addEventListener('click', function (e) {
    if (e.target.closest('button')) return;
    var r = book.getBoundingClientRect();
    if (e.clientX - r.left > r.width * 0.55) { turn(idx + 1, 'next'); }
  });

  /* ------------------------------------------------ boot */
  front.style.zIndex = 4;
  back.style.zIndex = 3;

  var deep = /^#sheet-(\d{1,3})$/.exec(window.location.hash);
  var start = 0;
  if (deep) {
    var n = parseInt(deep[1], 10);
    if (n >= 1 && n <= TOTAL) { start = n - 1; }
  }
  idx = start;
  draw(front, idx);
  draw(back, Math.min(idx + 1, TOTAL - 1));
  chrome();
})();
</script>
