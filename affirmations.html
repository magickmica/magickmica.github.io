<style>
:root{
  --void:#07060e; --void2:#0d0b18; --pearl:#ece9f7; --pearl-dim:#9d96b8;
  --pink:#ff9be4; --cyan:#7bf1e4; --violet:#9b7bff; --gold:#ffd98a;
  --holo:linear-gradient(115deg,var(--violet),var(--pink) 30%,var(--gold) 55%,var(--cyan) 80%,var(--violet));
  --display:"Bodoni Moda",Didot,serif; --mono:"IBM Plex Mono",monospace;
  --pixel:"Silkscreen",monospace; --arcade:"Orbitron",sans-serif; --serif:"Spectral",serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{min-height:100dvh;background:var(--void);color:var(--pearl);font-family:var(--mono);overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
a{color:var(--cyan)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 25% 12%,rgba(155,123,255,.18),transparent 55%),radial-gradient(ellipse at 78% 85%,rgba(255,155,228,.14),transparent 55%),radial-gradient(ellipse at 50% 50%,rgba(123,241,228,.06),transparent 75%)}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(1px 1px at 12% 22%,#fff9,transparent),radial-gradient(1px 1px at 32% 62%,#fff7,transparent),radial-gradient(1.5px 1.5px at 72% 32%,var(--gold),transparent),radial-gradient(1.5px 1.5px at 85% 68%,var(--pink),transparent),radial-gradient(1px 1px at 55% 12%,var(--cyan),transparent);animation:tw 5s infinite alternate}
@keyframes tw{from{opacity:.4}to{opacity:.95}}
@keyframes sh{to{background-position:200% center}}
.wrap{position:relative;z-index:2;max-width:600px;margin:0 auto;padding:clamp(16px,3vw,32px)}
.top{text-align:center;padding:2rem 1rem 1rem}
.top h1{font-family:var(--arcade);font-weight:900;font-size:clamp(1.7rem,6vw,3.2rem);letter-spacing:.03em;margin:0;background:var(--holo);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 22px rgba(255,155,228,.4));animation:sh 6s linear infinite}
.top p{font-family:var(--pixel);font-size:.72rem;letter-spacing:.16em;color:var(--cyan);margin:.6rem 0 0;text-shadow:0 0 8px var(--cyan)}
.top .date{font-family:var(--serif);font-style:italic;color:var(--pearl-dim);margin-top:.5rem;font-size:.95rem}
.top nav{margin-top:1rem;display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap}
.top nav a{font-family:var(--pixel);font-size:.64rem;letter-spacing:.1em;color:var(--gold);text-decoration:none;border:1px solid var(--gold);padding:.3rem .7rem;transition:.2s}
.top nav a:hover{background:var(--gold);color:#000;box-shadow:0 0 12px var(--gold)}

.ticket{max-width:400px;margin:1.5rem auto 0}
.ticket__frame{position:relative;aspect-ratio:3/4;border-radius:8px;overflow:hidden;border:1px solid rgba(155,123,255,.3);box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 30px rgba(255,217,138,.15)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;background:linear-gradient(160deg,#150f28,#0a0714)}
.face__img{flex:1;min-height:0;width:100%;object-fit:cover;display:block}
.face__meta{padding:.9rem 1rem;background:rgba(7,6,14,.92);border-top:1px solid rgba(255,217,138,.25)}
.face__eyebrow{font-family:var(--pixel);font-size:.58rem;letter-spacing:.15em;color:var(--gold);margin:0 0 .4rem}
.face__quote{font-family:var(--display);font-style:italic;font-size:1.05rem;line-height:1.45;color:var(--pearl);margin:0 0 .5rem}
.face__stats{font-family:var(--pixel);font-size:.6rem;letter-spacing:.1em;color:var(--cyan)}
.ticket__canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2;touch-action:none;cursor:crosshair}
.ticket__sparks{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.scratch-hint{text-align:center;font-family:var(--pixel);font-size:.62rem;letter-spacing:.12em;color:var(--pearl-dim);margin-top:1rem}
.reveal-note{max-width:400px;margin:1rem auto 0;padding:.9rem;border:1px solid rgba(255,217,138,.3);background:rgba(255,217,138,.05);border-radius:6px;display:none;text-align:center}
.reveal-note[data-on="true"]{display:block;animation:fade .5s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.reveal-note a{font-family:var(--pixel);font-size:.64rem;letter-spacing:.1em}
.controls{display:flex;gap:.6rem;justify-content:center;margin-top:1.4rem;flex-wrap:wrap}
.btn{font-family:var(--pixel);font-size:.7rem;letter-spacing:.08em;border:1px solid var(--cyan);color:var(--cyan);padding:.55rem 1.1rem;transition:.2s;border-radius:5px}
.btn:hover{background:var(--cyan);color:#000;box-shadow:0 0 12px var(--cyan)}
.btn.gold{border-color:var(--gold);color:var(--gold)}
.btn.gold:hover{background:var(--gold);color:#000;box-shadow:0 0 12px var(--gold)}
.btn:disabled{opacity:.3;pointer-events:none}
.daily-badge{text-align:center;font-family:var(--pixel);font-size:.62rem;letter-spacing:.14em;margin-top:1.5rem;color:var(--pearl-dim)}
.daily-badge b{color:var(--gold)}
.foot{text-align:center;padding:3rem 1rem 2rem;font-family:var(--pixel);font-size:.62rem;letter-spacing:.12em;color:var(--pearl-dim)}
.foot a{color:var(--pink)}
</style>
</head>

t—and suddenly, all illusions volunteer to be seen.”","l":15},{"id":271241646,"t":"https://substackcdn.com/image/fetch/$s_!G4Yk!,w_400,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F7623f261-331b-4125-b3b9-ae8e3e05d63a_1254x1254.png","b":"I decorate with candles because optimism needs dim lighting.","l":15},{"id":265609551,"t":"https://substackcdn.com/image/fetch/$s_!G4Yk!,w_400,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa83634d9-87c9-4efa-92d0-d3c3dd15ae22_1254x1254.png","b":"I believe it’s magic.","l":15},{"id":254668552,"t":"https://substackcdn.com/image/fetch/$s_!G4Yk!,w_400,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F355b5b3a-9ad0-4550-b2d6-d1a7f669fef8_500x500.gif","b":"Make Magick All Day","l":15},{"id":253045702,"t":"https://substackcdn.com/image/fetch/$s_!G4Yk!,w_400,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F05159857-9a65-4646-b301-93bcb98f7296_1888x1888.png","b":"No dream carried me away—I walked straight into the magic with my eyes wide open.","l":15}];
const $ = s => document.querySelector(s);
const noteUrl = id => `https://substack.com/@magickmica/note/c-${id}`;

// today's date + deterministic daily pick
const now = new Date();
$('#todayDate').textContent = now.toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});
const dailyPick = AFFIRMATIONS[Math.floor(Math.random()*AFFIRMATIONS.length)];

let state={note:null,revealed:false,isDaily:true};

/* ---- scratch engine ---- */
const coat=$('#coat'), sparks=$('#sparks');
const ctx=coat.getContext('2d',{willReadFrequently:true});
const sctx=sparks.getContext('2d');
let W=0,H=0,DPR=1,needsInit=false;
const frame=document.querySelector('.ticket__frame');
const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function sizeCanvases(){const r=frame.getBoundingClientRect();if(r.width<2||r.height<2)return false;
  DPR=Math.min(window.devicePixelRatio||1,2);W=Math.round(r.width);H=Math.round(r.height);
  [coat,sparks].forEach(c=>{c.width=Math.round(W*DPR);c.height=Math.round(H*DPR);c.getContext('2d').setTransform(DPR,0,0,DPR,0,0);});return true;}
function initCoating(){if(!sizeCanvases()){needsInit=true;return;}needsInit=false;sctx.clearRect(0,0,W,H);
  if(state.revealed){coat.style.opacity='0';return;}paintCoating();}
new ResizeObserver(()=>{const r=frame.getBoundingClientRect();if(r.width<2||r.height<2)return;
  const changed=Math.abs(r.width-W)>1||Math.abs(r.height-H)>1;if(needsInit||changed)initCoating();}).observe(frame);

function paintCoating(){ctx.globalCompositeOperation='source-over';ctx.clearRect(0,0,W,H);
  const base=ctx.createLinearGradient(0,0,W,H);base.addColorStop(0,'#1a1330');base.addColorStop(.5,'#0d0a16');base.addColorStop(1,'#1c1526');
  ctx.fillStyle=base;ctx.fillRect(0,0,W,H);
  const img=ctx.getImageData(0,0,coat.width,coat.height),px=img.data;
  for(let i=0;i<px.length;i+=4){const n=(Math.random()-.5)*24;px[i]+=n;px[i+1]+=n;px[i+2]+=n*1.1;}
  ctx.putImageData(img,0,0);
  ['rgba(255,217,138,.2)','rgba(255,155,228,.16)','rgba(123,241,228,.14)'].forEach(c=>{
    for(let i=0;i<5;i++){const x=Math.random()*W,y=Math.random()*H,r=40+Math.random()*90;
      const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c);g.addColorStop(1,'transparent');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();}});
  for(let i=0;i<Math.round(W*H/900);i++){const x=Math.random()*W,y=Math.random()*H,s=Math.random()*1.5+.3;
    ctx.fillStyle=['rgba(255,255,255,.55)','rgba(255,217,138,.5)','rgba(123,241,228,.45)','rgba(255,155,228,.45)'][i%4];ctx.fillRect(x,y,s,s);}
  ctx.textAlign='center';ctx.fillStyle='rgba(255,217,138,.5)';ctx.font=`${Math.max(9,W*.03)}px "Silkscreen",monospace`;
  ctx.fillText('✦ MAGICK MICA ✦',W/2,H*.4);
  ctx.fillStyle='rgba(236,233,247,.86)';const big=Math.min(W*.1,H*.07);
  ctx.font=`900 ${Math.max(16,big)}px "Bodoni Moda",Didot,serif`;ctx.fillText('AFFIRMATION',W/2,H*.5);
  ctx.fillStyle='rgba(123,241,228,.75)';ctx.font=`${Math.max(9,W*.025)}px "Silkscreen",monospace`;ctx.fillText('SCRATCH TO REVEAL',W/2,H*.6);
  const edge=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.72);
  edge.addColorStop(0,'rgba(0,0,0,0)');edge.addColorStop(1,'rgba(0,0,0,.5)');ctx.fillStyle=edge;ctx.fillRect(0,0,W,H);}

let drawing=false,lastP=null,sinceCheck=0,parts=[],rafId=null,flash=0;
const BRUSH=()=>Math.max(16,Math.min(W,H)*.085);
function pos(e){const r=coat.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
function carve(a,b){ctx.globalCompositeOperation='destination-out';const r=BRUSH();
  ctx.strokeStyle='#000';ctx.fillStyle='#000';ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=r;
  ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  for(let i=0;i<4;i++){const t=Math.random(),x=a.x+(b.x-a.x)*t+(Math.random()-.5)*r*1.5,y=a.y+(b.y-a.y)*t+(Math.random()-.5)*r*1.5;
    ctx.beginPath();ctx.arc(x,y,Math.random()*r*.34,0,7);ctx.fill();}ctx.globalCompositeOperation='source-over';}
function onDown(e){if(state.revealed)return;drawing=true;lastP=pos(e);coat.setPointerCapture?.(e.pointerId);carve(lastP,lastP);}
function onMove(e){if(!drawing||state.revealed)return;const p=pos(e);const sp=Math.hypot(p.x-lastP.x,p.y-lastP.y);
  carve(lastP,p);emitSparks(p,sp);lastP=p;if(++sinceCheck>6){sinceCheck=0;measure();}}
function onUp(){if(!drawing)return;drawing=false;measure();}
coat.addEventListener('pointerdown',onDown);coat.addEventListener('pointermove',onMove);
window.addEventListener('pointerup',onUp);window.addEventListener('pointercancel',onUp);
function measure(){const step=8,data=ctx.getImageData(0,0,coat.width,coat.height).data;let clear=0,total=0,rb=coat.width*4;
  for(let y=0;y<coat.height;y+=step)for(let x=0;x<coat.width;x+=step){total++;if(data[y*rb+x*4+3]<40)clear++;}
  if(clear/total>=.55&&!state.revealed)revealCard();}
function emitSparks(p,sp){if(reduceMotion)return;const n=Math.min(5,1+Math.round(sp/8));
  for(let i=0;i<n;i++)parts.push({x:p.x+(Math.random()-.5)*BRUSH(),y:p.y+(Math.random()-.5)*BRUSH(),
    vx:(Math.random()-.5)*1.1,vy:(Math.random()-.5)*1.1-.25,life:1,decay:.02+Math.random()*.03,
    size:Math.random()*2+.6,hue:['#ffffff','#ffd98a','#7bf1e4','#ff9be4'][i%4]});loop();}
function dissolve(){const step=Math.max(4,Math.round(coat.width/72));
  const data=ctx.getImageData(0,0,coat.width,coat.height).data,rb=coat.width*4;
  const pal=['#ffffff','#fff4d6','#ffd98a','#7bf1e4','#ff9be4','#9b7bff'];
  for(let y=0;y<coat.height;y+=step)for(let x=0;x<coat.width;x+=step){
    if(data[y*rb+x*4+3]>60)parts.push({x:x/DPR+(Math.random()-.5)*4,y:y/DPR+(Math.random()-.5)*4,
      vx:(Math.random()-.5)*1.8,vy:-.4-Math.random()*1.8,life:1,decay:.005+Math.random()*.009,
      size:Math.random()*3+1,hue:pal[(Math.random()*pal.length)|0]});}flash=1;coat.style.opacity='0';loop();}
function loop(){if(rafId)return;const tick=()=>{sctx.clearRect(0,0,W,H);sctx.globalCompositeOperation='lighter';
  if(flash>0){const bg=sctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.75);
    bg.addColorStop(0,'rgba(255,255,255,.85)');bg.addColorStop(.45,'rgba(255,240,214,.35)');bg.addColorStop(1,'rgba(255,255,255,0)');
    sctx.globalAlpha=flash;sctx.fillStyle=bg;sctx.fillRect(0,0,W,H);flash-=.035;}
  parts=parts.filter(p=>p.life>0);
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy-=.006;p.life-=p.decay;sctx.globalAlpha=Math.max(0,p.life);sctx.fillStyle=p.hue;sctx.fillRect(p.x,p.y,p.size,p.size);}
  sctx.globalAlpha=1;if(parts.length||flash>0)rafId=requestAnimationFrame(tick);else{rafId=null;sctx.clearRect(0,0,W,H);}};rafId=requestAnimationFrame(tick);}

function revealCard(skip){if(state.revealed)return;state.revealed=true;
  if(!skip&&!reduceMotion)dissolve();else coat.style.opacity='0';
  coat.style.pointerEvents='none';const n=state.note;
  $('#revealNote').dataset.on='true';$('#revealLink').href=noteUrl(n.id);
  $('#btnReveal').disabled=true;$('#hint').textContent='✦ carry this with you today ✦';}

function loadCard(note,isDaily){state.note=note;state.revealed=false;state.isDaily=isDaily;parts=[];flash=0;
  $('#faceImg').src=note.t;$('#faceQuote').textContent=note.b||'✦ you are magic ✦';
  $('#faceStats').textContent=`❤ ${note.l} · from the archive`;
  $('#faceEyebrow').textContent=isDaily?"✦ YOUR AFFIRMATION ✦":"✦ A MESSAGE FOR YOU ✦";
  $('#revealNote').dataset.on='false';$('#btnReveal').disabled=false;
  $('#hint').textContent='DRAG TO SCRATCH · 55% REVEALS THE REST';
  $('#dailyBadge').innerHTML=isDaily?'A fresh affirmation every visit · <b>scratch as many as you like</b>':'Pull as many as your heart needs ✦';
  coat.style.opacity='1';coat.style.pointerEvents='auto';sizeCanvases();initCoating();}

$('#btnMore').addEventListener('click',()=>{loadCard(AFFIRMATIONS[Math.floor(Math.random()*AFFIRMATIONS.length)],false);});
$('#btnReveal').addEventListener('click',()=>revealCard(false));

loadCard(dailyPick,true);
</script>
