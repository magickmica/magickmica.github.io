<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Magick Mica Transmissions</title>
<meta name="description" content="Recovered files from parallel timelines. Reality is buffering.">
<meta property="og:title" content="Magick Mica Transmissions">
<meta property="og:description" content="Recovered files from parallel timelines.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Orbitron:wght@700;900&family=Bodoni+Moda:ital,opsz,wght@1,6..96,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3ead6;--paper-2:#e6d9bd;--ink:#231a2e;
  --a1:#ff3fae;--a2:#22e0ff;--a3:#ffcf4d;
  --chrome-a:#fff;--chrome-b:#b9c6e8;--chrome-c:#7d8bb8;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;padding:0 0 40px;background:#0a0713;color:#efe7f7;
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:15px;overflow-x:hidden;
}
button:focus-visible{outline:3px solid var(--a3);outline-offset:3px}

.top{max-width:940px;margin:0 auto;padding:16px 14px 4px;text-align:center}
.top p{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#8a83a8;margin:0}

/* channel selector */
.dial{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;max-width:940px;margin:14px auto 12px;padding:0 12px}
/* the archive keeps growing; on a phone the dial becomes one swipeable strip
   rather than five stacked rows pushing the board off the screen */
@media(max-width:760px){
  .dial{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;
    scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;
    scrollbar-width:none;padding:2px 12px 8px}
  .dial::-webkit-scrollbar{display:none}
  .ch{flex:0 0 auto;scroll-snap-align:center}
}
.ch{
  font-family:"Silkscreen",monospace;font-size:10px;letter-spacing:.06em;
  background:#191228;color:#a79cc4;border:2px solid #2e2447;border-radius:4px;
  padding:9px 12px;min-height:40px;cursor:pointer;
}
.ch:hover{border-color:var(--a3);color:#fff}
.ch[aria-pressed="true"]{background:var(--a1);color:#fff;border-color:#fff}

.frame{width:100%;overflow:hidden;display:flex;justify-content:center}
.board{
  position:relative;width:900px;height:1250px;flex:none;transform-origin:top center;
  background:
    radial-gradient(circle at 22% 18%, var(--glow1), transparent 42%),
    radial-gradient(circle at 78% 72%, var(--glow2), transparent 44%),
    repeating-linear-gradient(46deg, rgba(255,255,255,.5) 0 2px, transparent 2px 5px),
    linear-gradient(168deg, var(--paper), var(--paper-2));
  box-shadow:0 24px 70px rgba(0,0,0,.6);
}
.board::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;z-index:1;
  background-image:
    radial-gradient(1.5px 1.5px at 12% 22%, rgba(255,255,255,.95) 50%, transparent 50%),
    radial-gradient(1px 1px at 63% 41%, var(--a1) 50%, transparent 50%),
    radial-gradient(1.5px 1.5px at 37% 77%, var(--a2) 50%, transparent 50%),
    radial-gradient(1px 1px at 86% 14%, var(--a3) 50%, transparent 50%);
  background-size:120px 120px,90px 90px,150px 150px,110px 110px;
}
.board::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:40;
  background:repeating-linear-gradient(180deg, rgba(0,0,0,.13) 0 1px, transparent 1px 3px);
  mix-blend-mode:multiply;
}
.el{position:absolute;z-index:5}

.tape{
  position:absolute;width:104px;height:30px;z-index:30;
  background:linear-gradient(120deg, rgba(255,255,255,.55), rgba(214,229,255,.42));
  border-left:1px dashed rgba(255,255,255,.6);border-right:1px dashed rgba(255,255,255,.6);
  box-shadow:0 2px 5px rgba(0,0,0,.18);
}
.rip{
  position:absolute;left:0;right:0;height:16px;z-index:31;
  background:repeating-linear-gradient(90deg, var(--paper) 0 9px, transparent 9px 17px);
}

.win{width:520px;border:3px solid #17121f;background:#cdc7dd;box-shadow:9px 9px 0 rgba(23,18,31,.72)}
.win .tb{display:flex;align-items:center;gap:7px;padding:6px 7px;background:var(--tb)}
.win .tb h2{flex:1;margin:0;font-family:"Silkscreen",monospace;font-size:12px;color:#fff;
  letter-spacing:.06em;text-shadow:1px 1px 0 rgba(0,0,0,.5);overflow:hidden;white-space:nowrap}
.win .tb i{width:17px;height:15px;background:#cdc7dd;border:2px solid;
  border-color:#fff #3a3350 #3a3350 #fff;display:block;flex:none}
.win .body{padding:20px 18px 22px;text-align:center}

.glitch{
  font-family:"Orbitron",sans-serif;font-weight:900;font-size:46px;letter-spacing:.02em;
  color:#17121f;margin:0;line-height:1.05;position:relative;display:inline-block;
}
.glitch::before,.glitch::after{content:attr(data-t);position:absolute;left:0;top:0;width:100%}
.glitch::before{color:var(--a1);transform:translate(-3px,1px);mix-blend-mode:multiply}
.glitch::after{color:var(--a2);transform:translate(3px,-1px);mix-blend-mode:multiply}
.shaking .glitch::before{animation:jx .18s steps(2) infinite}
.shaking .glitch::after{animation:jx .21s steps(2) infinite reverse}
@keyframes jx{0%{transform:translate(-5px,2px)}50%{transform:translate(-1px,-2px)}100%{transform:translate(-4px,1px)}}

.buffer{font-family:"Silkscreen",monospace;font-size:11px;color:#4a3f63;letter-spacing:.1em;margin:12px 0 10px}
.progress{height:15px;border:2px solid #17121f;background:#efeaf7;padding:2px;margin:0 0 12px}
.progress i{display:block;height:100%;width:0;
  background:repeating-linear-gradient(90deg,var(--a1) 0 9px,var(--tbend) 9px 18px);
  transition:width .5s ease}
.quote{font-family:"Bodoni Moda",Didot,serif;font-style:italic;font-weight:600;
  font-size:22px;line-height:1.3;color:#1d1526;margin:0;text-wrap:balance}

.dlg{width:250px;border:3px solid #17121f;background:#d6d1e4;
  box-shadow:6px 6px 0 rgba(23,18,31,.6);font-family:"Silkscreen",monospace}
.dlg .tb{padding:4px 6px;font-size:9px;color:#fff;letter-spacing:.06em;display:flex}
.dlg .tb span{flex:1}
.dlg .bd{padding:11px 10px;font-size:10px;color:#241c33;line-height:1.7}
.dlg .bd b{color:#0a7a54}
.dlg .ok{display:block;margin:9px auto 0;background:#c6c0d8;border:2px solid;
  border-color:#fff #3a3350 #3a3350 #fff;font-family:inherit;font-size:9px;
  padding:5px 16px;color:#241c33;cursor:pointer}

.receipt{width:200px;background:#fffdf6;padding:14px 13px 20px;
  font-family:"IBM Plex Mono",monospace;font-size:10px;color:#2b2436;line-height:1.85;
  box-shadow:4px 6px 14px rgba(0,0,0,.28)}
.receipt::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:9px;
  background:repeating-linear-gradient(90deg,#fffdf6 0 10px,transparent 10px 20px)}
.receipt h4{margin:0 0 7px;font-family:"Silkscreen",monospace;font-size:10px;letter-spacing:.08em;text-align:center}
.receipt .row{display:flex;justify-content:space-between;gap:8px}
.receipt .paid{margin-top:9px;text-align:center;font-family:"Silkscreen",monospace;font-size:12px;
  color:#c0182f;border:2px solid #c0182f;padding:4px;transform:rotate(-4deg)}

.sticker{
  font-family:"Silkscreen",monospace;font-size:11px;letter-spacing:.08em;
  padding:8px 13px;border-radius:999px;color:#1a1226;
  background:linear-gradient(112deg,var(--chrome-a),var(--chrome-b) 42%,#ffd9f2 62%,var(--chrome-c));
  box-shadow:0 4px 0 rgba(23,18,31,.4), inset 0 1px 0 rgba(255,255,255,.9);
  border:2px solid rgba(255,255,255,.8);
}
.sticker.hot{background:linear-gradient(112deg,#fff,#ffb3e2 40%,var(--a1) 78%,#96125e);color:#fff}
.sticker.gold{background:linear-gradient(112deg,#fffbe8,#ffe694 40%,var(--a3) 78%,#c99a15)}

.angel{font-family:"Orbitron",sans-serif;font-weight:900;font-size:42px;
  color:transparent;-webkit-text-stroke:2px rgba(23,18,31,.65);
  background:linear-gradient(120deg,var(--a1),var(--a3) 50%,var(--a2));
  -webkit-background-clip:text;background-clip:text}

.vhs{position:absolute;left:0;right:0;height:26px;z-index:35;pointer-events:none;
  background:repeating-linear-gradient(180deg,
    rgba(255,255,255,.4) 0 2px, rgba(255,63,174,.22) 2px 5px,
    rgba(0,0,0,.3) 5px 8px, rgba(34,224,255,.2) 8px 11px);
  mix-blend-mode:overlay;animation:track 7s linear infinite}
@keyframes track{0%{top:-30px}100%{top:1260px}}

.fallers{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:hidden}
.faller{position:absolute;animation:fall linear infinite}
@keyframes fall{
  0%{transform:translateY(-120px) rotate(0);opacity:0}
  10%{opacity:1}100%{transform:translateY(1380px) rotate(320deg);opacity:.9}}

.caption{max-width:640px;margin:18px auto 0;padding:0 18px;text-align:center;
  font-family:"Bodoni Moda",Didot,serif;font-style:italic;
  font-size:clamp(17px,4.4vw,22px);line-height:1.4;color:#ffe9a8;
  text-shadow:0 0 26px rgba(255,207,77,.3)}
.bar{display:flex;gap:10px;justify-content:center;margin:16px auto 0;flex-wrap:wrap;max-width:900px;padding:0 14px}
.btn{font-family:"Silkscreen",monospace;font-size:11px;letter-spacing:.08em;color:#1a1226;
  border:0;border-radius:999px;padding:13px 22px;min-height:46px;cursor:pointer;
  background:linear-gradient(96deg,var(--a3),#fff0bd 55%,var(--a3));
  box-shadow:0 0 22px rgba(255,207,77,.3)}
.btn.ghost{background:transparent;color:#cbc2e0;border:1px solid rgba(203,194,224,.35);box-shadow:none}
.hint{text-align:center;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#615a7d;margin:12px 0 0}

@media(prefers-reduced-motion:reduce){
  .vhs,.faller{animation:none}
  .shaking .glitch::before,.shaking .glitch::after{animation:none}
}
</style>
</head>
<body>

<div class="top"><p>MagickMica &middot; recovered transmissions</p></div>
<div class="dial" id="dial" role="group" aria-label="Choose a transmission"></div>

<div class="frame" id="frame">
  <div class="board" id="board"></div>
</div>

<p class="caption" id="caption"></p>
<div class="bar">
  <button class="btn" id="refresh">&#9654; Re-run transmission</button>
  <button class="btn ghost" id="copy">Copy the line</button>
</div>
<p class="hint">tap the board to glitch it</p>

  };
  V.lips = function (w, p) {

      '<path d="M80 30 C64 10 34 8 16 26 C6 36 8 48 20 58 C40 76 62 88 80 92 ' +

      '<path d="M16 34 C48 44 112 44 144 34" stroke="#17121f" stroke-width="2.5" fill="none"/>');

  V.envelope = function (w, p) {

    angels: ['1111','222','333'],

  {

      'Love level 99. Wealth quest complete.',

      'New high score, and the initials are mine.'],
    dialogs: [
      { c: ['#22065c','#ff2f9c'], t: '&#9679; CABINET', lines: ['PLAYER 1 READY','CREDITS: <b>{AMT}</b>','MODE: FREE PLAY','WIN RATE: 100%'], ok: 'START' },
      { c: ['#053a3a','#2fe0d0'], t: '&#9679; SCORE', lines: ['NEW <b>HIGH SCORE</b>','ENTER: MICA'], ok: 'SAVE' }],
    amounts: ['&#8734;', '999', 'UNLIMITED', '888'],
    receipt: { h: '&#9646; SCOREBOARD &#9646;', rows: [['WEALTH QUEST','CLEAR'],['DREAM UNLOCKER','CLEAR'],['LOVE LV 99','CLEAR'],['CONFIDENCE','BOSS DOWN']], stamp: 'FREE PLAY' },
    stickers: [['hot','EVERY GAME WINS'],['','INSERT NOTHING'],['gold','LEVEL 99'],['hot','PLAYER 1 READY']],
    angels: ['777','999','111'],
    pieces: ['joystick','coin','star','disc','butterfly','heart','sparkle','joystick','moon','coin'],
    faller: 'coin'
  },
  {
    id: 'neptune', tab: 'ALIEN ICE CREAM',
    title: 'NEPTUNE_DESSERT_PROTOCOL', boot: 'CONTACTING NEPTUNE...', done: 'ORDER DELIVERED.',
    paper: ['#e9f3f8', '#cfe3ee'], pal: ['#ff7ac2', '#5fd8e8', '#ffd84d'],
    tb: ['#0b3a52', '#5fd8e8'],
    big: ['ORDER UP', '2 SCOOPS', 'DELIVERED', 'EXTRA &#10022;'],
    scramble: 'wish',
    quotes: ['The aliens discovered happiness tastes like ice cream.',
      'Order received: one dream life, extra sprinkles.',
      'Neptune reports the galaxy milkshakes are excellent.',
      'Delivery by UFO. Do not tip. They enjoy it.',
      'Joy comes in a cone here. Nobody knows why.',
      'Earth human, your order has been upgraded.'],
    dialogs: [
      { c: ['#0b3a52','#5fd8e8'], t: '&#9679; DELIVERY', lines: ['CUSTOMER: EARTH HUMAN','ORDER: <b>{AMT}</b>','EXTRA SPRINKLES','STATUS: DELIVERED'], ok: 'ENJOY' },
      { c: ['#5c2a4a','#ff7ac2'], t: '&#9679; NEPTUNE', lines: ['HAPPINESS = <b>DESSERT</b>','HYPOTHESIS CONFIRMED'], ok: 'AGREE' }],
    amounts: ['1 DREAM LIFE', 'UNLIMITED JOY', '2 SCOOPS', 'THE USUAL'],
    receipt: { h: '&#9924; ORDER SLIP &#9924;', rows: [['DREAM LIFE','x1'],['UNLIMITED JOY','x1'],['SPRINKLES','EXTRA'],['TOTAL','FREE']], stamp: 'DELIVERED' },
    stickers: [['hot','EXTRA SPRINKLES'],['','EARTH HUMAN'],['gold','ORDER DELIVERED'],['hot','TIPPING NOT REQUIRED']],
    angels: ['888','111','222'],
    pieces: ['icecream','ufo','saturn','icecream','star','butterfly','moon','sparkle','heart','coin'],
    faller: 'star'
  }];

  /* fixed composition — pieces drop into these slots in order */
  var SLOTS = [
    { x: 34,  y: 56,   w: 150, r: -9  },
    { x: 700, y: 40,   w: 160, r: 7   },
    { x: 196, y: 152,  w: 84,  r: 16  },
    { x: 60,  y: 1000, w: 230, r: -4  },
    { x: 640, y: 1046, w: 220, r: 9   },
    { x: 396, y: 190,  w: 58,  r: -15 },
    { x: 300, y: 900,  w: 76,  r: -14 },
    { x: 660, y: 630,  w: 70,  r: -20 },
    { x: 120, y: 700,  w: 62,  r: -7  },
    { x: 742, y: 206,  w: 52,  r: 24  }
  ];

  var board = document.getElementById('board');
  var frame = document.getElementById('frame');
  var dial = document.getElementById('dial');
  var caption = document.getElementById('caption');
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cur = 0, qi = 0;

  function fit() {
    var s = Math.min(frame.clientWidth, 900) / 900;
    board.style.transform = 'scale(' + s + ')';
    frame.style.height = (1250 * s) + 'px';
  }
  window.addEventListener('resize', fit);

  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

  function scrambleText(kind) {
    var n = Math.floor(Math.random() * 900000) + 10000;
    if (kind === 'money') return '$' + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    if (kind === 'gate') return 'GATE ' + (Math.floor(Math.random() * 88) + 1);
    if (kind === 'case') return 'CASE ' + String(n).slice(0, 3) + '-' + String(n).slice(3, 6);
    if (kind === 'pct') return (Math.floor(Math.random() * 900) + 100) + '%';
    if (kind === 'freq') return (Math.random() * 99 + 88).toFixed(1) + ' FM';
    if (kind === 'score') return String(n).padStart(6, '0');
    return '#' + String(n).slice(0, 3);
  }

  /* ---------------------------------------------- render a board */
  function render(i) {
    cur = i; qi = 0;
    var t = T[i];
    board.style.setProperty('--paper', t.paper[0]);
    board.style.setProperty('--paper-2', t.paper[1]);
    board.style.setProperty('--a1', t.pal[0]);
    board.style.setProperty('--a2', t.pal[1]);
    board.style.setProperty('--a3', t.pal[2]);
    board.style.setProperty('--glow1', hexA(t.pal[0], .17));
    board.style.setProperty('--glow2', hexA(t.pal[1], .15));
    board.style.setProperty('--tb', 'linear-gradient(90deg,' + t.tb[0] + ',' + t.tb[1] + ')');
    board.style.setProperty('--tbend', t.tb[1]);

    var h = '<div class="vhs"></div><div class="fallers" id="fallers"></div>';

    // scattered pieces
    t.pieces.forEach(function (name, n) {
      var s = SLOTS[n % SLOTS.length];
      var fn = V[name] || V.star;
      h += '<div class="el" style="left:' + s.x + 'px;top:' + s.y + 'px;transform:rotate(' + s.r + 'deg)">' +
           fn(s.w, t.pal) + '</div>';
    });

    // angel numbers
    var ap = [[62, 150, -12], [762, 470, 9], [52, 1178, -6]];
    t.angels.forEach(function (a, n) {
      h += '<div class="el angel" style="left:' + ap[n][0] + 'px;top:' + ap[n][1] + 'px;transform:rotate(' + ap[n][2] + 'deg)">' + a + '</div>';
    });

    // main window
    h += '<div class="el win" style="left:190px;top:330px;transform:rotate(-2deg)">' +
      '<div class="tb"><h2>' + t.title + '</h2><i></i><i></i><i></i></div>' +
      '<div class="body">' +
      '<p class="glitch" id="glitch" data-t="' + t.big[0] + '">' + t.big[0] + '</p>' +
      '<p class="buffer" id="buffer">' + t.boot + '</p>' +
      '<div class="progress"><i id="prog"></i></div>' +
      '<p class="quote" id="quote">' + t.quotes[0] + '</p></div></div>';

    // stickers
    var sp = [[112, 258, -8], [604, 252, 7], [120, 872, 4], [560, 986, -6]];
    t.stickers.forEach(function (s, n) {
      h += '<div class="el sticker ' + s[0] + '" style="left:' + sp[n][0] + 'px;top:' + sp[n][1] +
           'px;transform:rotate(' + sp[n][2] + 'deg)">' + s[1] + '</div>';
    });

    // dialogs
    var dp = [[40, 612, -5], [612, 640, 6]];
    t.dialogs.forEach(function (d, n) {
      h += '<div class="el dlg" style="left:' + dp[n][0] + 'px;top:' + dp[n][1] + 'px;transform:rotate(' + dp[n][2] + 'deg)">' +
        '<div class="tb" style="background:linear-gradient(90deg,' + d.c[0] + ',' + d.c[1] + ')"><span>' + d.t + '</span>&#10005;</div>' +
        '<div class="bd">' + d.lines.join('<br>').replace('{AMT}', '<span data-amt>' + t.amounts[0] + '</span>') +
        '<button class="ok" type="button">' + d.ok + '</button></div></div>';
    });

    // receipt
    h += '<div class="el receipt" style="left:344px;top:624px;transform:rotate(-7deg)">' +
      '<h4>' + t.receipt.h + '</h4>' +
      t.receipt.rows.map(function (r) { return '<div class="row"><span>' + r[0] + '</span><span>' + r[1] + '</span></div>'; }).join('') +
      '<div class="paid">' + t.receipt.stamp + '</div></div>';

    // paper furniture
    h += '<div class="tape" style="left:-24px;top:44px;transform:rotate(-38deg)"></div>' +
      '<div class="tape" style="right:-26px;top:600px;transform:rotate(34deg)"></div>' +
      '<div class="tape" style="left:330px;top:-14px;transform:rotate(4deg)"></div>' +
      '<div class="rip" style="top:0"></div>' +
      '<div class="rip" style="bottom:0;transform:rotate(180deg)"></div>';

    board.innerHTML = h;
    separate();
    clamp();
    caption.textContent = t.quotes[0];
    fall();
    setTimeout(function () { document.getElementById('prog').style.width = '100%'; }, 350);

    [].forEach.call(dial.children, function (b, n) {
      b.setAttribute('aria-pressed', String(n === i));
      if (n === i && b.scrollIntoView) {
        try { b.scrollIntoView({ inline: 'center', block: 'nearest',
          behavior: reduced ? 'auto' : 'smooth' }); } catch (e) {}
      }
    });
  }

  /* Slots were sized for wide props; a tall one in the same slot hangs off
     the board. Measure after layout and nudge anything overhanging back in,
     so new pieces can be added without retuning coordinates. */
  function clamp() {
    var br = board.getBoundingClientRect();
    var pad = 8;
    [].forEach.call(board.querySelectorAll('.el'), function (el) {
      var r = el.getBoundingClientRect();
      var dx = 0, dy = 0;
      if (r.left < br.left + pad) dx = (br.left + pad) - r.left;
      if (r.right > br.right - pad) dx = (br.right - pad) - r.right;
      if (r.top < br.top + pad) dy = (br.top + pad) - r.top;
      if (r.bottom > br.bottom - pad) dy = (br.bottom - pad) - r.bottom;
      if (!dx && !dy) return;
      var s = (board.getBoundingClientRect().width / 900) || 1;
      el.style.left = (parseFloat(el.style.left || 0) + dx / s) + 'px';
      el.style.top = (parseFloat(el.style.top || 0) + dy / s) + 'px';
    });
  }

  /* Props may overlap freely — that is the collage. Panels carrying text
     must not. The window holds its place; everything else is pushed out
     along whichever axis needs the smallest move. */
  function separate() {
    var br = board.getBoundingClientRect();
    var s = (br.width / 900) || 1;
    var win = board.querySelector('.win');
    var others = [].slice.call(board.querySelectorAll('.dlg, .receipt'));
    if (!win) return;

    function rect(el) {
      var r = el.getBoundingClientRect();
      return { l: (r.left - br.left) / s, t: (r.top - br.top) / s,
               r: (r.right - br.left) / s, b: (r.bottom - br.top) / s };
    }
    function shove(el, a, b) {
      var ox = Math.min(a.r, b.r) - Math.max(a.l, b.l);
      var oy = Math.min(a.b, b.b) - Math.max(a.t, b.t);
      if (ox <= 0 || oy <= 0) return false;
      var pad = 14;
      if (ox < oy) {
        var dx = (a.l + a.r) / 2 < (b.l + b.r) / 2 ? -(ox + pad) : (ox + pad);
        el.style.left = (parseFloat(el.style.left || 0) + dx) + 'px';
      } else {
        var dy = (a.t + a.b) / 2 < (b.t + b.b) / 2 ? -(oy + pad) : (oy + pad);
        el.style.top = (parseFloat(el.style.top || 0) + dy) + 'px';
      }
      return true;
    }

    for (var pass = 0; pass < 6; pass++) {
      var moved = false;
      var wr = rect(win);
      others.forEach(function (el) { if (shove(el, rect(el), wr)) moved = true; });
      for (var i = 0; i < others.length; i++) {
        for (var j = i + 1; j < others.length; j++) {
          if (shove(others[j], rect(others[j]), rect(others[i]))) moved = true;
        }
      }
      if (!moved) break;
    }
  }

  function hexA(hex, a) {
    var r = parseInt(hex.substr(1, 2), 16), g = parseInt(hex.substr(3, 2), 16), b = parseInt(hex.substr(5, 2), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }

  function fall() {
    var host = document.getElementById('fallers');
    if (!host || reduced) return;
    var t = T[cur];
    for (var i = 0; i < 14; i++) {
      var d = document.createElement('div');
      d.className = 'faller';
      d.style.left = (Math.random() * 850) + 'px';
      d.style.animationDelay = (Math.random() * 9) + 's';
      d.style.animationDuration = (8 + Math.random() * 7) + 's';
      d.innerHTML = (V[t.faller] || V.star)(20 + Math.random() * 26, t.pal);
      host.appendChild(d);
    }
  }

  /* ---------------------------------------------- re-run */
  function run() {
    var t = T[cur];
    qi = (qi + 1) % t.quotes.length;
    board.classList.add('shaking');
    var g = document.getElementById('glitch');
    var buf = document.getElementById('buffer');
    var prog = document.getElementById('prog');
    buf.textContent = t.boot;
    prog.style.width = '0%';

    var target = pick(t.big), n = 0;
    var iv = setInterval(function () {
      g.textContent = g.dataset.t = scrambleText(t.scramble);
      if (++n > 9) { clearInterval(iv); g.innerHTML = g.dataset.t = target; }
    }, 70);

    setTimeout(function () { prog.style.width = '100%'; }, 60);
    setTimeout(function () {
      board.classList.remove('shaking');
      buf.textContent = t.done;
      document.getElementById('quote').textContent = t.quotes[qi];
      caption.textContent = t.quotes[qi];
      [].forEach.call(board.querySelectorAll('[data-amt]'), function (el) {
        el.textContent = pick(t.amounts);
      });
    }, reduced ? 60 : 900);
  }

  /* ---------------------------------------------- wiring */
  T.forEach(function (t, i) {
    var b = document.createElement('button');
    b.className = 'ch';
    b.type = 'button';
    b.textContent = t.tab;
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', function () { render(i); });
    dial.appendChild(b);
  });

  document.getElementById('refresh').addEventListener('click', run);
  board.addEventListener('click', function (e) {
    if (e.target.closest('button')) return;
    run();
  });
  document.getElementById('copy').addEventListener('click', function () {
    var btn = this;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(caption.textContent).then(
        function () { btn.textContent = 'Copied'; },
        function () { btn.textContent = 'Blocked'; });
    } else { btn.textContent = 'Blocked'; }
  });

  var deep = /^#([a-z0-9]+)$/.exec(location.hash);
  var start = 0;
  if (deep) { T.forEach(function (t, i) { if (t.id === deep[1]) start = i; }); }
  render(start);
  fit();
})();
</script>
