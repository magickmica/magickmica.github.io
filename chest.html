<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Chest</title>

<!--
  Save this file anywhere and double-click it.
  Needs an internet connection the first time (three.js and the fonts come
  from a CDN). Everything else — the wood grain, the gold, every sound — is
  generated right here. No images, no audio files, no build step.

  Click the chest to open it. Drag anywhere to walk around it.
-->

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;800&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet" />

<style>
	:root {
		--deep:   #07161a;   /* the dark at the top of the cave */
		--stone:  #123331;
		--floor:  #3d6b52;   /* damp green stone, catching the light */
		--gold:   #ffc65c;   /* the treasure, the lamps, every ON state */
		--ember:  #ff7a45;   /* deeper gold, for the hot centre of the glow */
		--ivory:  #f4ece0;
		--slab:   #0f201f;
	}

	* { box-sizing: border-box; }

	html, body { margin: 0; height: 100%; overflow: hidden; background: var(--deep); }

	body {
		font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
		color: var(--ivory);
		/* The light source is IN the scene, so the page's own background has
		   to agree with it: warm at the floor where the chest sits, cold and
		   black up top where nothing reaches. */
		background:
			radial-gradient(80% 46% at 50% 84%, color-mix(in srgb, var(--gold) 34%, transparent) 0%, transparent 60%),
			radial-gradient(130% 70% at 50% 112%, var(--floor) 0%, transparent 66%),
			linear-gradient(180deg, var(--deep) 0%, var(--stone) 72%, #1d4a40 100%);
	}

	#stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
	#stage.dragging { cursor: grabbing; }
	#stage.over { cursor: pointer; }
	#stage canvas { display: block; }

	.overlay {
		position: fixed;
		inset: 0;
		display: flex;
		flex-direction: column;
		justify-content: space-between;
		padding: clamp(1.1rem, 3.5vw, 2.4rem);
		pointer-events: none;
	}

	.masthead { max-width: 30ch; }

	.title {
		font-family: 'Big Shoulders Display', ui-sans-serif, sans-serif;
		font-weight: 800;
		font-size: clamp(3.6rem, 14vw, 8.5rem);
		line-height: 0.82;
		letter-spacing: -0.02em;
		text-transform: uppercase;
		margin: 0;
	}

	.standfirst {
		margin: 0.85rem 0 0;
		font-size: 0.9rem;
		line-height: 1.5;
		max-width: 26ch;
		color: color-mix(in srgb, var(--ivory) 66%, transparent);
	}

	/* ── console ── */
	.console {
		pointer-events: auto;
		align-self: center;
		display: flex;
		flex-wrap: wrap;
		justify-content: center;
		gap: clamp(0.5rem, 2vw, 1.1rem);
		padding: clamp(0.7rem, 2vw, 1rem) clamp(0.9rem, 2.5vw, 1.4rem);
		border-radius: 14px;
		background: color-mix(in srgb, var(--slab) 82%, transparent);
		border: 1px solid color-mix(in srgb, var(--ivory) 14%, transparent);
		box-shadow: 0 18px 50px -18px #000, inset 0 1px 0 color-mix(in srgb, var(--ivory) 12%, transparent);
		backdrop-filter: blur(9px);
	}

	.switch {
		appearance: none;
		border: 0;
		background: none;
		padding: 0.35rem 0.15rem;
		display: grid;
		justify-items: center;
		gap: 0.5rem;
		cursor: pointer;
		font: inherit;
		color: inherit;
		border-radius: 9px;
	}
	.switch:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

	.throw {
		width: 56px;
		height: 27px;
		border-radius: 999px;
		background: #071110;
		border: 1px solid color-mix(in srgb, var(--ivory) 16%, transparent);
		box-shadow: inset 0 2px 6px #000;
		position: relative;
	}
	.knob {
		position: absolute;
		top: 3px;
		left: 3px;
		width: 19px;
		height: 19px;
		border-radius: 50%;
		background: linear-gradient(180deg, #fffaf2, #c9bda9);
		box-shadow: 0 2px 4px #000a;
		transition: transform 0.34s cubic-bezier(0.34, 1.7, 0.5, 1);
	}
	.switch[aria-pressed="true"] .knob { transform: translateX(29px); }
	.switch[aria-pressed="true"] .throw {
		background: color-mix(in srgb, var(--gold) 26%, #071110);
		box-shadow: inset 0 2px 6px #0008, 0 0 16px -2px var(--gold);
	}

	.label {
		font-family: 'Big Shoulders Display', ui-sans-serif, sans-serif;
		font-weight: 500;
		font-size: 0.95rem;
		letter-spacing: 0.16em;
		text-transform: uppercase;
		color: color-mix(in srgb, var(--ivory) 60%, transparent);
	}
	.switch[aria-pressed="true"] .label { color: var(--ivory); }

	.press .throw {
		display: grid;
		place-items: center;
		background: linear-gradient(180deg, #1c4038, #0e2420);
		border-color: color-mix(in srgb, var(--ember) 34%, transparent);
		transition: transform 0.1s ease;
	}
	.press:active .throw { transform: translateY(2px); }
	.press .dot {
		width: 9px; height: 9px; border-radius: 50%;
		background: var(--ember);
		box-shadow: 0 0 12px var(--ember);
		opacity: 0.55;
	}
	.press:active .dot, .press.lit .dot { opacity: 1; }

	/* ── the dock ── */
	.dock {
		position: fixed;
		top: clamp(0.9rem, 3vw, 1.6rem);
		right: clamp(0.9rem, 3vw, 1.6rem);
		display: flex;
		gap: 0.5rem;
		z-index: 5;
	}

	.chip {
		display: inline-flex;
		align-items: center;
		gap: 0.45rem;
		padding: 0.5rem 0.8rem;
		border-radius: 999px;
		text-decoration: none;
		font-family: 'Big Shoulders Display', ui-sans-serif, sans-serif;
		font-weight: 500;
		font-size: 0.9rem;
		letter-spacing: 0.14em;
		text-transform: uppercase;
		color: color-mix(in srgb, var(--ivory) 68%, transparent);
		background: color-mix(in srgb, var(--slab) 80%, transparent);
		border: 1px solid color-mix(in srgb, var(--ivory) 16%, transparent);
		backdrop-filter: blur(8px);
		transition: color 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, transform 0.1s ease;
	}
	.chip svg { width: 18px; height: 18px; flex: none; }
	.chip:active { transform: translateY(1px); }
	.chip:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }

	.chip.tip:hover, .chip.tip:focus-visible {
		color: var(--gold);
		border-color: var(--gold);
		box-shadow: 0 0 20px -6px var(--gold);
	}
	.chip.arcade:hover, .chip.arcade:focus-visible {
		color: var(--ember);
		border-color: var(--ember);
		box-shadow: 0 0 20px -6px var(--ember);
	}

	.fallback {
		position: fixed; inset: 0; display: none; place-items: center;
		text-align: center; padding: 2rem; line-height: 1.6;
	}

	@media (max-width: 620px) {
		.chip span { display: none; }
		.chip { padding: 0.6rem; }
	}

	@media (max-width: 460px) {
		.console { gap: 0.35rem; padding: 0.6rem 0.7rem; }
		.throw { width: 46px; }
		.switch[aria-pressed="true"] .knob { transform: translateX(19px); }
		.label { font-size: 0.8rem; letter-spacing: 0.1em; }
		.standfirst { display: none; }
	}

	@media (prefers-reduced-motion: reduce) {
		.knob { transition: none; }
	}
</style>
</head>
<body>

<div id="stage"></div>

<nav class="dock" aria-label="Elsewhere">
	<a class="chip tip" href="https://ko-fi.com/magickmica/tip" target="_blank" rel="noopener noreferrer" title="Leave a tip on Ko-fi">
		<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true">
			<path d="M12 2.8l2.85 5.9 6.4.95-4.63 4.55 1.1 6.4L12 17.55 6.28 20.6l1.1-6.4L2.75 9.65l6.4-.95z" />
		</svg>
		<span>Tip</span>
	</a>
	<a class="chip arcade" href="https://magickmica.github.io/arcade.html" target="_blank" rel="noopener noreferrer" title="Go to the Arcade">
		<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
			<rect x="2.4" y="7.4" width="19.2" height="9.2" rx="4.6" />
			<path d="M7 10.6v2.8M5.6 12h2.8" />
			<circle cx="16.1" cy="11.2" r="0.95" fill="currentColor" stroke="none" />
			<circle cx="18.3" cy="13.4" r="0.95" fill="currentColor" stroke="none" />
		</svg>
		<span>Arcade</span>
	</a>
</nav>

<div class="overlay">
	<header class="masthead">
		<h1 class="title">The<br />Chest</h1>
		<p class="standfirst">Nobody remembers leaving it here. Click it — the hinge still works.</p>
	</header>

	<div class="console" role="group" aria-label="Chest controls">
		<button class="switch" id="sw-lid" aria-pressed="false">
			<span class="throw"><span class="knob"></span></span>
			<span class="label">Lid</span>
		</button>
		<button class="switch" id="sw-glow" aria-pressed="true">
			<span class="throw"><span class="knob"></span></span>
			<span class="label">Glow</span>
		</button>
		<button class="switch" id="sw-sound" aria-pressed="false">
			<span class="throw"><span class="knob"></span></span>
			<span class="label">Hum</span>
		</button>
		<button class="switch press" id="btn-shake">
			<span class="throw"><span class="dot"></span></span>
			<span class="label">Shake it</span>
		</button>
	</div>
</div>

<div class="fallback" id="fallback">
	<p>This browser can't run WebGL, so there's nowhere to put the chest.<br />
	Try opening the file in Chrome, Firefox, or Safari.</p>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.184.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

const TWO_PI = Math.PI * 2;
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ══ WOOD ═════════════════════════════════════════════════════════════════
   Painted in code, no image file. Wood grain is rings of density, so:
   take a plain sine wave for the rings, then WARP its input with fractal
   noise. That warp is the whole trick — an unwarped sine is corduroy, and
   the same sine fed a wobbling coordinate is oak.
*/
const woodTexture = () => {
	const S = 512;
	const c = document.createElement('canvas');
	c.width = c.height = S;
	const ctx = c.getContext('2d');
	const img = ctx.createImageData(S, S);
	const d = img.data;

	// hash-based value noise — deterministic, so the grain is the same
	// every load rather than reshuffling on refresh
	const hash = (x, y) => {
		const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
		return n - Math.floor(n);
	};
	const smooth = (x, y) => {
		const xi = Math.floor(x), yi = Math.floor(y);
		const xf = x - xi, yf = y - yi;
		const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
		return (hash(xi, yi) * (1 - u) + hash(xi + 1, yi) * u) * (1 - v)
		     + (hash(xi, yi + 1) * (1 - u) + hash(xi + 1, yi + 1) * u) * v;
	};
	const fbm = (x, y) => {
		let s = 0, a = 0.5, f = 1;
		for (let i = 0; i < 4; i++) { s += a * smooth(x * f, y * f); a *= 0.5; f *= 2; }
		return s;
	};

	const DARK = [0.19, 0.10, 0.05];
	const LIGHT = [0.55, 0.33, 0.15];

	for (let j = 0; j < S; j++) {
		for (let i = 0; i < S; i++) {
			const x = (i / S) * 9, y = (j / S) * 9;
			const warp = fbm(x * 0.55, y * 0.55) * 2.4;          // the wobble
			const rings = Math.sin((y * 3.2 + warp * 1.7) * Math.PI * 2);
			let v = Math.pow(0.5 + 0.5 * rings, 1.7);
			v = v * 0.6 + fbm(x * 5, y * 5) * 0.4;                // fibre speckle
			const o = (j * S + i) * 4;
			for (let k = 0; k < 3; k++) {
				const lin = DARK[k] + (LIGHT[k] - DARK[k]) * v;
				d[o + k] = Math.round(Math.pow(lin, 1 / 2.2) * 255);   // to sRGB
			}
			d[o + 3] = 255;
		}
	}
	ctx.putImageData(img, 0, 0);
	const tex = new THREE.CanvasTexture(c);
	tex.colorSpace = THREE.SRGBColorSpace;
	tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
	return tex;
};

/* ══ THE CHEST ════════════════════════════════════════════════════════════
   Both halves are EXTRUDED 2D SHAPES. You draw the profile you'd draw on
   paper — a rounded rectangle for the box, a half-ellipse for the lid — and
   extrude it through the depth of the chest. Bevelled edges come free, and
   the bands are the same shapes again with a hole punched in them, which is
   what makes them wrap the whole perimeter instead of sitting on one face.
*/

const W = 2.2, H = 1.0, D = 1.4;      // chest width, box height, depth
const LID_R = 0.6;                     // how tall the barrel lid arcs

const roundedRect = (w, h, r) => {
	const s = new THREE.Shape();
	const x = -w / 2, y = -h / 2;
	s.moveTo(x + r, y);
	s.lineTo(x + w - r, y);
	s.quadraticCurveTo(x + w, y, x + w, y + r);
	s.lineTo(x + w, y + h - r);
	s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
	s.lineTo(x + r, y + h);
	s.quadraticCurveTo(x, y + h, x, y + h - r);
	s.lineTo(x, y + r);
	s.quadraticCurveTo(x, y, x + r, y);
	return s;
};

const archShape = (w, h) => {
	const s = new THREE.Shape();
	s.moveTo(-w / 2, 0);
	s.absellipse(0, 0, w / 2, h, Math.PI, 0, true);
	s.lineTo(-w / 2, 0);
	return s;
};

const extrude = (shape, depth, bevel = 0.035) => {
	const g = new THREE.ExtrudeGeometry(shape, {
		depth, bevelEnabled: bevel > 0, bevelSize: bevel, bevelThickness: bevel,
		bevelSegments: 3, curveSegments: 28,
	});
	g.translate(0, 0, -depth / 2);    // extrusion grows along +Z; recentre it
	return g;
};

function buildChest() {
	const wood = new THREE.MeshStandardMaterial({
		map: woodTexture(), roughness: 0.72, metalness: 0.05, color: 0xffffff,
	});
	const brass = new THREE.MeshStandardMaterial({
		color: 0xd9a441, metalness: 1, roughness: 0.28,
	});
	const iron = new THREE.MeshStandardMaterial({
		color: 0x39312b, metalness: 0.85, roughness: 0.45,
	});

	const chest = new THREE.Group();

	// ── box ──
	const box = new THREE.Mesh(extrude(roundedRect(W, H, 0.08), D), wood);
	chest.add(box);

	// Bands: the same outline again, slightly larger, with a slightly
	// smaller copy punched out as a hole. Extruding a ring gives a strap
	// that runs right around the chest.
	const bandRing = (w, h, thick) => {
		const outer = roundedRect(w, h, 0.08);
		outer.holes.push(roundedRect(w - thick * 2, h - thick * 2, 0.06));
		return outer;
	};
	for (const z of [-0.44, 0.44]) {
		const band = new THREE.Mesh(extrude(bandRing(W + 0.035, H + 0.035, 0.075), 0.13, 0.012), brass);
		band.position.z = z;
		chest.add(band);
	}

	// ── lid, on a hinge at the BACK edge ──
	// The pivot group sits on the hinge line and the lid is offset forward
	// inside it, so rotating the group swings the lid instead of spinning
	// it around its own middle.
	const hinge = new THREE.Group();
	hinge.position.set(0, H / 2, -D / 2);
	chest.add(hinge);

	const lid = new THREE.Mesh(extrude(archShape(W, LID_R), D), wood);
	lid.position.z = D / 2;
	hinge.add(lid);

	const lidBandRing = (w, h, thick) => {
		const outer = archShape(w, h);
		outer.holes.push(archShape(w - thick * 2, h - thick));
		return outer;
	};
	for (const z of [-0.44, 0.44]) {
		const band = new THREE.Mesh(extrude(lidBandRing(W + 0.035, LID_R + 0.02, 0.075), 0.13, 0.012), brass);
		band.position.z = D / 2 + z;
		hinge.add(band);
	}

	// hinge barrels, so the lid is visibly attached to something
	for (const x of [-0.62, 0.62]) {
		const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.26, 20), iron);
		barrel.rotation.z = Math.PI / 2;
		barrel.position.set(x, 0, 0.02);
		hinge.add(barrel);
	}

	// ── lock plate, straddling the seam ──
	const lock = new THREE.Group();
	const plate = new THREE.Mesh(extrude(roundedRect(0.38, 0.42, 0.06), 0.06, 0.02), brass);
	lock.add(plate);
	const keyhole = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.09, 20), iron);
	keyhole.rotation.x = Math.PI / 2;
	keyhole.position.set(0, 0.02, 0.03);
	lock.add(keyhole);
	const slot = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.11, 0.09), iron);
	slot.position.set(0, -0.06, 0.03);
	lock.add(slot);
	lock.position.set(0, H / 2 - 0.14, D / 2 + 0.02);
	chest.add(lock);

	// ── what's inside ──
	// A lumpy gold pile: a sphere with its vertices pushed around by noise.
	// A smooth dome reads as a bowl of custard; the lumps read as coins.
	const pileGeo = new THREE.SphereGeometry(0.72, 64, 40);
	const PP = pileGeo.attributes.position;
	for (let i = 0; i < PP.count; i++) {
		const x = PP.getX(i), y = PP.getY(i), z = PP.getZ(i);
		const n = Math.sin(x * 9) * Math.sin(z * 11) * Math.sin(y * 7);
		const k = 1 + n * 0.07;
		PP.setXYZ(i, x * k * 1.35, Math.max(y, -0.05) * k * 0.55, z * k * 0.82);
	}
	pileGeo.computeVertexNormals();
	const goldMat = new THREE.MeshStandardMaterial({
		color: 0xffc65c, metalness: 1, roughness: 0.24,
		emissive: 0xff9b2e, emissiveIntensity: 0.22,
	});
	const pile = new THREE.Mesh(pileGeo, goldMat);
	pile.position.y = 0.06;
	chest.add(pile);

	// loose coins, a few in the pile and a few spilled on the floor
	const coinGeo = new THREE.CylinderGeometry(0.085, 0.085, 0.016, 24);
	const coins = [];
	for (let i = 0; i < 26; i++) {
		const coin = new THREE.Mesh(coinGeo, goldMat);
		const inside = i < 16;
		const a = Math.random() * TWO_PI;
		const r = inside ? Math.random() * 0.85 : 1.35 + Math.random() * 0.9;
		coin.position.set(Math.cos(a) * r, inside ? 0.34 + Math.random() * 0.12 : -H / 2 + 0.01, Math.sin(a) * r * (inside ? 0.5 : 0.7));
		coin.rotation.set(Math.random() * 0.5 - 0.25, Math.random() * TWO_PI, Math.random() * 0.5 - 0.25);
		chest.add(coin);
		coins.push(coin);
	}

	return { chest, hinge, pile, goldMat, coins };
}

/* ── the light shaft ──
   Additive blending on a DoubleSide cone: you see the far wall through the
   near one, so the silhouette edges add twice and glow on their own. No
   faked rim term. depthWrite off, or it carves a hole in everything behind.
*/
const shaftMaterial = new THREE.ShaderMaterial({
	uniforms: {
		uTime: { value: 0 },
		uStrength: { value: 0 },
		uColor: { value: new THREE.Color(0xffc65c) },
	},
	vertexShader: `
		varying vec2 vUv;
		void main() {
			vUv = uv;
			gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
		}
	`,
	fragmentShader: `
		uniform float uTime;
		uniform float uStrength;
		uniform vec3 uColor;
		varying vec2 vUv;
		void main() {
			// uv.y is 0 at the chest and 1 up in the dark, so the shaft is
			// brightest where it leaves the lid and thins out as it climbs
			float fall = pow(1.0 - vUv.y, 1.6);
			float scan = 0.8 + 0.2 * sin(vUv.y * 26.0 + uTime * 1.8);
			gl_FragColor = vec4(uColor * (0.6 + fall * 0.9), fall * scan * 0.40 * uStrength);
		}
	`,
	transparent: true,
	blending: THREE.AdditiveBlending,
	depthWrite: false,
	side: THREE.DoubleSide,
});

function buildShaft() {
	const h = 3.4;
	const cone = new THREE.Mesh(
		new THREE.CylinderGeometry(1.55, 0.5, h, 64, 1, true),
		shaftMaterial,
	);
	cone.position.y = 0.3 + h / 2;
	cone.renderOrder = 2;
	return cone;
}

// Sparks lifting out of the chest. They spiral, because straight-up motes
// look like a printer feeding paper.
function buildSparks(count = 200) {
	const pos = new Float32Array(count * 3);
	const u = new Float32Array(count), ang = new Float32Array(count);
	const rad = new Float32Array(count), spd = new Float32Array(count);
	for (let i = 0; i < count; i++) {
		u[i] = Math.random();
		ang[i] = Math.random() * TWO_PI;
		rad[i] = Math.sqrt(Math.random());
		spd[i] = 0.06 + Math.random() * 0.11;
	}
	const geo = new THREE.BufferGeometry();
	geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

	const c = document.createElement('canvas');
	c.width = c.height = 64;
	const cx = c.getContext('2d');
	const gr = cx.createRadialGradient(32, 32, 0, 32, 32, 32);
	gr.addColorStop(0, 'rgba(255,255,255,1)');
	gr.addColorStop(1, 'rgba(255,255,255,0)');
	cx.fillStyle = gr;
	cx.fillRect(0, 0, 64, 64);

	const points = new THREE.Points(geo, new THREE.PointsMaterial({
		size: 0.07, map: new THREE.CanvasTexture(c), color: 0xffd98a, transparent: true,
		blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
	}));
	points.renderOrder = 3;
	points.userData.step = (dt) => {
		for (let i = 0; i < count; i++) {
			u[i] += spd[i] * dt;
			if (u[i] > 1) u[i] -= 1;
			const r = (0.45 + u[i] * 1.1) * rad[i];
			const a = ang[i] + u[i] * 2.4;               // the spiral
			pos[i * 3] = Math.cos(a) * r;
			pos[i * 3 + 1] = 0.3 + u[i] * 3.2;
			pos[i * 3 + 2] = Math.sin(a) * r * 0.75;
		}
		geo.attributes.position.needsUpdate = true;
	};
	points.userData.step(0);
	return points;
}

// Contact shadow and a pool of warm bounce, both painted on flat discs. The
// shadow is what actually plants the chest on the floor — without it the
// whole thing hovers.
function buildFloor() {
	const disc = (draw, size, additive) => {
		const c = document.createElement('canvas');
		c.width = c.height = 512;
		draw(c.getContext('2d'));
		const tex = new THREE.CanvasTexture(c);
		tex.colorSpace = THREE.SRGBColorSpace;
		const m = new THREE.Mesh(
			new THREE.PlaneGeometry(size, size),
			new THREE.MeshBasicMaterial({
				map: tex, transparent: true, depthWrite: false,
				blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending,
				toneMapped: !additive,
			}),
		);
		m.rotation.x = -Math.PI / 2;
		return m;
	};

	const shadow = disc((g) => {
		const gr = g.createRadialGradient(256, 256, 20, 256, 256, 250);
		gr.addColorStop(0, 'rgba(0,0,0,0.72)');
		gr.addColorStop(0.55, 'rgba(0,0,0,0.28)');
		gr.addColorStop(1, 'rgba(0,0,0,0)');
		g.fillStyle = gr;
		g.fillRect(0, 0, 512, 512);
	}, 6.4, false);
	shadow.position.y = -H / 2 + 0.004;
	shadow.scale.set(1, 0.72, 1);

	const pool = disc((g) => {
		const gr = g.createRadialGradient(256, 256, 10, 256, 256, 250);
		gr.addColorStop(0, 'rgba(255,190,100,0.55)');
		gr.addColorStop(1, 'rgba(255,140,60,0)');
		g.fillStyle = gr;
		g.fillRect(0, 0, 512, 512);
	}, 9, true);
	pool.position.y = -H / 2 + 0.008;
	pool.renderOrder = 1;

	return { shadow, pool };
}

const buildLightRoom = () => {
	const room = new THREE.Scene();
	room.background = new THREE.Color(0x18211f);
	const c = document.createElement('canvas');
	c.width = c.height = 256;
	const ctx = c.getContext('2d');
	const grad = ctx.createRadialGradient(128, 128, 24, 128, 128, 128);
	grad.addColorStop(0, '#ffffff');
	grad.addColorStop(1, '#000000');
	ctx.fillStyle = grad;
	ctx.fillRect(0, 0, 256, 256);
	const tex = new THREE.CanvasTexture(c);
	const panel = (w, h, x, y, z, intensity, tint) => {
		const m = new THREE.Mesh(
			new THREE.PlaneGeometry(w, h),
			new THREE.MeshBasicMaterial({
				map: tex, color: new THREE.Color(tint).multiplyScalar(intensity), side: THREE.DoubleSide,
			}),
		);
		m.position.set(x, y, z);
		m.lookAt(0, 0, 0);
		room.add(m);
	};
	panel(9, 6, -6, 5, 5, 1.9, 0xcfe4ff);   // cool key, high and left
	panel(7, 5, 6, 2, 3, 0.7, 0xffd9a8);    // warm fill, right
	panel(9, 3, 0, 5, -6, 1.1, 0x8fd8c0);   // green cave bounce, behind
	panel(9, 9, 0, -6, 0, 1.4, 0xffa14a);   // the treasure itself, from below
	return room;
};

/* ══ SOUND ════════════════════════════════════════════════════════════════
   All synthesized — nothing is loaded. Two things do most of the work here:

   1. REVERB. A real convolution reverb, from an impulse response generated
      as decaying noise. Dry synthesis sounds like a circuit; the same notes
      in a long tail sound like a place. This is the single biggest step
      from "machine" to "magic", and no oscillator choice substitutes for it.

   2. ONE SCALE. Every pitch in the file — pad, twinkles, the unseal run,
      even the coins — is drawn from D major pentatonic. Random notes from
      one scale can't clash, so the whole thing stays musical no matter what
      order you trigger it in. Pentatonic has no semitones at all, which is
      why it reads as bright and weightless rather than tense.

   No sawtooths, no lowpass drone. Those belong to the saucer.
*/
const Sfx = (() => {
	let ctx = null, master = null, bus = null, noiseBuf = null;
	let on = false, twinkleTimer = null;

	// D major pentatonic — D E F# A B — across three octaves
	const SCALE = [587.33, 659.25, 739.99, 880.00, 987.77,
	               1174.66, 1318.51, 1479.98, 1760.00, 1975.53, 2349.32];
	// the pad sits underneath as an open D chord, wide and rootless up top
	const PAD = [146.83, 220.00, 293.66, 369.99, 440.00];

	// An impulse response is just "what a room does to a click": a burst of
	// noise decaying over a few seconds. Feed that to a ConvolverNode and
	// everything routed through it inherits the room.
	const impulse = (seconds, decay) => {
		const len = Math.floor(ctx.sampleRate * seconds);
		const buf = ctx.createBuffer(2, len, ctx.sampleRate);
		for (let ch = 0; ch < 2; ch++) {
			const d = buf.getChannelData(ch);
			for (let i = 0; i < len; i++) {
				const t = i / len;
				d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay);
			}
		}
		return buf;
	};

	const init = () => {
		if (ctx) return;
		ctx = new (window.AudioContext || window.webkitAudioContext)();
		master = ctx.createGain();
		master.gain.value = 0;
		master.connect(ctx.destination);

		// everything plays into the bus; the bus goes out dry AND through
		// the room, so each sound arrives with its own echo behind it
		bus = ctx.createGain();
		bus.connect(master);
		const conv = ctx.createConvolver();
		conv.buffer = impulse(3.6, 2.4);
		const wet = ctx.createGain();
		wet.gain.value = 0.9;
		bus.connect(conv).connect(wet).connect(master);

		noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
		const d = noiseBuf.getChannelData(0);
		for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

		// The pad. Pure sines and triangles, each one breathing at its own
		// slow rate — 0.045Hz, 0.064Hz, 0.083Hz... rates that never line up,
		// so the chord keeps shifting and never loops. A static chord would
		// go stale in about fifteen seconds.
		PAD.forEach((f, i) => {
			const o = ctx.createOscillator();
			o.type = i < 2 ? 'sine' : 'triangle';
			o.frequency.value = f;

			// a slow drift in pitch, a few cents wide — this is what keeps
			// it from sounding like a keyboard held down
			const drift = ctx.createOscillator();
			drift.frequency.value = 0.07 + i * 0.031;
			const driftAmt = ctx.createGain();
			driftAmt.gain.value = 0.35 + i * 0.25;
			drift.connect(driftAmt).connect(o.frequency);
			drift.start();

			const g = ctx.createGain();
			g.gain.value = 0.030;
			const swell = ctx.createOscillator();
			swell.frequency.value = 0.045 + i * 0.019;
			const swellAmt = ctx.createGain();
			swellAmt.gain.value = 0.024;
			swell.connect(swellAmt).connect(g.gain);
			swell.start();

			o.connect(g).connect(bus);
			o.start();
		});
	};

	// one struck note. The partial at 2.76× is inharmonic on purpose — that
	// non-whole-number spacing is what the ear reads as struck metal or
	// glass. Whole-number partials would come out as an organ.
	const ping = (f, t, dur, gain) => {
		[[1, 1], [2, 0.24], [2.76, 0.12], [5.4, 0.05]].forEach(([mult, amp]) => {
			const o = ctx.createOscillator();
			o.type = 'sine';
			o.frequency.setValueAtTime(f * mult, t);
			const g = ctx.createGain();
			g.gain.setValueAtTime(0.0001, t);
			g.gain.exponentialRampToValueAtTime(gain * amp, t + 0.006);
			g.gain.exponentialRampToValueAtTime(0.0001, t + dur * (mult > 2 ? 0.45 : 1));
			o.connect(g).connect(bus);
			o.start(t);
			o.stop(t + dur + 0.05);
		});
	};

	const air = (dur, from, to, gain, q = 1.2) => {
		const src = ctx.createBufferSource();
		src.buffer = noiseBuf;
		const f = ctx.createBiquadFilter();
		f.type = 'bandpass';
		f.frequency.setValueAtTime(from, ctx.currentTime);
		f.frequency.exponentialRampToValueAtTime(to, ctx.currentTime + dur * 0.9);
		f.Q.value = q;
		const g = ctx.createGain();
		g.gain.setValueAtTime(0.0001, ctx.currentTime);
		g.gain.exponentialRampToValueAtTime(gain, ctx.currentTime + dur * 0.35);
		g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
		src.connect(f).connect(g).connect(bus);
		src.start();
		src.stop(ctx.currentTime + dur + 0.05);
	};

	// Stray notes, at intervals that don't divide evenly into each other.
	// This is the thing you notice last and would miss first: silence with
	// occasional bells in it feels enchanted; silence alone feels empty.
	const twinkle = () => {
		if (!on || !ctx) return;
		const f = SCALE[4 + Math.floor(Math.random() * (SCALE.length - 4))];
		ping(f, ctx.currentTime, 2.4, 0.05 + Math.random() * 0.035);
		twinkleTimer = setTimeout(twinkle, 700 + Math.random() * 2400);
	};

	return {
		wake() { init(); if (ctx.state === 'suspended') ctx.resume(); },

		setOn(v) {
			on = v;
			if (!ctx) return;
			master.gain.cancelScheduledValues(ctx.currentTime);
			master.gain.setTargetAtTime(v ? 0.85 : 0, ctx.currentTime, 0.4);
			clearTimeout(twinkleTimer);
			if (v) twinkleTimer = setTimeout(twinkle, 400);
		},

		// a soft tick, high in the scale, so the switches belong to the
		// same instrument as everything else
		click() { if (ctx) ping(2349.32, ctx.currentTime, 0.5, 0.045); },

		// THE UNSEAL. Not a creak — a run up the scale with an airy swell
		// under it, like something breathing out. Reversed on the way shut.
		creak(up) {
			if (!ctx) return;
			const t0 = ctx.currentTime;
			const notes = up ? SCALE.slice(2, 9) : SCALE.slice(2, 9).reverse();
			notes.forEach((f, i) => ping(f, t0 + i * 0.062, up ? 1.6 : 1.0, up ? 0.075 : 0.05));
			air(up ? 1.1 : 0.8, up ? 400 : 3000, up ? 3600 : 380, up ? 0.09 : 0.06);
			// a low bloom underneath, so the run has a floor to stand on
			const o = ctx.createOscillator();
			o.type = 'sine';
			o.frequency.setValueAtTime(up ? 110 : 220, t0);
			o.frequency.exponentialRampToValueAtTime(up ? 220 : 98, t0 + 0.9);
			const g = ctx.createGain();
			g.gain.setValueAtTime(0.0001, t0);
			g.gain.exponentialRampToValueAtTime(0.16, t0 + 0.12);
			g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.1);
			o.connect(g).connect(bus);
			o.start(t0); o.stop(t0 + 1.2);
		},

		// the lid settling — a low resonant bloom rather than a wooden thud
		thud() {
			if (!ctx) return;
			const t0 = ctx.currentTime;
			ping(293.66, t0, 2.6, 0.12);
			const o = ctx.createOscillator();
			o.type = 'sine';
			o.frequency.setValueAtTime(140, t0);
			o.frequency.exponentialRampToValueAtTime(52, t0 + 0.4);
			const g = ctx.createGain();
			g.gain.setValueAtTime(0.34, t0);
			g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.55);
			o.connect(g).connect(bus);
			o.start(t0); o.stop(t0 + 0.6);
		},

		// THE TREASURE. An arpeggio climbing two octaves, then the whole
		// chord left ringing underneath it in the reverb tail.
		chime() {
			if (!ctx) return;
			const t0 = ctx.currentTime;
			[0, 2, 4, 5, 7, 8, 10].forEach((idx, i) => {
				ping(SCALE[idx], t0 + i * 0.075, 2.8 - i * 0.15, 0.12 - i * 0.008);
			});
			[293.66, 440, 587.33, 880].forEach((f, i) => {
				ping(f, t0 + 0.5 + i * 0.02, 4.2, 0.07);
			});
			air(1.6, 900, 5200, 0.055, 0.8);
		},

		// coins, but pitched — each one lands on a scale note, so a handful
		// of them comes out as a sparkle instead of a rattle
		jingle() {
			if (!ctx) return;
			const t0 = ctx.currentTime;
			for (let i = 0; i < 18; i++) {
				const f = SCALE[5 + Math.floor(Math.random() * (SCALE.length - 5))];
				ping(f * (Math.random() < 0.3 ? 2 : 1), t0 + Math.random() * 0.5, 0.5 + Math.random() * 0.5, 0.05);
			}
			air(0.6, 2600, 6000, 0.045, 0.9);
		},
	};
})();

/* ══ SCENE ═══════════════════════════════════════════════════════════════ */

const mount = document.getElementById('stage');
let renderer;
try {
	renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
} catch (err) {
	document.getElementById('fallback').style.display = 'grid';
	mount.style.display = 'none';
	throw err;
}

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
mount.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 200);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(buildLightRoom(), 0.04).texture;

const keyLight = new THREE.DirectionalLight(0xcfe0ff, 0.85);
keyLight.position.set(4, 7, 5);
scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(0x8fd8c0, 0.3);
rimLight.position.set(-5, 2, -4);
scene.add(rimLight);
// the treasure's own light, living inside the box
const treasureLight = new THREE.PointLight(0xffb14a, 0, 9, 2);
treasureLight.position.set(0, 0.25, 0);
scene.add(treasureLight);

const { chest, hinge, goldMat, coins } = buildChest();
const rig = new THREE.Group();          // takes the shake, so nothing else has to
rig.add(chest);

const shaft = buildShaft();
const sparks = buildSparks();
rig.add(shaft, sparks);

const { shadow, pool } = buildFloor();
rig.add(shadow, pool);

scene.add(rig);

const target = new THREE.Vector3(0, -0.05, 0);
let azim = 0.42, elev = 0.3;
const dist = 6.4;
let velA = 0, dragging = false, moved = 0, lastX = 0, lastY = 0;

const placeCamera = () => {
	camera.position.set(
		target.x + dist * Math.cos(elev) * Math.sin(azim),
		target.y + dist * Math.sin(elev),
		target.z + dist * Math.cos(elev) * Math.cos(azim),
	);
	camera.lookAt(target);
};
placeCamera();

/* ── state ── */
const state = { lid: false, glow: true, sound: false };
let openness = 0;        // 0 shut, 1 wide open — everything else follows this
let shake = 0;

const setLid = (v, quiet) => {
	state.lid = v;
	document.getElementById('sw-lid').setAttribute('aria-pressed', String(v));
	if (quiet) return;
	Sfx.creak(v);
	if (v) setTimeout(() => Sfx.chime(), 380);
	else setTimeout(() => Sfx.thud(), 620);
};

/* ── pointer: drag to orbit, click to open ──
   Same pointer does both, so the distinction is how far it travelled. Under
   a few pixels is a click; anything more was a drag, and shouldn't also
   flip the lid open when you let go.
*/
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();

const hitChest = (e) => {
	ndc.x = (e.clientX / window.innerWidth) * 2 - 1;
	ndc.y = -(e.clientY / window.innerHeight) * 2 + 1;
	ray.setFromCamera(ndc, camera);
	return ray.intersectObject(chest, true).length > 0;
};

mount.addEventListener('pointerdown', (e) => {
	dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY; velA = 0;
	mount.classList.add('dragging');
});

mount.addEventListener('pointerup', (e) => {
	if (moved < 6 && hitChest(e)) {
		Sfx.wake();
		setLid(!state.lid);
	}
});

const release = () => { dragging = false; mount.classList.remove('dragging'); };
window.addEventListener('pointerup', release);
window.addEventListener('pointercancel', release);

window.addEventListener('pointermove', (e) => {
	if (!dragging) {
		mount.classList.toggle('over', hitChest(e));
		return;
	}
	const dx = e.clientX - lastX, dy = e.clientY - lastY;
	lastX = e.clientX; lastY = e.clientY;
	moved += Math.abs(dx) + Math.abs(dy);
	azim -= dx * 0.006;
	elev = Math.max(-0.05, Math.min(0.95, elev + dy * 0.005));
	velA = -dx * 0.006;
	if (reduce) placeCamera();
}, { passive: true });

window.addEventListener('resize', () => {
	camera.aspect = window.innerWidth / window.innerHeight;
	camera.updateProjectionMatrix();
	renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ── console ── */
document.getElementById('sw-lid').addEventListener('click', () => {
	Sfx.wake(); Sfx.click(); setLid(!state.lid);
});
document.getElementById('sw-glow').addEventListener('click', () => {
	Sfx.wake(); Sfx.click();
	state.glow = !state.glow;
	document.getElementById('sw-glow').setAttribute('aria-pressed', String(state.glow));
});
document.getElementById('sw-sound').addEventListener('click', () => {
	Sfx.wake(); Sfx.click();
	state.sound = !state.sound;
	document.getElementById('sw-sound').setAttribute('aria-pressed', String(state.sound));
	Sfx.setOn(state.sound);
});

const shakeBtn = document.getElementById('btn-shake');
shakeBtn.addEventListener('click', () => {
	Sfx.wake();
	Sfx.click();
	Sfx.jingle();
	shake = 1;
	shakeBtn.classList.add('lit');
	setTimeout(() => shakeBtn.classList.remove('lit'), 700);
});

/* ── frame ── */
const clock = new THREE.Clock();
let t = 0;

const frame = () => {
	requestAnimationFrame(frame);
	const dt = Math.min(clock.getDelta(), 0.05);
	if (!reduce) t += dt;

	// The lid eases toward its target with a touch of overshoot near the
	// end of the swing, so it settles instead of arriving.
	const goal = state.lid ? 1 : 0;
	openness += (goal - openness) * Math.min(1, dt * (state.lid ? 4.2 : 6.5));
	const swing = -2.02 * openness;
	hinge.rotation.x = reduce ? swing : swing - Math.sin(openness * Math.PI) * 0.09;

	// everything downstream of openness
	const lit = openness * (state.glow ? 1 : 0.22);
	shaftMaterial.uniforms.uStrength.value = lit;
	shaftMaterial.uniforms.uTime.value = t;
	shaft.visible = lit > 0.01;
	sparks.visible = lit > 0.05;
	sparks.material.opacity = Math.min(1, lit);
	treasureLight.intensity = 9 * lit;
	pool.material.opacity = 0.25 + 0.75 * lit;
	goldMat.emissiveIntensity = 0.16 + 0.5 * lit;
	if (!reduce && lit > 0.05) sparks.userData.step(dt);

	// shake: a decaying rattle, with the coins rocking a beat behind
	shake *= Math.pow(0.02, dt);
	if (shake > 0.001) {
		rig.position.x = Math.sin(t * 47) * 0.045 * shake;
		rig.position.y = Math.abs(Math.sin(t * 39)) * 0.03 * shake;
		rig.rotation.z = Math.sin(t * 41) * 0.03 * shake;
		for (let i = 0; i < coins.length; i++) {
			coins[i].rotation.z += Math.sin(t * 30 + i) * 0.06 * shake;
		}
	} else {
		rig.position.set(0, 0, 0);
		rig.rotation.z = 0;
	}

	if (!dragging && !reduce) {
		azim += velA;
		velA *= 0.93;
		azim += dt * 0.01;      // a slow drift, so it's never dead still
	}
	if (!reduce || dragging) placeCamera();

	renderer.render(scene, camera);
};

setLid(false, true);
frame();
</script>
