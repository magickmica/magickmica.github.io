<style>
:root{
  --night:#0b1026;        /* lapis night */
  --night-2:#141b3d;
  --gold:#e0b64c;
  --gold-lit:#ffe6a6;
  --turquoise:#3fb3a6;
  --carnelian:#c05a3c;
  --papyrus:#e9dcbb;
  --sand:#c9b489;

}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;padding:0 18px 60px;
  background:var(--night);
  color:var(--sand);
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:15px;line-height:1.5;overflow-x:hidden;
}
.sky{
  position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(120% 70% at 50% -10%, #22306b 0%, transparent 58%),
    radial-gradient(80% 52% at 84% 106%, #4a2f1e 0%, transparent 62%);
  opacity:.85;
}
.grain{
  position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.4;
  background-image:
    radial-gradient(1px 1px at 16% 26%, rgba(255,230,166,.8) 50%, transparent 50%),

  background-size:210px 210px,210px 210px,210px 210px;
}
a{color:var(--turquoise)}
a:focus-visible,button:focus-visible{outline:2px solid var(--gold-lit);outline-offset:3px}
.wrap{max-width:640px;margin:0 auto}

.glyph{font-family:"Noto Sans Egyptian Hieroglyphs","Segoe UI Historic",serif}

/* ------------------------------------------------------- frieze */
.frieze{
  font-family:"Noto Sans Egyptian Hieroglyphs","Segoe UI Historic",serif;
  font-size:19px;line-height:1;color:var(--gold);
  opacity:.5;text-align:center;letter-spacing:.24em;
  padding:18px 0;overflow:hidden;white-space:nowrap;
  border-bottom:1px solid rgba(224,182,76,.26);
  margin:0 -18px 30px;
}
.frieze.bottom{border-bottom:0;border-top:1px solid rgba(224,182,76,.26);margin:34px -18px 0}

header{text-align:center;padding:4px 0 8px}
.eyebrow{font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:var(--dim);margin:0 0 12px}
h1{
  font-family:"Cinzel",Georgia,serif;font-weight:700;
  font-size:clamp(20px,4.8vw,32px);letter-spacing:.08em;margin:0;
  color:transparent;
  background:linear-gradient(96deg,var(--gold),var(--gold-lit) 46%,var(--gold) 74%,#a8802b);
  -webkit-background-clip:text;background-clip:text;
  text-shadow:0 0 26px rgba(224,182,76,.18);
}

/* ------------------------------------------------------- cartouche */
.shrine{display:flex;align-items:stretch;gap:14px;margin:34px 0 0;justify-content:center}

/* the vertical glyph columns flanking the cartouche */
.column{
  font-family:"Noto Sans Egyptian Hieroglyphs","Segoe UI Historic",serif;
  font-size:23px;line-height:1.5;color:var(--gold);opacity:.62;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  width:34px;flex:none;
  transition:opacity .4s ease;
}
.consulting .column{opacity:1}

.cartouche{
  position:relative;flex:1;min-width:0;max-width:420px;
  aspect-ratio:1.32/1;
}
.cartouche svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.cartouche svg .ring{
  fill:rgba(20,27,61,.72);
  stroke:var(--gold);stroke-width:2.4;
  filter:drop-shadow(0 0 12px rgba(224,182,76,.4));
  transition:stroke .4s ease,filter .4s ease;
}
.consulting .cartouche svg .ring{stroke:var(--gold-lit);filter:drop-shadow(0 0 26px rgba(255,230,166,.75))}
.cartouche svg .tie{stroke:var(--gold);stroke-width:3.4;stroke-linecap:round}

.carved{
  position:absolute;inset:0;z-index:2;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;padding:12% 14%;text-align:center;pointer-events:none;
}
.sigil{
  font-family:"Noto Sans Egyptian Hieroglyphs","Segoe UI Historic",serif;
  font-size:24px;line-height:1;color:var(--gold);letter-spacing:.16em;
  transition:opacity .35s ease;
}
.carved p{
  margin:0;width:100%;max-height:58%;overflow:hidden;
  font-family:"Spectral",Georgia,serif;font-style:italic;font-weight:300;
  color:var(--papyrus);line-height:1.38;
  text-shadow:0 1px 0 rgba(0,0,0,.5);
  transition:opacity .35s ease;
}
.consulting .carved p,.consulting .sigil{opacity:0}

.name{
  font-family:"Cinzel",Georgia,serif;font-size:10px;letter-spacing:.3em;
  color:var(--gold);opacity:.7;
}

/* ------------------------------------------------------- controls */
.controls{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:30px;align-items:center}
.eye{
  font-family:"Noto Sans Egyptian Hieroglyphs","Segoe UI Historic",serif;
  font-size:30px;line-height:1;
  color:var(--night);
  background:radial-gradient(circle at 40% 34%, var(--gold-lit), var(--gold) 62%, #a8802b);
  border:0;border-radius:999px;
  width:74px;height:74px;cursor:pointer;
  box-shadow:0 0 28px rgba(224,182,76,.42);
  transition:transform .2s ease,box-shadow .2s ease;
  display:grid;place-items:center;padding:0;
}
.eye:hover{transform:translateY(-2px);box-shadow:0 0 42px rgba(224,182,76,.68)}
.eye:disabled{opacity:.5;cursor:default;transform:none}

.btn{
  font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:500;
  letter-spacing:.16em;text-transform:uppercase;color:var(--sand);background:transparent;
  border:1px solid rgba(201,180,137,.36);border-radius:999px;
  padding:12px 20px;min-height:44px;cursor:pointer;
  transition:border-color .18s ease,color .18s ease;
}
.btn:hover:not(:disabled){border-color:var(--gold-lit);color:var(--gold-lit)}
.btn:disabled{opacity:.34;cursor:default}

.tally{font-size:11px;letter-spacing:.2em;color:var(--dim);text-align:center;margin:20px 0 0}
.tally b{color:var(--gold);font-weight:500}
.hint{text-align:center;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#5c5a7d;margin:9px 0 0}

.foot{text-align:center;margin-top:36px;font-size:12px;color:var(--dim)}
.foot nav{margin:0 0 14px;line-height:2.2}
.foot nav a{margin:0 9px;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.foot .fine{font-size:11px;color:#54527a}

@media (max-width:560px){
  .shrine{gap:8px}
  .column{width:26px;font-size:19px}
  .cartouche{aspect-ratio:1.1/1}
  .frieze{font-size:16px;letter-spacing:.16em}
}

@media (prefers-reduced-motion:reduce){
  .carved p,.sigil,.column,.cartouche svg .ring{transition:none}
  .eye:hover{transform:none}
}

(function () {
  'use strict';

  var TOTAL = SIGNS.length;
  var LS_SEEN = 'mm_oracle_seen_v1';

  // Egyptian Hieroglyph block characters
  var GLYPHS = ['\u{13080}','\u{132F9}','\u{13048}','\u{130E0}','\u{13183}','\u{13153}',
                '\u{1308B}','\u{13191}','\u{1319B}','\u{13171}','\u{1310F}','\u{13100}',
                '\u{13045}','\u{1314F}','\u{13088}','\u{130A1}','\u{1329B}','\u{131CB}',
                '\u{13068}','\u{13091}','\u{13141}','\u{1325B}','\u{130BA}','\u{1317C}'];
  var ANKH = '\u2625';

  var shrine = document.getElementById('shrine');
  var textEl = document.getElementById('signText');
  var sigilEl = document.getElementById('sigil');
  var noEl = document.getElementById('signNo');
  var askEl = document.getElementById('ask');
  var copyEl = document.getElementById('copy');
  var tallyEl = document.getElementById('tally');
  var colL = document.getElementById('colLeft');
  var colR = document.getElementById('colRight');

  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var current = null, bag = [], busy = false;

  function pad(n) { return ('00' + n).slice(-3); }

  /* a sign's three glyphs are derived from its number, so sign 042 always
     carries the same sigil — the carving belongs to the sign, not the visit */
  function sigilFor(i) {
    var a = GLYPHS[i % GLYPHS.length];
    var b = GLYPHS[(i * 7 + 3) % GLYPHS.length];
    var c = GLYPHS[(i * 13 + 5) % GLYPHS.length];
    return a + b + c;
  }

  function randomGlyphs(n) {
    var out = '';
    for (var i = 0; i < n; i++) { out += GLYPHS[Math.floor(Math.random() * GLYPHS.length)]; }
    return out;
  }

  function fillColumns() {
    colL.textContent = '';
    colR.textContent = '';
    for (var i = 0; i < 9; i++) {
      var l = document.createElement('span'); l.textContent = randomGlyphs(1);
      var r = document.createElement('span'); r.textContent = randomGlyphs(1);
      colL.appendChild(l); colR.appendChild(r);
    }
  }

  function fillFrieze(el) {
    var n = 40, s = '';
    for (var i = 0; i < n; i++) { s += randomGlyphs(1); }
    el.textContent = s;
  }

  /* ------------------------------------------------ storage */
  function read() {
    try { var r = localStorage.getItem(LS_SEEN); return r ? JSON.parse(r) : []; }
    catch (e) { return []; }
  }
  function write(v) { try { localStorage.setItem(LS_SEEN, JSON.stringify(v)); } catch (e) {} }
  var seen = read();
  function syncTally() { tallyEl.textContent = Math.min(seen.length, TOTAL); }

  function refill() {
    var pool = SIGNS.filter(function (s) { return seen.indexOf(s.i) === -1; });
    if (!pool.length) { seen = []; write(seen); pool = SIGNS.slice(); }
    for (var i = pool.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = pool[i]; pool[i] = pool[j]; pool[j] = t;
    }
    bag = pool;
  }

  function fitText() {
    for (var size = 20; size >= 11; size--) {
      textEl.style.fontSize = size + 'px';
      if (textEl.scrollHeight <= textEl.clientHeight + 1) break;
    }
  }

  function carve(sign) {
    current = sign;
    bag = bag.filter(function (b) { return b.i !== sign.i; });
    textEl.textContent = sign.a;
    sigilEl.textContent = sigilFor(sign.i);
    noEl.textContent = ANKH + ' ' + pad(sign.i) + ' ' + ANKH;
    fitText();
    copyEl.disabled = false;
    copyEl.textContent = 'Copy';
    if (seen.indexOf(sign.i) === -1) { seen.push(sign.i); write(seen); }
    syncTally();
    askEl.setAttribute('aria-label', 'Consult the oracle again');
    try {
      if (history.replaceState) { history.replaceState(null, '', '#sign-' + pad(sign.i)); }
    } catch (e) {}
  }

  function consult() {
    if (busy) return;
    if (!bag.length) refill();
    var sign = bag.pop();
    if (!sign) return;

    if (reduced) { fillColumns(); carve(sign); return; }

    busy = true;
    askEl.disabled = true;
    shrine.classList.add('consulting');

    // the flanking columns churn while the oracle is deciding
    var churn = setInterval(fillColumns, 90);
    window.setTimeout(function () {
      clearInterval(churn);
      fillColumns();
      shrine.classList.remove('consulting');
      carve(sign);
      askEl.disabled = false;
      busy = false;
    }, 760);
  }

  askEl.addEventListener('click', consult);

  copyEl.addEventListener('click', function () {
    if (!current) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(current.a).then(
        function () { copyEl.textContent = 'Copied'; },
        function () { copyEl.textContent = 'Blocked'; });
    } else { copyEl.textContent = 'Blocked'; }
  });

  var rT = null;
  window.addEventListener('resize', function () {
    clearTimeout(rT);
    rT = setTimeout(fitText, 160);
  });

  /* ------------------------------------------------ boot */
  fillFrieze(document.getElementById('friezeTop'));
  fillFrieze(document.getElementById('friezeBottom'));
  fillColumns();
  syncTally();
  refill();

  var deep = /^#sign-(\d{1,3})$/.exec(window.location.hash);
  var start = null;
  if (deep) {
    var n = parseInt(deep[1], 10);
    start = SIGNS.filter(function (s) { return s.i === n; })[0] || null;
  }
  if (start) { carve(start); }
  else {
    textEl.textContent = 'The cartouche is empty. Press the eye and it will be carved.';
    sigilEl.textContent = GLYPHS[0] + ANKH + GLYPHS[1];
    noEl.textContent = '';
    fitText();
  }

  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(fitText); }
})();
</script>
