name: Guestbook keep-awake

# Supabase pauses Free-plan projects after about a week with no database
# activity, which is what broke the guestbook before. This reads one row from
# the guestbook table once a day so the project never goes quiet for a week.
#
# The project URL and publishable key are read from guestbook.html itself, so
# if you ever change them there, this follows along automatically. (The
# publishable key is meant to be public; the table's row-level-security
# policies are what protect it.)
#
# If the read fails (project paused, table missing, key changed) the run goes
# red and GitHub emails you, so you hear about it before visitors do.
on:
  schedule:
    - cron: "23 11 * * *"   # daily, 11:23 UTC (6:23am Eastern in winter)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read one guestbook row
        run: |
          URL=$(grep -oE 'SUPABASE_URL:[[:space:]]*"[^"]+"' guestbook.html | sed -E 's/.*"([^"]+)"/\1/')
          KEY=$(grep -oE 'SUPABASE_KEY:[[:space:]]*"[^"]+"' guestbook.html | sed -E 's/.*"([^"]+)"/\1/')
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::Could not find SUPABASE_URL / SUPABASE_KEY in guestbook.html"
            exit 1
          fi
          CODE=$(curl -sS -o body.txt -w '%{http_code}' --max-time 30 \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "${URL%/}/rest/v1/guestbook?select=id&limit=1")
          echo "HTTP $CODE"
          head -c 300 body.txt; echo
          if [ "$CODE" != "200" ]; then
            echo "::error::Guestbook database did not answer (HTTP $CODE). It may be paused — open the Supabase dashboard and restore it."
            exit 1
          fi
          echo "Guestbook database is awake."
