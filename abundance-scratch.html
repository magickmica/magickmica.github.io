<style>

.grain{
  position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;

a{color:var(--cyan)}

@keyframes holo{to{background-position:220% 0}}

  transition:color .18s ease,border-color .18s ease;
}
.chip[aria-pressed="true"]{color:var(--gold);border-color:var(--gold)}

/* ------------------------------------------------------ scratcher */
.stage{
  position:relative;width:100%;max-width:400px;margin:14px auto 0;
  aspect-ratio:1/1;
}
.stage.card{aspect-ratio:1.42/1}

.shape-bg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.shape-bg path{
  fill:#120c22;
  stroke:url(#holo);stroke-width:.9;
  filter:drop-shadow(0 0 16px rgba(255,68,204,.4));
}

.reveal{
  position:absolute;inset:0;z-index:2;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;
}
.reveal p{
  margin:0;text-align:center;

  color:#fff;line-height:1.36;
  text-shadow:0 0 22px rgba(255,68,204,.45);
  overflow:hidden;
}

.stage.heart .reveal p{width:56%;max-height:52%;margin-bottom:12%}
.stage.card  .reveal p{width:80%;max-height:70%}

canvas#foil{

  transition:opacity .5s ease;

canvas#foil.gone{opacity:0;pointer-events:none}

.btn.gold:hover{box-shadow:0 0 34px rgba(255,209,102,.5);color:var(--void)}

.hint{text-align:center;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#544f70;margin:9px 0 0}

(function () {
  'use strict';

  var TOTAL = SIGNS.length;
  var LS_SEEN = 'mm_scratch_seen_v1';

  var stage = document.getElementById('stage');
  var canvas = document.getElementById('foil');
  var ctx = canvas.getContext('2d', { willReadFrequently: true });
  var bgPath = document.getElementById('bgPath');
  var textEl = document.getElementById('signText');
  var curEl = document.getElementById('cur');
  var tallyEl = document.getElementById('tally');
  var revealEl = document.getElementById('reveal');
  var againEl = document.getElementById('again');
  var copyEl = document.getElementById('copy');
  var chipHeart = document.getElementById('chipHeart');
  var chipCard = document.getElementById('chipCard');
  var skyEl = document.getElementById('sky');

  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var shape = 'heart';
  var current = null;
  var bag = [];
  var opaqueAtStart = 0;
  var cleared = false;
  var drawing = false;
  var lastPt = null;

  /* ------------------------------------------------ shapes */
  // normalized 0..1 control points, shared by the SVG backdrop and the canvas foil
  var HEART = 'M .5 .95 C .2 .75 .02 .56 .02 .35 C .02 .16 .16 .04 .32 .04 ' +
              'C .41 .04 .47 .09 .5 .15 C .53 .09 .59 .04 .68 .04 ' +
              'C .84 .04 .98 .16 .98 .35 C .98 .56 .8 .75 .5 .95 Z';

  function svgPathFor(kind) {
    if (kind === 'heart') {
      return HEART.replace(/([.\d]+)/g, function (m) { return (parseFloat(m) * 100).toFixed(2); });
    }
    return 'M 4 1 H 96 A 3 3 0 0 1 99 4 V 96 A 3 3 0 0 1 96 99 H 4 ' +
           'A 3 3 0 0 1 1 96 V 4 A 3 3 0 0 1 4 1 Z';
  }

  function canvasPath(w, h) {
    var p = new Path2D();
    var X = function (v) { return v * w; };
    var Y = function (v) { return v * h; };
    if (shape === 'heart') {
      p.moveTo(X(.5), Y(.95));
      p.bezierCurveTo(X(.20), Y(.75), X(.02), Y(.56), X(.02), Y(.35));
      p.bezierCurveTo(X(.02), Y(.16), X(.16), Y(.04), X(.32), Y(.04));
      p.bezierCurveTo(X(.41), Y(.04), X(.47), Y(.09), X(.50), Y(.15));
      p.bezierCurveTo(X(.53), Y(.09), X(.59), Y(.04), X(.68), Y(.04));
      p.bezierCurveTo(X(.84), Y(.04), X(.98), Y(.16), X(.98), Y(.35));
      p.bezierCurveTo(X(.98), Y(.56), X(.80), Y(.75), X(.50), Y(.95));
      p.closePath();
    } else {
      var r = Math.min(w, h) * 0.04;
      p.moveTo(X(.01) + r, Y(.01));
      p.lineTo(X(.99) - r, Y(.01));
      p.quadraticCurveTo(X(.99), Y(.01), X(.99), Y(.01) + r);
      p.lineTo(X(.99), Y(.99) - r);
      p.quadraticCurveTo(X(.99), Y(.99), X(.99) - r, Y(.99));
      p.lineTo(X(.01) + r, Y(.99));
      p.quadraticCurveTo(X(.01), Y(.99), X(.01), Y(.99) - r);
      p.lineTo(X(.01), Y(.01) + r);
      p.quadraticCurveTo(X(.01), Y(.01), X(.01) + r, Y(.01));
      p.closePath();
    }
    return p;
  }

  /* ------------------------------------------------ foil */
  function paintFoil() {
    var rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    var w = canvas.width, h = canvas.height;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0, 0, w, h);

    var path = canvasPath(w, h);
    ctx.save();
    ctx.clip(path);

    var g = ctx.createLinearGradient(0, 0, w, h);
    g.addColorStop(0, '#c8b4ff');
    g.addColorStop(.26, '#ff9ede');
    g.addColorStop(.5, '#ffe6a8');
    g.addColorStop(.74, '#9fe9ff');
    g.addColorStop(1, '#cbb2ff');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);

    // brushed-foil streaks
    ctx.globalAlpha = .16;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = Math.max(1, w / 220);
    for (var i = -h; i < w; i += Math.max(6, w / 46)) {
      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i + h, h); ctx.stroke();
    }
    // glints
    ctx.globalAlpha = .5;
    ctx.fillStyle = '#ffffff';
    for (var s = 0; s < 46; s++) {
      var sx = Math.random() * w, sy = Math.random() * h, sr = Math.random() * (w / 190) + 1;
      ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // instruction
    ctx.fillStyle = 'rgba(60,30,90,.55)';
    var fs = Math.max(10, Math.round(w / 30));
    ctx.font = '500 ' + fs + 'px "IBM Plex Mono", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var label = shape === 'heart' ? 'SCRATCH THE HEART' : 'SCRATCH HERE';
    ctx.fillText(label, w / 2, shape === 'heart' ? h * 0.42 : h / 2);

    ctx.restore();

    opaqueAtStart = countOpaque();
    cleared = false;
    canvas.classList.remove('gone');
  }

  /* count non-transparent pixels on a coarse grid — cheap enough to poll */
  function countOpaque() {
    var w = canvas.width, h = canvas.height;
    if (!w || !h) return 0;
    var data = ctx.getImageData(0, 0, w, h).data;
    var step = 4 * 6; // sample every 6th pixel
    var n = 0;
    for (var i = 3; i < data.length; i += step) { if (data[i] > 24) n++; }
    return n;
  }

  function progress() {
    if (!opaqueAtStart) return 1;
    return 1 - countOpaque() / opaqueAtStart;
  }

  /* ------------------------------------------------ scratching */
  function pointFromEvent(e) {
    var rect = canvas.getBoundingClientRect();
    var dpr = canvas.width / rect.width;
    return { x: (e.clientX - rect.left) * dpr, y: (e.clientY - rect.top) * dpr };

  function scratchTo(pt) {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(18, canvas.width / 11);
    ctx.beginPath();
    if (lastPt) { ctx.moveTo(lastPt.x, lastPt.y); } else { ctx.moveTo(pt.x, pt.y); }
    ctx.lineTo(pt.x, pt.y);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, ctx.lineWidth / 2, 0, Math.PI * 2);
    ctx.fill();
    lastPt = pt;
  }

  var pollT = null;
  function maybeFinish() {
    if (cleared) return;
    if (progress() >= 0.5) { finish(); }
  }

  function finish() {
    if (cleared) return;
    cleared = true;
    canvas.classList.add('gone');
    copyEl.disabled = false;
    markSeen();
  }

  canvas.addEventListener('pointerdown', function (e) {
    if (cleared) return;
    drawing = true;
    lastPt = null;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    scratchTo(pointFromEvent(e));
    e.preventDefault();
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!drawing || cleared) return;
    scratchTo(pointFromEvent(e));
    if (!pollT) {
      pollT = setTimeout(function () { pollT = null; maybeFinish(); }, 180);
    }
    e.preventDefault();
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) {
    canvas.addEventListener(ev, function () {
      if (!drawing) return;
      drawing = false; lastPt = null;
      maybeFinish();
    });
  });

  /* ------------------------------------------------ signs */
  function read() {
    try { var r = localStorage.getItem(LS_SEEN); return r ? JSON.parse(r) : []; }
    catch (e) { return []; }
  }
  function write(v) {
    try { localStorage.setItem(LS_SEEN, JSON.stringify(v)); } catch (e) {}
  }
  var seen = read();

  function markSeen() {
    if (current && seen.indexOf(current.i) === -1) {
      seen.push(current.i); write(seen); syncTally();
    }
  }
  function syncTally() { tallyEl.textContent = Math.min(seen.length, TOTAL); }

  function refill() {
    var pool = SIGNS.filter(function (s) { return seen.indexOf(s.i) === -1; });
    if (!pool.length) pool = SIGNS.slice();
    for (var i = pool.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = pool[i]; pool[i] = pool[j]; pool[j] = t;
    }
    bag = pool;
  }

  var STOPS = [['#a020f0','#ff44cc'],['#ff44cc','#ffd166'],['#ffd166','#22e0ff'],['#22e0ff','#a020f0']];

  /* shrink the type until the sign fits the shape's usable area */
  function fitText() {
    var max = shape === 'heart' ? 21 : 27;
    var min = 12;
    for (var size = max; size >= min; size--) {
      textEl.style.fontSize = size + 'px';
      if (textEl.scrollHeight <= textEl.clientHeight + 1) break;
    }
  }

  function show(sign) {
    current = sign;
    textEl.textContent = sign.a;
    curEl.textContent = ('00' + sign.i).slice(-3);
    copyEl.disabled = true;
    copyEl.textContent = 'Copy';
    fitText();

    var band = Math.min(STOPS.length - 1, Math.floor(((sign.i - 1) / TOTAL) * STOPS.length));
    skyEl.style.setProperty('--glow1', STOPS[band][0]);
    skyEl.style.setProperty('--glow2', STOPS[band][1]);

    try {
      if (history.replaceState) { history.replaceState(null, '', '#sign-' + ('00' + sign.i).slice(-3)); }
    } catch (e) {}

    paintFoil();
  }

  function nextSign() {
    if (!bag.length) refill();
    var s = bag.pop();
    if (s) show(s);
  }

  /* ------------------------------------------------ shape switching */
  function setShape(kind) {
    if (shape === kind) return;
    shape = kind;
    stage.classList.toggle('heart', kind === 'heart');
    stage.classList.toggle('card', kind === 'card');
    chipHeart.setAttribute('aria-pressed', String(kind === 'heart'));
    chipCard.setAttribute('aria-pressed', String(kind === 'card'));
    bgPath.setAttribute('d', svgPathFor(kind));
    fitText();
    paintFoil();
  }

  chipHeart.addEventListener('click', function () { setShape('heart'); });
  chipCard.addEventListener('click', function () { setShape('card'); });

  revealEl.addEventListener('click', function () {
    if (cleared) return;
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    finish();
  });
  againEl.addEventListener('click', nextSign);
  copyEl.addEventListener('click', function () {
    if (!current) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(current.a).then(
        function () { copyEl.textContent = 'Copied'; },
        function () { copyEl.textContent = 'Blocked'; });
    } else { copyEl.textContent = 'Blocked'; }
  });

  var rT = null;
  window.addEventListener('resize', function () {
    clearTimeout(rT);
    rT = setTimeout(function () {
      fitText();
      if (!cleared) { paintFoil(); }
    }, 160);
  });

  /* ------------------------------------------------ boot */
  bgPath.setAttribute('d', svgPathFor('heart'));
  syncTally();
  refill();

  var deep = /^#sign-(\d{1,3})$/.exec(window.location.hash);
  var start = null;
  if (deep) {
    var n = parseInt(deep[1], 10);
    start = SIGNS.filter(function (s) { return s.i === n; })[0] || null;
  }
  if (start) { bag = bag.filter(function (s) { return s.i !== start.i; }); show(start); }
  else { nextSign(); }

  // fonts can land after first paint and change the metrics
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(fitText); }
})();
</script>
