<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wand</title>

<!--
  Save this file anywhere and double-click it.
  Needs an internet connection the first time (three.js and the fonts come
  from a CDN). The wand, the glitter and every sound are generated here.
  No images, no audio files, no build step.

  Move the pointer — the wand follows. Click anywhere to cast.
  Move it FAST. The trail and the notes both answer to speed.
-->

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;800&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet" />

<style>
	:root {
		--void:  #190522;   /* the dark behind everything */
		--plum:  #45114a;
		--rose:  #ff5fa8;   /* every ON state */
		--lilac: #c48cff;
		--gold:  #ffd9a0;
		--cream: #fdeaf6;
		--slab:  #26082c;
	}

	* { box-sizing: border-box; }

	html, body { margin: 0; height: 100%; overflow: hidden; background: var(--void); }

	body {
		font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
		color: var(--cream);
		/* Pink needs somewhere dark to be bright against. All-pink goes
		   chalky — the glitter only sparkles because the plum behind it
		   is nearly black at the edges. */
		background:
			radial-gradient(58% 46% at 50% 42%, color-mix(in srgb, var(--rose) 32%, transparent) 0%, transparent 62%),
			radial-gradient(90% 60% at 20% 92%, color-mix(in srgb, var(--lilac) 26%, transparent) 0%, transparent 60%),
			linear-gradient(165deg, var(--void) 0%, var(--plum) 58%, #6a1a5e 100%);
	}

	#stage { position: fixed; inset: 0; touch-action: none; cursor: none; }
	#stage canvas { display: block; }

	.overlay {
		position: fixed;
		inset: 0;
		display: flex;
		flex-direction: column;
		justify-content: space-between;
		padding: clamp(1.1rem, 3.5vw, 2.4rem);
		pointer-events: none;
	}

	.masthead { max-width: 30ch; }

	.title {
		font-family: 'Big Shoulders Display', ui-sans-serif, sans-serif;
		font-weight: 800;
		font-size: clamp(3.6rem, 14vw, 8.5rem);
		line-height: 0.82;
		letter-spacing: -0.02em;
		text-transform: uppercase;
		margin: 0;
		text-shadow: 0 0 70px color-mix(in srgb, var(--rose) 55%, transparent);
	}

	.standfirst {
		margin: 0.85rem 0 0;
		font-size: 0.9rem;
		line-height: 1.5;
		max-width: 26ch;
		color: color-mix(in srgb, var(--cream) 66%, transparent);
	}

	/* ── console ── */
	.console {
		pointer-events: auto;
		align-self: center;
		display: flex;
		flex-wrap: wrap;
		align-items: center;
		justify-content: center;
		gap: clamp(0.5rem, 2vw, 1.1rem);
		padding: clamp(0.7rem, 2vw, 1rem) clamp(0.9rem, 2.5vw, 1.4rem);
		border-radius: 14px;
		background: color-mix(in srgb, var(--slab) 84%, transparent);
		border: 1px solid color-mix(in srgb, var(--cream) 14%, transparent);
		box-shadow: 0 18px 50px -18px #000, inset 0 1px 0 color-mix(in srgb, var(--cream) 12%, transparent);
		backdrop-filter: blur(9px);
		cursor: default;
	}

	.switch {
		appearance: none;
		border: 0;
		background: none;
		padding: 0.35rem 0.15rem;
		display: grid;
		justify-items: center;
		gap: 0.5rem;
		cursor: pointer;
		font: inherit;
		color: inherit;
		border-radius: 9px;
	}
	.switch:focus-visible { outline: 2px solid var(--rose); outline-offset: 3px; }

	.throw {
		width: 56px;
		height: 27px;
		border-radius: 999px;
		background: #12040f;
		border: 1px solid color-mix(in srgb, var(--cream) 16%, transparent);
		box-shadow: inset 0 2px 6px #000;
		position: relative;
	}
	.knob {
		position: absolute;
		top: 3px;
		left: 3px;
		width: 19px;
		height: 19px;
		border-radius: 50%;
		background: linear-gradient(180deg, #fffaff, #d9bdd0);
		box-shadow: 0 2px 4px #000a;
		transition: transform 0.34s cubic-bezier(0.34, 1.7, 0.5, 1);
	}
	.switch[aria-pressed="true"] .knob { transform: translateX(29px); }
	.switch[aria-pressed="true"] .throw {
		background: color-mix(in srgb, var(--rose) 30%, #12040f);
		box-shadow: inset 0 2px 6px #0008, 0 0 16px -2px var(--rose);
	}

	.label {
		font-family: 'Big Shoulders Display', ui-sans-serif, sans-serif;
		font-weight: 500;
		font-size: 0.95rem;
		letter-spacing: 0.16em;
		text-transform: uppercase;
		color: color-mix(in srgb, var(--cream) 60%, transparent);
	}
	.switch[aria-pressed="true"] .label { color: var(--cream); }

	.press .throw {
		display: grid;
		place-items: center;
		background: linear-gradient(180deg, #4d1553, #2a0a30);
		border-color: color-mix(in srgb, var(--lilac) 40%, transparent);
		transition: transform 0.1s ease;
	}
	.press:active .throw { transform: translateY(2px); }
	.press .dot {
		width: 9px; height: 9px; border-radius: 50%;
		background: var(--lilac);
		box-shadow: 0 0 12px var(--lilac);
		opacity: 0.55;
	}
	.press:active .dot, .press.lit .dot { opacity: 1; }

	/* ── volume ── */
	.vol { display: grid; justify-items: center; gap: 0.5rem; padding: 0.35rem 0.3rem; }
	.vol input {
		-webkit-appearance: none; appearance: none;
		width: 74px; height: 27px; background: none; cursor: pointer; margin: 0;
	}
	.vol input::-webkit-slider-runnable-track {
		height: 8px; border-radius: 999px;
		border: 1px solid color-mix(in srgb, var(--cream) 16%, transparent);
		background: linear-gradient(90deg, var(--rose) var(--fill), #12040f var(--fill));
		box-shadow: inset 0 1px 3px #000;
	}
	.vol input::-moz-range-track {
		height: 8px; border-radius: 999px;
		border: 1px solid color-mix(in srgb, var(--cream) 16%, transparent);
		background: linear-gradient(90deg, var(--rose) var(--fill), #12040f var(--fill));
	}
	.vol input::-webkit-slider-thumb {
		-webkit-appearance: none;
		width: 17px; height: 17px; margin-top: -6px; border-radius: 50%;
		background: linear-gradient(180deg, #fffaff, #d9bdd0);
		box-shadow: 0 2px 4px #000a;
	}
	.vol input::-moz-range-thumb {
		width: 17px; height: 17px; border: 0; border-radius: 50%;
		background: linear-gradient(180deg, #fffaff, #d9bdd0);
		box-shadow: 0 2px 4px #000a;
	}
	.vol input:focus-visible { outline: 2px solid var(--rose); outline-offset: 4px; }

	/* ── the dock ── */
	.dock {
		position: fixed;
		top: clamp(0.9rem, 3vw, 1.6rem);
		right: clamp(0.9rem, 3vw, 1.6rem);
		display: flex;
		gap: 0.5rem;
		z-index: 5;
	}

	.chip {
		display: inline-flex;
		align-items: center;
		gap: 0.45rem;
		padding: 0.5rem 0.8rem;
		border-radius: 999px;
		text-decoration: none;
		font-family: 'Big Shoulders Display', ui-sans-serif, sans-serif;
		font-weight: 500;
		font-size: 0.9rem;
		letter-spacing: 0.14em;
		text-transform: uppercase;
		color: color-mix(in srgb, var(--cream) 68%, transparent);
		background: color-mix(in srgb, var(--slab) 80%, transparent);
		border: 1px solid color-mix(in srgb, var(--cream) 16%, transparent);
		backdrop-filter: blur(8px);
		cursor: pointer;
		transition: color 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, transform 0.1s ease;
	}
	.chip svg { width: 18px; height: 18px; flex: none; }
	.chip:active { transform: translateY(1px); }
	.chip:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }

	.chip.tip:hover, .chip.tip:focus-visible {
		color: var(--rose); border-color: var(--rose);
		box-shadow: 0 0 20px -6px var(--rose);
	}
	.chip.arcade:hover, .chip.arcade:focus-visible {
		color: var(--lilac); border-color: var(--lilac);
		box-shadow: 0 0 20px -6px var(--lilac);
	}

	.fallback {
		position: fixed; inset: 0; display: none; place-items: center;
		text-align: center; padding: 2rem; line-height: 1.6;
	}

	@media (max-width: 620px) {
		.chip span { display: none; }
		.chip { padding: 0.6rem; }
	}

	@media (max-width: 480px) {
		.console { gap: 0.35rem; padding: 0.6rem 0.7rem; }
		.throw { width: 46px; }
		.switch[aria-pressed="true"] .knob { transform: translateX(19px); }
		.label { font-size: 0.8rem; letter-spacing: 0.1em; }
		.standfirst { display: none; }
		.vol input { width: 58px; }
	}

	@media (prefers-reduced-motion: reduce) {
		.knob { transition: none; }
	}
</style>
</head>

<div id="stage"></div>

<nav class="dock" aria-label="Elsewhere">
	<a class="chip tip" href="https://ko-fi.com/magickmica/tip" target="_blank" rel="noopener noreferrer" title="Leave a tip on Ko-fi">
		<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true">
			<path d="M12 2.8l2.85 5.9 6.4.95-4.63 4.55 1.1 6.4L12 17.55 6.28 20.6l1.1-6.4L2.75 9.65l6.4-.95z" />
		</svg>
		<span>Tip</span>
	</a>
	<a class="chip arcade" href="https://magickmica.github.io/arcade.html" target="_blank" rel="noopener noreferrer" title="Go to the Arcade">
		<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
			<rect x="2.4" y="7.4" width="19.2" height="9.2" rx="4.6" />
			<path d="M7 10.6v2.8M5.6 12h2.8" />
			<circle cx="16.1" cy="11.2" r="0.95" fill="currentColor" stroke="none" />
			<circle cx="18.3" cy="13.4" r="0.95" fill="currentColor" stroke="none" />
		</svg>
		<span>Arcade</span>
	</a>
</nav>

<div class="overlay">
	<header class="masthead">
		<h1 class="title">Wand</h1>
		<p class="standfirst">It follows you. Move it fast — the trail and the notes both answer to speed. Click to cast.</p>
	</header>

	<div class="console" role="group" aria-label="Wand controls">
		<button class="switch" id="sw-trail" aria-pressed="true">
			<span class="throw"><span class="knob"></span></span>
			<span class="label">Trail</span>
		</button>
		<button class="switch" id="sw-glitter" aria-pressed="true">
			<span class="throw"><span class="knob"></span></span>
			<span class="label">Glitter</span>
		</button>
		<button class="switch" id="sw-sound" aria-pressed="false">
			<span class="throw"><span class="knob"></span></span>
			<span class="label">Sound</span>
		</button>
		<div class="vol">
			<input type="range" id="vol" min="0" max="100" value="75" style="--fill: 75%" aria-label="Volume" />
			<span class="label">Volume</span>
		</div>
		<button class="switch press" id="btn-cast">
			<span class="throw"><span class="dot"></span></span>
			<span class="label">Cast</span>
		</button>
	</div>
</div>

<div class="fallback" id="fallback">
	<p>This browser can't run WebGL, so there's no magic to be had.<br />
	Try opening the file in Chrome, Firefox, or Safari.</p>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.184.0/build/three.module.js" } }

<script type="module">
import * as THREE from 'three';

const TWO_PI = Math.PI * 2;
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ══ THE SPARKLE ══════════════════════════════════════════════════════════
   This shader is the whole page. Round dots are dust; what makes something
   read as GLITTER is the four-point glint — a bright core with streaks
   shooting off it, the way a real facet throws light in a camera. It's
   drawn per-pixel in the fragment shader rather than sampled from an image,
   so it stays razor sharp at any size and every particle can be rotated to
   its own angle. A sprite sheet would be blurry and all face the same way.

   Each particle also twinkles on its own clock, because facets catch the
   light as they tumble. Uniform brightness is the tell of fake glitter.
*/
const SPARKLE_VERT = `
	attribute float aLife;
	attribute float aSize;
	attribute float aSpin;
	attribute float aHue;
	uniform float uPixel;
	uniform float uTime;
	varying float vLife;
	varying float vSpin;
	varying float vHue;
	varying float vSeed;
	void main() {
		vLife = aLife;
		vHue = aHue;
		vSeed = aSpin;
		vSpin = aSpin * 6.283 + uTime * (0.6 + aSpin * 2.2);
		vec4 mv = modelViewMatrix * vec4(position, 1.0);
		// a quick flare as it's born, then a long fade
		float grow = smoothstep(1.0, 0.86, aLife);
		float s = aSize * mix(0.35, 1.0, aLife) * mix(0.4, 1.0, grow);
		gl_PointSize = s * uPixel * (300.0 / -mv.z) * step(0.0005, aLife);
		gl_Position = projectionMatrix * mv;
	}
`;

const SPARKLE_FRAG = `
	uniform float uTime;
	varying float vLife;
	varying float vSpin;
	varying float vHue;
	varying float vSeed;

	vec3 pal(float h) {
		vec3 rose  = vec3(1.00, 0.37, 0.66);
		vec3 lilac = vec3(0.77, 0.55, 1.00);
		vec3 gold  = vec3(1.00, 0.85, 0.63);
		vec3 white = vec3(1.00, 0.96, 1.00);
		if (h < 0.34) return mix(rose, lilac, h / 0.34);
		if (h < 0.70) return mix(lilac, gold, (h - 0.34) / 0.36);
		return mix(gold, white, (h - 0.70) / 0.30);
	}

	void main() {
		vec2 p = gl_PointCoord * 2.0 - 1.0;
		float c = cos(vSpin), s = sin(vSpin);
		p = vec2(p.x * c - p.y * s, p.x * s + p.y * c);
		float r = length(p);
		if (r > 1.0) discard;

		float core = exp(-r * r * 11.0);
		// two crossed streaks: tight across, loose along
		float sx = exp(-abs(p.x) * 17.0) * exp(-abs(p.y) * 2.3);
		float sy = exp(-abs(p.y) * 17.0) * exp(-abs(p.x) * 2.3);
		// and the diagonals, softer, for the eight-point twinkle
		float d1 = exp(-abs(p.x - p.y) * 24.0) * exp(-abs(p.x + p.y) * 3.2);
		float d2 = exp(-abs(p.x + p.y) * 24.0) * exp(-abs(p.x - p.y) * 3.2);

		float a = core + (sx + sy) * 0.62 + (d1 + d2) * 0.2;
		a *= smoothstep(1.0, 0.15, r);

		float twinkle = 0.55 + 0.45 * sin(uTime * (4.0 + vSeed * 13.0) + vSeed * 44.0);
		vec3 col = pal(vHue) + core * 0.5;      // hot white centre
		gl_FragColor = vec4(col, a * vLife * twinkle * 0.9);
	}
`;

const sparkleMaterial = (uniforms) => new THREE.ShaderMaterial({
	uniforms,
	vertexShader: SPARKLE_VERT,
	fragmentShader: SPARKLE_FRAG,
	transparent: true,
	depthWrite: false,
	blending: THREE.AdditiveBlending,
});

/* ── the trail ──
   A ring-buffer particle pool. Unlike the fire, these can't be derived from
   a formula: they spawn wherever the wand happened to be, which the GPU has
   no way to know. So positions live on the CPU and get uploaded each frame.
   The pool is fixed and reused from oldest to newest, which means no
   allocation while you're waving it around.
*/
function buildTrail(max = 2400) {
	const pos = new Float32Array(max * 3);
	const vel = new Float32Array(max * 3);
	const life = new Float32Array(max);
	const span = new Float32Array(max);
	const aLife = new Float32Array(max);
	const aSize = new Float32Array(max);
	const aSpin = new Float32Array(max);
	const aHue = new Float32Array(max);
	let head = 0;

	const geo = new THREE.BufferGeometry();
	geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
	geo.setAttribute('aLife', new THREE.BufferAttribute(aLife, 1));
	geo.setAttribute('aSize', new THREE.BufferAttribute(aSize, 1));
	geo.setAttribute('aSpin', new THREE.BufferAttribute(aSpin, 1));
	geo.setAttribute('aHue', new THREE.BufferAttribute(aHue, 1));
	geo.setDrawRange(0, max);
	geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 40);

	return {
		geo,
		spawn(n, x, y, z, spread, speed, sizeScale = 1) {
			for (let i = 0; i < n; i++) {
				const k = head;
				head = (head + 1) % max;
				const a = Math.random() * TWO_PI;
				const b = Math.acos(2 * Math.random() - 1);
				pos[k * 3] = x + (Math.random() - 0.5) * spread;
				pos[k * 3 + 1] = y + (Math.random() - 0.5) * spread;
				pos[k * 3 + 2] = z + (Math.random() - 0.5) * spread * 0.6;
				const sp = speed * (0.25 + Math.random() * 0.75);
				vel[k * 3] = Math.sin(b) * Math.cos(a) * sp;
				vel[k * 3 + 1] = Math.cos(b) * sp + 0.25;
				vel[k * 3 + 2] = Math.sin(b) * Math.sin(a) * sp * 0.6;
				span[k] = 0.8 + Math.random() * 1.5;
				life[k] = span[k];
				aSize[k] = (2.2 + Math.random() * 5.5) * sizeScale;
				aSpin[k] = Math.random();
				// mostly rose and lilac, with gold and white as the rarer
				// highlights — an even spread across the ramp turns muddy
				aHue[k] = Math.pow(Math.random(), 1.7);
			}
		},
		step(dt) {
			for (let i = 0; i < max; i++) {
				if (life[i] <= 0) { aLife[i] = 0; continue; }
				life[i] -= dt;
				const j = i * 3;
				pos[j] += vel[j] * dt;
				pos[j + 1] += vel[j + 1] * dt;
				pos[j + 2] += vel[j + 2] * dt;
				vel[j + 1] -= 0.85 * dt;          // a little gravity, so it settles
				const drag = Math.pow(0.24, dt);   // and a lot of drag, so it hangs
				vel[j] *= drag; vel[j + 1] *= drag; vel[j + 2] *= drag;
				aLife[i] = Math.max(0, life[i] / span[i]);
			}
			geo.attributes.position.needsUpdate = true;
			geo.attributes.aLife.needsUpdate = true;
			geo.attributes.aSize.needsUpdate = true;
			geo.attributes.aSpin.needsUpdate = true;
			geo.attributes.aHue.needsUpdate = true;
		},
	};
}

// Ambient glitter hanging in the air. Pure formula, no CPU work: each mote
// drifts on its own slow loop derived from its seed.
function buildAmbient(count = 420) {
	const pos = new Float32Array(count * 3);
	const aLife = new Float32Array(count);
	const aSize = new Float32Array(count);
	const aSpin = new Float32Array(count);
	const aHue = new Float32Array(count);
	for (let i = 0; i < count; i++) {
		pos[i * 3] = (Math.random() - 0.5) * 15;
		pos[i * 3 + 1] = (Math.random() - 0.5) * 9;
		pos[i * 3 + 2] = (Math.random() - 0.5) * 7 - 1.5;
		aLife[i] = 0.4 + Math.random() * 0.5;
		aSize[i] = 1.1 + Math.random() * 2.6;
		aSpin[i] = Math.random();
		aHue[i] = Math.pow(Math.random(), 1.5);
	}
	const geo = new THREE.BufferGeometry();
	geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
	geo.setAttribute('aLife', new THREE.BufferAttribute(aLife, 1));
	geo.setAttribute('aSize', new THREE.BufferAttribute(aSize, 1));
	geo.setAttribute('aSpin', new THREE.BufferAttribute(aSpin, 1));
	geo.setAttribute('aHue', new THREE.BufferAttribute(aHue, 1));
	return { geo, pos, count };
}

/* ══ THE WAND ═════════════════════════════════════════════════════════════ */

const starShape = (points, outer, inner) => {
	const s = new THREE.Shape();
	for (let i = 0; i < points * 2; i++) {
		const r = (i % 2) ? inner : outer;
		const a = (i / (points * 2)) * TWO_PI - Math.PI / 2;
		const x = Math.cos(a) * r, y = Math.sin(a) * r;
		if (i === 0) s.moveTo(x, y); else s.lineTo(x, y);
	}
	s.closePath();
	return s;
};

const TIP_Y = 1.32;    // where the star sits, in wand-local space

function buildWand() {
	const wand = new THREE.Group();

	// handle: a lathe, so the taper is a curve rather than a stack of cones
	const profile = new THREE.CatmullRomCurve3([
		new THREE.Vector3(0.001, -1.18, 0),
		new THREE.Vector3(0.085, -1.12, 0),
		new THREE.Vector3(0.095, -0.96, 0),
		new THREE.Vector3(0.062, -0.78, 0),
		new THREE.Vector3(0.055, -0.1, 0),
		new THREE.Vector3(0.042, 0.62, 0),
		new THREE.Vector3(0.030, 1.06, 0),
		new THREE.Vector3(0.020, 1.14, 0),
	]).getPoints(60).map((p) => new THREE.Vector2(Math.max(p.x, 0.001), p.y));

	const lacquer = new THREE.MeshPhysicalMaterial({
		color: 0x2c0a30, roughness: 0.16, metalness: 0.12,
		clearcoat: 1, clearcoatRoughness: 0.06,
	});
	wand.add(new THREE.Mesh(new THREE.LatheGeometry(profile, 64), lacquer));

	const roseGold = new THREE.MeshStandardMaterial({ color: 0xe8a9a2, metalness: 1, roughness: 0.2 });
	for (const [y, r] of [[-0.78, 0.064], [0.64, 0.045]]) {
		const ring = new THREE.Mesh(new THREE.TorusGeometry(r, 0.014, 14, 60), roseGold);
		ring.rotation.x = Math.PI / 2;
		ring.position.y = y;
		wand.add(ring);
	}

	// the star: a 2D star extruded with a bevel, which is what gives it
	// facets to catch light on instead of a flat cutout
	const starGeo = new THREE.ExtrudeGeometry(starShape(5, 0.23, 0.098), {
		depth: 0.055, bevelEnabled: true, bevelSize: 0.032, bevelThickness: 0.03,
		bevelSegments: 3, curveSegments: 6,
	});
	starGeo.center();
	const starMat = new THREE.MeshStandardMaterial({
		color: 0xffe6f4, emissive: 0xff4f9e, emissiveIntensity: 2.4,
		metalness: 0.45, roughness: 0.16,
	});
	const star = new THREE.Mesh(starGeo, starMat);
	star.position.y = TIP_Y - 0.12;
	wand.add(star);

	// halo — a soft disc behind the star, standing in for a bloom pass
	const c = document.createElement('canvas');
	c.width = c.height = 256;
	const g = c.getContext('2d');
	const gr = g.createRadialGradient(128, 128, 4, 128, 128, 126);
	gr.addColorStop(0, 'rgba(255,220,240,0.95)');
	gr.addColorStop(0.35, 'rgba(255,95,168,0.42)');
	gr.addColorStop(1, 'rgba(255,95,168,0)');
	g.fillStyle = gr;
	g.fillRect(0, 0, 256, 256);
	const halo = new THREE.Mesh(
		new THREE.PlaneGeometry(1.5, 1.5),
		new THREE.MeshBasicMaterial({
			map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false,
			blending: THREE.AdditiveBlending, toneMapped: false,
		}),
	);
	halo.position.y = TIP_Y - 0.12;
	halo.position.z = -0.06;
	wand.add(halo);

	return { wand, star, starMat, halo };
}

const buildLightRoom = () => {
	const room = new THREE.Scene();
	room.background = new THREE.Color(0x2a0c2e);
	const c = document.createElement('canvas');
	c.width = c.height = 256;
	const ctx = c.getContext('2d');
	const grad = ctx.createRadialGradient(128, 128, 24, 128, 128, 128);
	grad.addColorStop(0, '#ffffff');
	grad.addColorStop(1, '#000000');
	ctx.fillStyle = grad;
	ctx.fillRect(0, 0, 256, 256);
	const tex = new THREE.CanvasTexture(c);
	const panel = (w, h, x, y, z, intensity, tint) => {
		const m = new THREE.Mesh(
			new THREE.PlaneGeometry(w, h),
			new THREE.MeshBasicMaterial({
				map: tex, color: new THREE.Color(tint).multiplyScalar(intensity), side: THREE.DoubleSide,
			}),
		);
		m.position.set(x, y, z);
		m.lookAt(0, 0, 0);
		room.add(m);
	};
	panel(9, 6, -5, 5, 5, 2.2, 0xffd6ea);   // key, warm pink
	panel(7, 5, 6, 1, 4, 1.1, 0xc9a6ff);    // fill, lilac
	panel(9, 3, 0, 5, -6, 1.6, 0xffe9c4);   // rim, gold
	return room;
};

/* ══ SOUND ════════════════════════════════════════════════════════════════
   Two deliberate choices, both aimed at NOT sounding like the other pages.

   1. FM, not additive. Each note is one sine modulating another at an
      inharmonic ratio (2.83), with the modulation depth collapsing as it
      decays. That collapse is the sound of struck glass: bright and complex
      at the attack, pure and simple by the tail. Stacking fixed partials —
      what the treasure chest does — can't do that, because there the
      brightness never changes.

   2. WHOLE TONE. Every note comes from a scale of nothing but whole steps,
      which has no leading tone and no home, so it never resolves and never
      settles. That rootlessness is the classic dream-sequence sound, and
      it's a completely different flavour of "magic" from the chest's
      pentatonic, which is bright but firmly grounded.

   The pitch you hear tracks how fast you're moving the wand.
*/
const Sfx = (() => {
	let ctx = null, master = null, bus = null, shimmer = null, noiseBuf = null;
	let on = false, vol = 0.75, lastGlint = 0;

	// whole-tone, four octaves
	const WT = [];
	for (let oct = 0; oct < 4; oct++) {
		[261.63, 293.66, 329.63, 369.99, 415.30, 466.16].forEach((f) => WT.push(f * Math.pow(2, oct)));
	}

	const impulse = (seconds, decay) => {
		const len = Math.floor(ctx.sampleRate * seconds);
		const buf = ctx.createBuffer(2, len, ctx.sampleRate);
		for (let ch = 0; ch < 2; ch++) {
			const d = buf.getChannelData(ch);
			for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
		}
		return buf;
	};

	const init = () => {
		if (ctx) return;
		ctx = new (window.AudioContext || window.webkitAudioContext)();
		master = ctx.createGain();
		master.gain.value = 0;
		master.connect(ctx.destination);

		bus = ctx.createGain();
		bus.connect(master);
		const conv = ctx.createConvolver();
		conv.buffer = impulse(3.2, 2.2);
		// highpass on the WET only, so the tail stays glassy instead of
		// turning into a low wash behind everything
		const hp = ctx.createBiquadFilter();
		hp.type = 'highpass';
		hp.frequency.value = 600;
		const wet = ctx.createGain();
		wet.gain.value = 0.62;
		bus.connect(conv).connect(hp).connect(wet).connect(master);

		noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
		const d = noiseBuf.getChannelData(0);
		for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

		// a barely-there air chord, so silence still feels charged
		shimmer = ctx.createGain();
		shimmer.gain.value = 0.03;
		shimmer.connect(bus);
		[1046.5, 1318.5, 1661.2].forEach((f, i) => {
			const o = ctx.createOscillator();
			o.type = 'sine';
			o.frequency.value = f;
			const g = ctx.createGain();
			g.gain.value = 0.16;
			const sw = ctx.createOscillator();
			sw.frequency.value = 0.053 + i * 0.021;
			const amt = ctx.createGain();
			amt.gain.value = 0.13;
			sw.connect(amt).connect(g.gain);
			sw.start();
			o.connect(g).connect(shimmer);
			o.start();
		});
	};

	// one struck glass note: FM with a collapsing modulation index
	const glint = (f, t, dur, gain) => {
		const car = ctx.createOscillator();
		car.type = 'sine';
		car.frequency.value = f;
		const mod = ctx.createOscillator();
		mod.type = 'sine';
		mod.frequency.value = f * 2.83;
		const idx = ctx.createGain();
		idx.gain.setValueAtTime(f * 1.9, t);
		idx.gain.exponentialRampToValueAtTime(f * 0.02, t + dur * 0.55);
		mod.connect(idx).connect(car.frequency);
		const g = ctx.createGain();
		g.gain.setValueAtTime(0.0001, t);
		g.gain.exponentialRampToValueAtTime(gain, t + 0.006);
		g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
		car.connect(g).connect(bus);
		car.start(t); mod.start(t);
		car.stop(t + dur + 0.05); mod.stop(t + dur + 0.05);
	};

	const air = (dur, from, to, gain) => {
		const src = ctx.createBufferSource();
		src.buffer = noiseBuf;
		const f = ctx.createBiquadFilter();
		f.type = 'bandpass';
		f.frequency.setValueAtTime(from, ctx.currentTime);
		f.frequency.exponentialRampToValueAtTime(to, ctx.currentTime + dur * 0.85);
		f.Q.value = 1.6;
		const g = ctx.createGain();
		g.gain.setValueAtTime(0.0001, ctx.currentTime);
		g.gain.exponentialRampToValueAtTime(gain, ctx.currentTime + dur * 0.4);
		g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
		src.connect(f).connect(g).connect(bus);
		src.start();
		src.stop(ctx.currentTime + dur + 0.05);
	};

	return {
		wake() { init(); if (ctx.state === 'suspended') ctx.resume(); },
		setOn(v) {
			on = v;
			if (!ctx) return;
			master.gain.cancelScheduledValues(ctx.currentTime);
			master.gain.setTargetAtTime(v ? vol : 0, ctx.currentTime, 0.3);
		},
		setVolume(v) {
			vol = v;
			if (ctx && on) master.gain.setTargetAtTime(vol, ctx.currentTime, 0.08);
		},

		// Notes triggered by the wand's speed. Faster means higher and more
		// frequent, so waving it is playing it. Rate-limited, or a fast
		// flick would stack a hundred voices and clip.
		wave(speed) {
			if (!ctx || !on) return;
			const now = ctx.currentTime;
			if (now - lastGlint < 0.055) return;
			lastGlint = now;
			const lo = Math.floor(6 + speed * 9);
			const hi = Math.min(WT.length - 1, lo + 7);
			const f = WT[lo + Math.floor(Math.random() * (hi - lo))];
			glint(f, now, 1.1 + Math.random() * 0.9, 0.035 + speed * 0.05);
		},

		// a run up the scale, a chord left ringing, and air moving
		cast() {
			if (!ctx) return;
			const t0 = ctx.currentTime;
			for (let i = 0; i < 9; i++) {
				glint(WT[9 + i * 2], t0 + i * 0.055, 2.4 - i * 0.1, 0.11 - i * 0.006);
			}
			[WT[6], WT[8], WT[10], WT[14]].forEach((f, i) => glint(f, t0 + 0.5 + i * 0.02, 3.6, 0.06));
			air(1.3, 700, 6500, 0.06);
		},

		click() { if (ctx) glint(WT[18], ctx.currentTime, 0.6, 0.05); },
	};
})();

/* ══ SCENE ═══════════════════════════════════════════════════════════════ */

const mount = document.getElementById('stage');
let renderer;
try {
	renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
} catch (err) {
	document.getElementById('fallback').style.display = 'grid';
	mount.style.display = 'none';
	throw err;
}

const DPR = Math.min(window.devicePixelRatio, 2);
renderer.setPixelRatio(DPR);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
mount.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 8.2);
camera.lookAt(0, 0, 0);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(buildLightRoom(), 0.05).texture;

scene.add(new THREE.AmbientLight(0x6b3a66, 0.6));
const keyLight = new THREE.DirectionalLight(0xffd6ea, 1.1);
keyLight.position.set(-4, 5, 6);
scene.add(keyLight);
const tipLight = new THREE.PointLight(0xff5fa8, 5, 7, 2);
scene.add(tipLight);

const shared = { uTime: { value: 0 }, uPixel: { value: DPR } };

const { wand, starMat, halo } = buildWand();
scene.add(wand);

const trail = buildTrail();
const trailPoints = new THREE.Points(trail.geo, sparkleMaterial(shared));
trailPoints.frustumCulled = false;
scene.add(trailPoints);

const ambient = buildAmbient();
const ambientPoints = new THREE.Points(ambient.geo, sparkleMaterial(shared));
scene.add(ambientPoints);

/* ── the wand follows the pointer ──
   The pointer is unprojected onto the z = 0 plane, and the wand's TIP is
   placed there — not its base — so the star lands exactly under the cursor.
   The follow is eased rather than snapped, which is what gives it weight
   and lets the trail lag behind into a curve.
*/
const TILT = new THREE.Quaternion().setFromEuler(new THREE.Euler(0.12, 0, 0.52));
const AXIS = new THREE.Vector3(0, 1, 0).applyQuaternion(TILT);
wand.quaternion.copy(TILT);

const pointer = new THREE.Vector2(0, 0);
const aim = new THREE.Vector3(0, 0.4, 0);
const tip = new THREE.Vector3(0, 0.4, 0);
const prevTip = new THREE.Vector3();
let speed = 0;
let hasPointer = false;

const toWorld = (cx, cy) => {
	const v = new THREE.Vector3(
		(cx / window.innerWidth) * 2 - 1,
		-(cy / window.innerHeight) * 2 + 1,
		0.5,
	).unproject(camera);
	const dir = v.sub(camera.position).normalize();
	return camera.position.clone().addScaledVector(dir, -camera.position.z / dir.z);
};

const onPointer = (e) => {
	hasPointer = true;
	pointer.set(e.clientX, e.clientY);
	aim.copy(toWorld(e.clientX, e.clientY));
};
window.addEventListener('pointermove', onPointer, { passive: true });

mount.addEventListener('pointerdown', (e) => {
	onPointer(e);
	Sfx.wake();
	Sfx.cast();
	burst();
});

window.addEventListener('resize', () => {
	camera.aspect = window.innerWidth / window.innerHeight;
	camera.updateProjectionMatrix();
	renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ── state ── */
const state = { trail: true, glitter: true, sound: false };
let castGlow = 0;

function burst() {
	castGlow = 1;
	if (state.trail) trail.spawn(220, tip.x, tip.y, tip.z, 0.16, 3.4, 1.35);
}

document.getElementById('sw-trail').addEventListener('click', () => {
	Sfx.wake(); Sfx.click();
	state.trail = !state.trail;
	document.getElementById('sw-trail').setAttribute('aria-pressed', String(state.trail));
});
document.getElementById('sw-glitter').addEventListener('click', () => {
	Sfx.wake(); Sfx.click();
	state.glitter = !state.glitter;
	ambientPoints.visible = state.glitter;
	document.getElementById('sw-glitter').setAttribute('aria-pressed', String(state.glitter));
});
document.getElementById('sw-sound').addEventListener('click', () => {
	Sfx.wake(); Sfx.click();
	state.sound = !state.sound;
	document.getElementById('sw-sound').setAttribute('aria-pressed', String(state.sound));
	Sfx.setOn(state.sound);
});

const volEl = document.getElementById('vol');
const applyVol = () => {
	volEl.style.setProperty('--fill', volEl.value + '%');
	Sfx.setVolume((volEl.value / 100) * 0.95);
};
volEl.addEventListener('input', applyVol);
applyVol();

const castBtn = document.getElementById('btn-cast');
castBtn.addEventListener('click', () => {
	Sfx.wake();
	Sfx.cast();
	burst();
	castBtn.classList.add('lit');
	setTimeout(() => castBtn.classList.remove('lit'), 900);
});

/* ── frame ══════════════════════════════════════════════════════════════ */
const clock = new THREE.Clock();
let t = 0;
const ambPos = ambient.pos;
const ambBase = Float32Array.from(ambPos);

const frame = () => {
	requestAnimationFrame(frame);
	const dt = Math.min(clock.getDelta(), 0.05);
	t += dt;
	shared.uTime.value = t;

	// idle: the wand drifts in a slow figure so the page is alive before
	// you've touched it
	if (!hasPointer) {
		aim.set(Math.sin(t * 0.5) * 2.2, 0.5 + Math.sin(t * 0.83) * 1.1, 0);
	}

	prevTip.copy(tip);
	tip.lerp(aim, reduce ? 1 : Math.min(1, dt * 7.5));
	speed = Math.min(1, prevTip.distanceTo(tip) / dt / 14);

	// place the wand so its TIP lands on the target, then lean it into the
	// direction of travel — a wand that stays bolt upright looks dragged
	wand.position.copy(tip).addScaledVector(AXIS, -(TIP_Y - 0.12));
	const lean = (tip.x - prevTip.x) * 3.4;
	wand.quaternion.copy(TILT);
	wand.rotateZ(THREE.MathUtils.clamp(-lean, -0.5, 0.5));
	wand.rotateY(Math.sin(t * 1.3) * 0.25);

	tipLight.position.copy(tip);
	tipLight.intensity = 4.5 + speed * 5 + castGlow * 9;
	halo.scale.setScalar(1 + speed * 0.45 + castGlow * 1.1);
	halo.quaternion.copy(camera.quaternion).premultiply(wand.quaternion.clone().invert());
	starMat.emissiveIntensity = 2.2 + speed * 2.2 + castGlow * 4;
	castGlow *= Math.pow(0.12, dt);

	// spawn rate follows speed, so a flick throws a spray and holding still
	// only drips. There's always a trickle, so the wand is never dead.
	if (state.trail && !reduce) {
		const n = Math.round(1 + speed * 13);
		trail.spawn(n, tip.x, tip.y, tip.z, 0.1 + speed * 0.16, 0.5 + speed * 1.9);
		if (speed > 0.06) Sfx.wave(speed);
	}
	trail.step(reduce ? 0 : dt);

	// ambient motes: a slow drift plus a bob, each on its own phase
	if (state.glitter && !reduce) {
		for (let i = 0; i < ambient.count; i++) {
			const j = i * 3;
			ambPos[j] = ambBase[j] + Math.sin(t * 0.25 + i) * 0.28;
			ambPos[j + 1] = ambBase[j + 1] + Math.sin(t * 0.19 + i * 1.7) * 0.34;
		}
		ambient.geo.attributes.position.needsUpdate = true;
	}

	renderer.render(scene, camera);
};

frame();
</script>
