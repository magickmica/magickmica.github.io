<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Hollow House &middot; MagickMica</title>
<meta name="description" content="Find three sigil keys and escape before the lantern dies. Something else is in here.">
<meta property="og:title" content="The Hollow House &middot; MagickMica">
<meta property="og:description" content="Three keys. One lantern. Something walking the halls.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Spectral:ital,wght@0,300;1,300&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --void:#06050c;--deep:#120b1e;--plum:#1e1230;
  --candle:#ffb84d;--candle-lit:#ffe0a8;
  --ghost:#7fe3ff;--blood:#c0392b;--moss:#5fae7a;
  --bone:#ded5e8;--dim:#77708f;--line:rgba(222,213,232,.13);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;padding:0 0 54px;background:var(--void);color:var(--bone);
  font-family:"Spectral",Georgia,serif;font-weight:300;font-size:16px;line-height:1.6;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(105% 60% at 50% -14%, #241537 0%, transparent 60%),
    radial-gradient(70% 44% at 84% 108%, #2a1020 0%, transparent 62%);
  opacity:.9;
}
a{color:var(--ghost)}
button:focus-visible{outline:2px solid var(--candle);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 15px}

header{text-align:center;padding:28px 0 6px}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.3em;
  text-transform:uppercase;color:var(--dim);margin:0 0 10px}
h1{
  font-family:"Cinzel",Georgia,serif;font-weight:700;letter-spacing:.09em;
  font-size:clamp(23px,6vw,38px);margin:0;color:var(--candle-lit);
  text-shadow:0 0 26px rgba(255,184,77,.4),0 0 60px rgba(255,184,77,.18);
}
.tagline{text-align:center;font-style:italic;color:var(--dim);font-size:14px;margin:8px 0 0}

/* ---------------------------------------------------------- hud */
.hud{
  display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:20px 0 12px;
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;
}
.stat{
  border:1px solid var(--line);border-radius:999px;padding:7px 13px;
  background:rgba(30,18,48,.5);white-space:nowrap;
}
.stat b{font-weight:500}
.stat.oil b{color:var(--candle)}
.stat.keys b{color:var(--moss)}
.stat.charm b{color:var(--ghost)}
.stat.dread b{color:var(--blood)}

.wick{display:inline-block;width:56px;height:6px;border-radius:3px;
  background:rgba(255,255,255,.09);vertical-align:middle;margin-left:6px;overflow:hidden}
.wick i{display:block;height:100%;width:100%;
  background:linear-gradient(90deg,var(--blood),var(--candle) 45%,var(--candle-lit));
  transition:width .35s ease}

/* ---------------------------------------------------------- map */
.map{
  display:grid;grid-template-columns:repeat(4,1fr);gap:5px;
  max-width:290px;margin:0 auto 18px;
}
.tile{
  aspect-ratio:1;border-radius:6px;background:#0d0917;
  border:1px solid rgba(222,213,232,.07);
  display:grid;place-items:center;font-size:15px;line-height:1;
  color:var(--dim);transition:background .25s,border-color .25s;
}
.tile[data-seen="true"]{background:var(--plum);border-color:rgba(222,213,232,.16)}
.tile[data-here="true"]{
  background:radial-gradient(circle,rgba(255,184,77,.34),var(--plum) 72%);
  border-color:var(--candle);box-shadow:0 0 16px rgba(255,184,77,.45);
}
.tile[data-near="true"]{border-color:rgba(192,57,43,.6)}

/* ---------------------------------------------------------- room */
.room{
  border:1px solid var(--line);border-radius:13px;padding:17px;
  background:rgba(18,11,30,.72);min-height:172px;
}
.room h2{
  font-family:"Cinzel",Georgia,serif;font-weight:500;font-size:17px;letter-spacing:.07em;
  margin:0 0 9px;color:var(--candle-lit);
}
.room p{margin:0 0 10px}
.found{
  font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.06em;
  color:var(--moss);margin:0;
}
.omen{color:var(--blood);font-style:italic}

/* ---------------------------------------------------------- controls */
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:7px;justify-content:center;margin:18px 0 0}
.pad .sp{visibility:hidden}
.btn{
  font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:500;letter-spacing:.1em;
  text-transform:uppercase;color:var(--bone);background:rgba(30,18,48,.8);
  border:1px solid rgba(222,213,232,.24);border-radius:10px;
  padding:14px 0;min-height:50px;cursor:pointer;
  transition:border-color .16s,color .16s,background .16s;
}
.btn:hover:not(:disabled){border-color:var(--candle);color:var(--candle)}
.btn:disabled{opacity:.24;cursor:default}
.acts{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:16px}
.acts .btn{border-radius:999px;padding:12px 18px;min-height:46px}
.btn.warm{
  color:var(--void);border:0;
  background:linear-gradient(96deg,var(--candle),var(--candle-lit) 55%,var(--candle));
}

.log{
  margin:18px 0 0;padding:12px 14px;border:1px solid var(--line);border-radius:11px;
  background:rgba(10,7,18,.6);font-family:"IBM Plex Mono",monospace;
  font-size:12px;line-height:1.75;color:var(--dim);max-height:132px;overflow-y:auto;
}
.log p{margin:0}
.log p.hit{color:var(--blood)}
.log p.good{color:var(--moss)}

/* ---------------------------------------------------------- end */
.veil{
  position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:22px;
  background:rgba(4,3,8,.92);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
}
.veil[data-on="true"]{display:grid}
.veil .card{
  max-width:400px;text-align:center;border:1px solid var(--line);border-radius:15px;
  padding:28px 22px;background:var(--deep);
}
.veil h2{font-family:"Cinzel",serif;font-size:24px;letter-spacing:.08em;margin:0 0 12px}
.veil.win h2{color:var(--candle-lit)}
.veil.lose h2{color:var(--blood)}
.veil p{margin:0 0 18px;font-style:italic}
.tiny{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--dim);letter-spacing:.08em}

.foot{text-align:center;margin-top:34px;font-family:"IBM Plex Mono",monospace;
  font-size:11px;color:#4f4a66}

@media(max-width:420px){.pad{grid-template-columns:repeat(3,58px)}.map{max-width:256px}}
@media(prefers-reduced-motion:reduce){.tile,.wick i{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <p class="eyebrow">MagickMica</p>
    <h1>THE HOLLOW HOUSE</h1>
    <p class="tagline">Three sigil keys. One lantern. Something else awake.</p>
  </header>

  <div class="hud">
    <span class="stat oil">LANTERN <b id="oil">20</b><span class="wick"><i id="wick"></i></span></span>
    <span class="stat keys">SIGILS <b id="keys">0</b>/3</span>
    <span class="stat charm">CHARMS <b id="charms">0</b></span>
    <span class="stat dread">DREAD <b id="dread">—</b></span>
  </div>

  <div class="map" id="map" aria-label="Map of the house"></div>

  <section class="room">
    <h2 id="roomName">The Entrance Hall</h2>
    <p id="roomText"></p>
    <p class="found" id="roomFound"></p>
  </section>

  <div class="pad">
    <span class="sp"></span>
    <button class="btn" id="n">North</button>
    <span class="sp"></span>
    <button class="btn" id="w">West</button>
    <button class="btn warm" id="act">Search</button>
    <button class="btn" id="e">East</button>
    <span class="sp"></span>
    <button class="btn" id="s">South</button>
    <span class="sp"></span>
  </div>

  <div class="acts">
    <button class="btn" id="ward" disabled>Burn a charm</button>
    <button class="btn" id="restart">New house</button>
  </div>

  <div class="log" id="log" aria-live="polite"></div>

  <p class="foot">arrow keys to move &middot; space to search</p>
</div>

<div class="veil" id="veil">
  <div class="card">
    <h2 id="veilTitle"></h2>
    <p id="veilText"></p>
    <p class="tiny" id="veilStat"></p>
    <button class="btn warm" id="again">Enter another house</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var W = 4, H = 4, START = 12;          // bottom-left room
  var LS = 'mm_hollow_v1';

  var ROOMS = [
    ['The Parlour', 'Dust sheets over furniture that is not quite the right shape underneath.'],
    ['The Library', 'Books shelved spine-inward, so no title can be read.'],
    ['The Nursery', 'A rocking horse still moving. Slightly.'],
    ['The Conservatory', 'Glass fogged from the inside. The plants died facing the door.'],
    ['The Portrait Gallery', 'Every painted face has been turned to look down the hall.'],
    ['The Kitchen', 'Something was prepared here recently. Nothing has been eaten here in years.'],
    ['The Ballroom', 'Scuffs on the floor in the pattern of a waltz. One set of prints.'],
    ['The Cellar Stair', 'It goes down further than the house is tall.'],
    ['The Long Corridor', 'Doors on both sides. They are all the same door.'],
    ['The Music Room', 'The piano lid is open. The keys are worn only in the middle.'],
    ['The Linen Press', 'Sheets folded by someone who kept losing count.'],
    ['The Observatory', 'The telescope points at the floor.'],
    ['The Study', 'A letter, half written, in handwriting that changes halfway.'],
    ['The Chapel', 'Seven pews. Six are dusty.'],
    ['The Bathhouse', 'The water is warm. Nobody has been here for a decade.']
  ];

  var mapEl = document.getElementById('map');
  var oilEl = document.getElementById('oil'), wickEl = document.getElementById('wick');
  var keysEl = document.getElementById('keys'), charmEl = document.getElementById('charms');
  var dreadEl = document.getElementById('dread');
  var nameEl = document.getElementById('roomName'), textEl = document.getElementById('roomText');
  var foundEl = document.getElementById('roomFound'), logEl = document.getElementById('log');
  var wardEl = document.getElementById('ward'), actEl = document.getElementById('act');
  var veil = document.getElementById('veil');

  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var S = null, tiles = [];

  function rnd(n) { return Math.floor(Math.random() * n); }
  function xy(i) { return { x: i % W, y: Math.floor(i / W) }; }
  function dist(a, b) {
    var A = xy(a), B = xy(b);
    return Math.abs(A.x - B.x) + Math.abs(A.y - B.y);
  }

  function log(msg, cls) {
    var p = document.createElement('p');
    if (cls) p.className = cls;
    p.textContent = msg;
    logEl.insertBefore(p, logEl.firstChild);
    while (logEl.children.length > 40) logEl.removeChild(logEl.lastChild);
  }

  /* ------------------------------------------------ build a house */
  function build() {
    var pool = ROOMS.slice();
    for (var i = pool.length - 1; i > 0; i--) {
      var j = rnd(i + 1); var t = pool[i]; pool[i] = pool[j]; pool[j] = t;
    }
    var rooms = [];
    for (var k = 0; k < W * H; k++) {
      rooms.push(k === START
        ? { name: 'The Entrance Hall', text: 'The front door. Locked by three sigils, none of them yours yet.', item: null, searched: true }
        : { name: pool[k % pool.length][0], text: pool[k % pool.length][1], item: null, searched: false });
    }

    // scatter the loot anywhere but the entrance
    var spots = [];
    for (var s = 0; s < W * H; s++) if (s !== START) spots.push(s);
    for (var m = spots.length - 1; m > 0; m--) {
      var q = rnd(m + 1); var u = spots[m]; spots[m] = spots[q]; spots[q] = u;
    }
    var at = 0;
    ['key', 'key', 'key', 'charm', 'charm', 'oil', 'oil', 'oil'].forEach(function (it) {
      rooms[spots[at++]].item = it;
    });

    // the thing starts as far from you as the house allows
    var far = spots.slice().sort(function (a, b) { return dist(b, START) - dist(a, START); })[0];

    S = {
      rooms: rooms, at: START, seen: {}, oil: 20, keys: 0, charms: 1,
      wraith: far, turn: 0, over: false, moves: 0
    };
    S.seen[START] = true;
  }

  /* ------------------------------------------------ map */
  function buildMap() {
    mapEl.textContent = '';
    tiles = [];
    for (var i = 0; i < W * H; i++) {
      var t = document.createElement('div');
      t.className = 'tile';
      mapEl.appendChild(t);
      tiles.push(t);
    }
  }

  function paint() {
    for (var i = 0; i < W * H; i++) {
      var t = tiles[i];
      var seen = !!S.seen[i];
      t.dataset.seen = seen ? 'true' : 'false';
      t.dataset.here = i === S.at ? 'true' : 'false';
      t.dataset.near = (!S.over && dist(i, S.wraith) === 0 && seen) ? 'true' : 'false';
      var mark = '';
      if (i === S.at) mark = '\u2726';
      else if (i === START && seen) mark = '\u2302';
      else if (seen && S.rooms[i].item === 'key') mark = '\u26B7';
      else if (seen && S.rooms[i].item === 'charm') mark = '\u25C7';
      else if (seen && S.rooms[i].item === 'oil') mark = '\u25CF';
      t.textContent = mark;
    }

    oilEl.textContent = S.oil;
    wickEl.style.width = Math.max(0, Math.min(100, S.oil / 20 * 100)) + '%';
    keysEl.textContent = S.keys;
    charmEl.textContent = S.charms;
    wardEl.disabled = S.charms < 1 || S.over;

    var d = dist(S.at, S.wraith);
    dreadEl.textContent = S.over ? '\u2014' : (d === 0 ? 'HERE' : d === 1 ? 'CLOSE' : d <= 2 ? 'NEAR' : 'FAINT');

    var r = S.rooms[S.at];
    nameEl.textContent = r.name;
    textEl.textContent = r.text;

    if (S.at === START) {
      foundEl.textContent = S.keys >= 3
        ? 'The three sigils are burning. The door will open.'
        : 'The door needs ' + (3 - S.keys) + ' more sigil' + (3 - S.keys === 1 ? '' : 's') + '.';
    } else if (!r.searched) {
      foundEl.textContent = 'Unsearched.';
    } else {
      foundEl.textContent = r.item ? 'Something is still here.' : 'Nothing left here.';
    }

    actEl.textContent = (S.at === START && S.keys >= 3) ? 'Open the door' : 'Search';
    actEl.disabled = S.over || (S.at !== START && S.rooms[S.at].searched && !S.rooms[S.at].item);
  }

  /* ------------------------------------------------ the thing */
  function stalk() {
    if (S.over) return;
    S.turn++;
    if (S.turn % 2 !== 0) return;               // it moves every other turn

    // a stalker, not a heat-seeker: mostly toward you, sometimes wandering.
    // Beelining every other turn made the house unwinnable.
    var a = xy(S.wraith), b = xy(S.at);
    if (Math.random() < 0.66) {
      if (a.x !== b.x) { a.x += a.x < b.x ? 1 : -1; }
      else if (a.y !== b.y) { a.y += a.y < b.y ? 1 : -1; }
    } else {
      var dirs = [[1,0],[-1,0],[0,1],[0,-1]];
      var d = dirs[rnd(dirs.length)];
      a.x = Math.max(0, Math.min(W - 1, a.x + d[0]));
      a.y = Math.max(0, Math.min(H - 1, a.y + d[1]));
    }
    S.wraith = a.y * W + a.x;

    if (S.wraith === S.at) { caught(); return; }
    var d = dist(S.at, S.wraith);
    if (d === 1) log('Floorboards, in the next room.', 'hit');
  }

  function caught() {
    if (S.charms > 0) {
      S.charms--;
      log('It reaches you \u2014 a charm burns out in your hand and it recoils.', 'hit');
      // flung back to the far corner
      var best = 0, bd = -1;
      for (var i = 0; i < W * H; i++) { var d = dist(i, S.at); if (d > bd) { bd = d; best = i; } }
      S.wraith = best;
    } else {
      end(false, 'It found you with nothing left to burn.');
    }
  }

  /* ------------------------------------------------ turns */
  function spend(n) {
    S.oil -= n;
    if (S.oil <= 0) { S.oil = 0; end(false, 'The lantern gutters, and the house takes the rest.'); return true; }
    return false;
  }

  function move(dx, dy) {
    if (S.over) return;
    var p = xy(S.at);
    var nx = p.x + dx, ny = p.y + dy;
    if (nx < 0 || nx >= W || ny < 0 || ny >= H) { log('A wall. The house does not go that way.'); return; }
    S.at = ny * W + nx;
    S.seen[S.at] = true;
    S.moves++;
    if (spend(1)) return;
    log('You step into ' + S.rooms[S.at].name.replace(/^The /, 'the ') + '.');
    if (S.at === S.wraith) { caught(); }
    else { stalk(); }
    paint();
  }

  function search() {
    if (S.over) return;
    if (S.at === START && S.keys >= 3) { end(true, 'The sigils burn out and the front door swings wide.'); return; }

    var r = S.rooms[S.at];
    if (r.searched && !r.item) { log('Nothing here but dust.'); return; }
    r.searched = true;
    if (spend(1)) return;

    if (r.item === 'key') { S.keys++; r.item = null; log('A sigil key, warm to the touch. (' + S.keys + '/3)', 'good'); }
    else if (r.item === 'charm') { S.charms++; r.item = null; log('A silver charm. It hums when you hold it.', 'good'); }
    else if (r.item === 'oil') { S.oil = Math.min(30, S.oil + 7); r.item = null; log('A flask of lamp oil. The light steadies.', 'good'); }
    else { log('You search. The house lets you find nothing.'); }

    if (S.at === S.wraith) { caught(); } else { stalk(); }
    paint();
  }

  function ward() {
    if (S.over || S.charms < 1) return;
    S.charms--;
    var best = 0, bd = -1;
    for (var i = 0; i < W * H; i++) { var d = dist(i, S.at); if (d > bd) { bd = d; best = i; } }
    S.wraith = best;
    log('You burn a charm. Whatever it is, it goes away angry.', 'good');
    stalk();
    paint();
  }

  /* ------------------------------------------------ end */
  function best() {
    try { return JSON.parse(localStorage.getItem(LS)) || null; } catch (e) { return null; }
  }
  function saveBest(rec) { try { localStorage.setItem(LS, JSON.stringify(rec)); } catch (e) {} }

  function end(won, why) {
    S.over = true;
    paint();
    veil.className = 'veil ' + (won ? 'win' : 'lose');
    veil.dataset.on = 'true';
    document.getElementById('veilTitle').textContent = won ? 'YOU GET OUT' : 'THE HOUSE KEEPS YOU';
    document.getElementById('veilText').textContent = why;

    var line = won
      ? 'Escaped in ' + S.moves + ' moves with ' + S.oil + ' oil left.'
      : 'You found ' + S.keys + ' of 3 sigils in ' + S.moves + ' moves.';
    if (won) {
      var b = best();
      if (!b || S.moves < b.moves) { saveBest({ moves: S.moves, oil: S.oil }); line += ' A new best.'; }
      else { line += ' Best: ' + b.moves + ' moves.'; }
    }
    document.getElementById('veilStat').textContent = line;
  }

  /* ------------------------------------------------ wiring */
  function reset() {
    build();
    buildMap();
    logEl.textContent = '';
    veil.dataset.on = 'false';
    log('You shut the front door behind you. It clicks.');
    paint();
  }

  document.getElementById('n').addEventListener('click', function () { move(0, -1); });
  document.getElementById('s').addEventListener('click', function () { move(0, 1); });
  document.getElementById('w').addEventListener('click', function () { move(-1, 0); });
  document.getElementById('e').addEventListener('click', function () { move(1, 0); });
  actEl.addEventListener('click', search);
  wardEl.addEventListener('click', ward);
  document.getElementById('restart').addEventListener('click', reset);
  document.getElementById('again').addEventListener('click', reset);

  document.addEventListener('keydown', function (e) {
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    var k = e.key;
    if (k === 'ArrowUp' || k === 'w') { e.preventDefault(); move(0, -1); }
    else if (k === 'ArrowDown' || k === 's') { e.preventDefault(); move(0, 1); }
    else if (k === 'ArrowLeft' || k === 'a') { e.preventDefault(); move(-1, 0); }
    else if (k === 'ArrowRight' || k === 'd') { e.preventDefault(); move(1, 0); }
    else if (e.code === 'Space') { if (tag !== 'button') { e.preventDefault(); search(); } }
  });

  reset();
})();
</script>
<script src="mm-nav.js?v=3" defer></script>
</body>
</html>
