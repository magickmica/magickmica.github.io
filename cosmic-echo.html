<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cosmic Echo &middot; MagickMica</title>
<meta name="description" content="The sky plays a phrase. Play it back. It gets longer.">
<meta property="og:title" content="Cosmic Echo &middot; MagickMica">
<meta property="og:description" content="Watch the lights. Repeat the phrase. How far can you get?">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --void:#07060e;--violet:#a020f0;--magenta:#ff44cc;--gold:#ffd166;--cyan:#22e0ff;
  --mist:#b8b0d4;--dim:#6f6890;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;padding:0 14px 50px;background:var(--void);color:var(--mist);
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:15px;line-height:1.5;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.4;
  background:
    radial-gradient(110% 60% at 50% -12%, #1b1038 0%, transparent 58%),
    radial-gradient(1px 1px at 17% 27%, rgba(255,255,255,.7) 50%, transparent 50%),
    radial-gradient(1px 1px at 69% 49%, rgba(34,224,255,.55) 50%, transparent 50%);
  background-size:auto,200px 200px,200px 200px;
}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:460px;margin:0 auto;text-align:center}

header{padding:26px 0 6px}
.eyebrow{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);margin:0 0 10px}
h1{
  font-family:"Orbitron",sans-serif;font-weight:700;font-size:clamp(20px,5.2vw,30px);
  letter-spacing:.06em;margin:0;color:transparent;
  background:linear-gradient(96deg,var(--violet),var(--magenta) 28%,var(--gold) 58%,var(--cyan) 86%,var(--violet));
  background-size:220% 100%;-webkit-background-clip:text;background-clip:text;
  animation:holo 11s linear infinite;
}
@keyframes holo{to{background-position:220% 0}}

.scores{display:flex;justify-content:center;gap:26px;margin:18px 0 6px}
.sc b{display:block;font-family:"Orbitron",sans-serif;font-size:26px;color:var(--gold);line-height:1.1}
.sc span{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}

.status{min-height:24px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);margin:6px 0 12px}

/* ------------------------------------------------------- pads */
.orb{
  position:relative;width:min(320px,86vw);aspect-ratio:1;margin:0 auto;
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
  padding:10px;border-radius:50%;
  background:radial-gradient(circle,#150e2b,#0a0718);
  box-shadow:0 0 46px rgba(160,32,240,.35), inset 0 0 30px rgba(0,0,0,.7);
}
.pad{
  border:0;cursor:pointer;padding:0;position:relative;
  transition:filter .12s, transform .12s;
  filter:brightness(.42) saturate(.75);
}
.pad:disabled{cursor:default}
.pad[data-lit="true"]{filter:brightness(1.5) saturate(1.3);transform:scale(1.02)}
.pad.p0{background:var(--magenta);border-radius:100% 0 0 0}
.pad.p1{background:var(--cyan);border-radius:0 100% 0 0}
.pad.p2{background:var(--gold);border-radius:0 0 0 100%}
.pad.p3{background:var(--violet);border-radius:0 0 100% 0}

.core{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:31%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 40% 34%, #241543, #0a0718 72%);
  border:1px solid rgba(184,176,212,.2);
  display:grid;place-items:center;
  font-family:"Orbitron",sans-serif;font-weight:700;font-size:12px;
  letter-spacing:.14em;color:var(--mist);text-transform:uppercase;
}

.bar{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.btn{
  font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:500;letter-spacing:.16em;
  text-transform:uppercase;color:var(--void);border:0;border-radius:999px;
  background:linear-gradient(96deg,var(--gold),#ffe9b5 55%,var(--gold));
  padding:13px 24px;min-height:46px;cursor:pointer;
}
.btn.ghost{background:transparent;color:var(--mist);border:1px solid rgba(184,176,212,.3)}
.hint{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#544f70;margin:14px 0 0}

@media(prefers-reduced-motion:reduce){h1{animation:none}.pad{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <p class="eyebrow">MagickMica</p>
    <h1>COSMIC ECHO</h1>
  </header>

  <div class="scores">
    <div class="sc"><b id="round">0</b><span>phrase</span></div>
    <div class="sc"><b id="best">0</b><span>longest</span></div>
  </div>
  <p class="status" id="status">Press begin</p>

  <div class="orb">
    <button class="pad p0" data-i="0" aria-label="First light" disabled></button>
    <button class="pad p1" data-i="1" aria-label="Second light" disabled></button>
    <button class="pad p2" data-i="2" aria-label="Third light" disabled></button>
    <button class="pad p3" data-i="3" aria-label="Fourth light" disabled></button>
    <div class="core" id="core">\u2726</div>
  </div>

  <div class="bar">
    <button class="btn" id="start">Begin</button>
    <button class="btn ghost" id="replay" disabled>Hear it again</button>
  </div>
  <p class="hint">keys 1 2 3 4 also work</p>
</div>

<script>
(function () {
  'use strict';

  var LS = 'mm_echo_v1';
  var TONES = [329.63, 440.00, 554.37, 659.25];   // E A C# E — an A major spread
  var pads = [].slice.call(document.querySelectorAll('.pad'));
  var statusEl = document.getElementById('status');
  var roundEl = document.getElementById('round');
  var bestEl = document.getElementById('best');
  var coreEl = document.getElementById('core');
  var startEl = document.getElementById('start');
  var replayEl = document.getElementById('replay');

  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var seq = [], step = 0, accepting = false, playing = false;

  var best = 0;
  try { best = parseInt(localStorage.getItem(LS), 10) || 0; } catch (e) {}
  bestEl.textContent = best;

  /* ------------------------------------------------ sound */
  var ac = null;
  function audio() {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(i, when, dur) {
    var c = audio();
    var t = when || c.currentTime;
    var g = c.createGain();
    g.connect(c.destination);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.16, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.4));
    var o = c.createOscillator();
    o.type = 'triangle';
    o.frequency.setValueAtTime(TONES[i], t);
    var o2 = c.createOscillator();
    o2.type = 'sine';
    o2.frequency.setValueAtTime(TONES[i] * 2, t);
    var g2 = c.createGain();
    g2.gain.setValueAtTime(0.3, t);
    o2.connect(g2); g2.connect(g);
    o.connect(g);
    o.start(t); o2.start(t);
    o.stop(t + (dur || 0.4) + 0.05); o2.stop(t + (dur || 0.4) + 0.05);
  }
  function buzz() {
    var c = audio(), t = c.currentTime;
    var o = c.createOscillator(), g = c.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(60, t + 0.5);
    g.gain.setValueAtTime(0.16, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + 0.6);
  }

  /* ------------------------------------------------ lights */
  function lite(i, ms) {
    pads[i].dataset.lit = 'true';
    setTimeout(function () { pads[i].dataset.lit = 'false'; }, ms || 260);
  }

  function speed() {
    // tightens as the phrase grows, but never becomes unfair
    return Math.max(280, 620 - seq.length * 22);
  }

  function playSeq() {
    playing = true; accepting = false;
    setPads(false);
    statusEl.textContent = 'Listen';
    coreEl.textContent = '\u25CF';
    var gap = speed();
    seq.forEach(function (v, n) {
      setTimeout(function () {
        lite(v, Math.min(340, gap * 0.55));
        tone(v, 0, Math.min(0.42, gap / 1000 * 0.7));
      }, n * gap);
    });
    setTimeout(function () {
      playing = false; accepting = true; step = 0;
      setPads(true);
      statusEl.textContent = 'Your turn';
      coreEl.textContent = '\u2726';
      replayEl.disabled = false;
    }, seq.length * gap + 180);
  }

  function setPads(on) {
    pads.forEach(function (p) { p.disabled = !on; });
  }

  function grow() {
    seq.push(Math.floor(Math.random() * 4));
    roundEl.textContent = seq.length;
    setTimeout(playSeq, 620);
  }

  function hit(i) {
    if (!accepting) return;
    lite(i, 200);
    tone(i, 0, 0.3);
    if (seq[step] === i) {
      step++;
      if (step >= seq.length) {
        accepting = false;
        setPads(false);
        replayEl.disabled = true;
        statusEl.textContent = 'Echoed';
        if (seq.length > best) {
          best = seq.length;
          bestEl.textContent = best;
          try { localStorage.setItem(LS, String(best)); } catch (e) {}
        }
        grow();
      }
    } else {
      accepting = false;
      setPads(false);
      replayEl.disabled = true;
      buzz();
      statusEl.textContent = 'The phrase breaks \u2014 reached ' + seq.length;
      coreEl.textContent = '\u2715';
      startEl.textContent = 'Again';
    }
  }

  pads.forEach(function (p) {
    p.addEventListener('click', function () { hit(+p.dataset.i); });
  });

  startEl.addEventListener('click', function () {
    audio();
    seq = []; step = 0;
    roundEl.textContent = '0';
    startEl.textContent = 'Restart';
    coreEl.textContent = '\u2726';
    grow();
  });

  replayEl.addEventListener('click', function () {
    if (playing || !seq.length) return;
    playSeq();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key >= '1' && e.key <= '4') { e.preventDefault(); hit(+e.key - 1); }
  });
})();
</script>

      ['https://ko-fi.com/magickmica/tiers', 'Ko-fi Memberships'],
      ['https://www.themysticalspiralstore.com/', 'Mystical Spiral']
    ]}
  ];

  // shown inline on wide screens; everything else lives in the drawer
  var PRIMARY = [
    ['index.html', 'Home'],
    ['notes.html', 'Notes'],
    ['articles.html', 'Magazine'],
    ['arcade.html', 'Arcade'],
    ['songmaker.html', 'Songs']
  ];

  var CSS = ''
    + '.mm-bar{position:sticky;top:0;z-index:9000;display:flex;align-items:center;gap:10px;'
    +   'padding:9px 14px;background:rgba(7,6,14,.93);backdrop-filter:blur(9px);'
    +   '-webkit-backdrop-filter:blur(9px);border-bottom:1px solid rgba(255,68,204,.28);'
    +   'font-family:"IBM Plex Mono",ui-monospace,monospace;}'
    + '.mm-brand{font-family:"Orbitron","IBM Plex Mono",monospace;font-weight:700;font-size:12px;'
    +   'letter-spacing:.14em;text-decoration:none;color:transparent;white-space:nowrap;'
    +   'background:linear-gradient(96deg,#a020f0,#ff44cc 30%,#ffd166 60%,#22e0ff);'
    +   '-webkit-background-clip:text;background-clip:text;}'
    + '.mm-links{display:none;gap:4px;flex:1;min-width:0;}'
    + '.mm-links a{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#b8b0d4;'
    +   'text-decoration:none;padding:8px 10px;border-radius:999px;white-space:nowrap;}'
    + '.mm-links a:hover{color:#ffd166;background:rgba(255,209,102,.1);}'
    + '.mm-links a[aria-current="page"]{color:#ffd166;background:rgba(255,209,102,.14);}'
    + '.mm-spacer{flex:1}'
    + '.mm-menu{margin-left:auto;display:inline-flex;align-items:center;gap:7px;cursor:pointer;'
    +   'font-family:inherit;font-size:11px;letter-spacing:.14em;text-transform:uppercase;'
    +   'color:#07060e;background:linear-gradient(96deg,#ffd166,#ffe9b5 55%,#ffd166);'
    +   'border:0;border-radius:999px;padding:9px 15px;min-height:38px;}'
    + '.mm-menu:hover{box-shadow:0 0 18px rgba(255,209,102,.45)}'
    + '.mm-menu b{display:grid;gap:3px}'
    + '.mm-menu i{display:block;width:13px;height:2px;background:#07060e;border-radius:2px}'
    + '.mm-drawer{position:fixed;inset:0;z-index:9500;display:none;}'
    + '.mm-drawer[data-open="true"]{display:block}'
    + '.mm-scrim{position:absolute;inset:0;background:rgba(4,3,10,.82);'
    +   'backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);}'
    + '.mm-sheet{position:absolute;top:0;right:0;bottom:0;width:min(400px,88vw);'
    +   'background:#0b0818;border-left:1px solid rgba(255,68,204,.3);'
    +   'overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 18px 40px;'
    +   'box-shadow:-14px 0 44px rgba(0,0,0,.6);}'
    + '.mm-sheet-top{display:flex;align-items:center;justify-content:space-between;'
    +   'margin-bottom:14px;position:sticky;top:0;background:#0b0818;padding:4px 0 10px;}'
    + '.mm-close{background:transparent;border:1px solid rgba(184,176,212,.34);color:#b8b0d4;'
    +   'border-radius:999px;width:40px;height:40px;font-size:17px;cursor:pointer;line-height:1;}'
    + '.mm-close:hover{border-color:#ffd166;color:#ffd166}'
    + '.mm-sec{margin:0 0 18px}'
    + '.mm-sec h3{margin:0 0 7px;font-size:10px;letter-spacing:.28em;text-transform:uppercase;'
    +   'color:#6f6890;font-weight:500;font-family:inherit;}'
    + '.mm-sec a{display:block;padding:11px 12px;margin:0 -12px;border-radius:9px;'
    +   'font-size:14px;color:#d9d2ee;text-decoration:none;font-family:inherit;}'
    + '.mm-sec a:hover{background:rgba(255,68,204,.13);color:#fff}'
    + '.mm-sec a[aria-current="page"]{color:#ffd166;background:rgba(255,209,102,.12)}'
    + '@media(min-width:900px){.mm-links{display:flex}.mm-spacer{display:none}}'
    + '@media(prefers-reduced-motion:reduce){.mm-bar{backdrop-filter:none}}';

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text) e.textContent = text;
    return e;
  }

  var here = (location.pathname.split('/').pop() || 'index.html').toLowerCase();

  function link(href, label) {
    var a = el('a', null, label);
    a.href = href;
    if (href.toLowerCase() === here) a.setAttribute('aria-current', 'page');
    if (/^https?:/.test(href) && href.indexOf('magickmica.github.io') === -1) {
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = label + ' \u2197';
    }
    return a;
  }

  function build() {
    if (document.querySelector('.mm-bar')) return;   // never inject twice

    var style = el('style');
    style.textContent = CSS;
    document.head.appendChild(style);

    /* ---------------- bar ---------------- */
    var bar = el('nav', 'mm-bar');
    bar.setAttribute('aria-label', 'Site');

    var brand = el('a', 'mm-brand', '\u2726 MAGICKMICA');
    brand.href = 'index.html';
    bar.appendChild(brand);

    var links = el('div', 'mm-links');
    PRIMARY.forEach(function (p) { links.appendChild(link(p[0], p[1])); });
    bar.appendChild(links);
    bar.appendChild(el('div', 'mm-spacer'));

    var btn = el('button', 'mm-menu');
    btn.type = 'button';
    btn.setAttribute('aria-expanded', 'false');
    btn.setAttribute('aria-controls', 'mm-drawer');
    var bars = el('b');
    bars.appendChild(el('i')); bars.appendChild(el('i')); bars.appendChild(el('i'));
    btn.appendChild(bars);
    btn.appendChild(document.createTextNode('Menu'));
    bar.appendChild(btn);

    /* ---------------- drawer ---------------- */
    var drawer = el('div', 'mm-drawer');
    drawer.id = 'mm-drawer';
    drawer.setAttribute('data-open', 'false');

    var scrim = el('div', 'mm-scrim');
    var sheet = el('div', 'mm-sheet');
    sheet.setAttribute('role', 'dialog');
    sheet.setAttribute('aria-modal', 'true');
    sheet.setAttribute('aria-label', 'Site directory');

    var top = el('div', 'mm-sheet-top');
    var title = el('span', 'mm-brand', '\u2726 EVERYTHING');
    var close = el('button', 'mm-close', '\u2715');
    close.type = 'button';
    close.setAttribute('aria-label', 'Close menu');
    top.appendChild(title); top.appendChild(close);
    sheet.appendChild(top);

    var home = el('div', 'mm-sec');
    home.appendChild(link('index.html', 'Home'));
    sheet.appendChild(home);

    SECTIONS.forEach(function (sec) {
      var box = el('div', 'mm-sec');
      box.appendChild(el('h3', null, sec.name));
      sec.items.forEach(function (it) { box.appendChild(link(it[0], it[1])); });
      sheet.appendChild(box);
    });

    drawer.appendChild(scrim);
    drawer.appendChild(sheet);

    document.body.insertBefore(bar, document.body.firstChild);
    document.body.appendChild(drawer);

    /* ---------------- behaviour ---------------- */
    var lastFocus = null;

    function open() {
      lastFocus = document.activeElement;
      drawer.setAttribute('data-open', 'true');
      btn.setAttribute('aria-expanded', 'true');
      document.body.style.overflow = 'hidden';
      close.focus();
    }
    function shut() {
      drawer.setAttribute('data-open', 'false');
      btn.setAttribute('aria-expanded', 'false');
      document.body.style.overflow = '';
      if (lastFocus && lastFocus.focus) lastFocus.focus();
    }

    btn.addEventListener('click', open);
    close.addEventListener('click', shut);
    scrim.addEventListener('click', shut);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && drawer.getAttribute('data-open') === 'true') shut();
    });
    // keep focus inside the sheet while it is open
    sheet.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab') return;
      var f = sheet.querySelectorAll('a[href],button');
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', build);
  } else {
    build();
  }
})();
