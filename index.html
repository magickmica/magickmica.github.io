<body>
  <canvas id="scene" aria-hidden="true"></canvas>

  <div class="parlour" aria-hidden="true">

    <div class="aurora aurora-2"></div>
    <div class="bokeh"></div>
    <div class="floaters">
      <span class="floater f-1">❄</span>
      <span class="floater f-2">✧</span>
      <span class="floater f-3">❅</span>
      <span class="floater f-4">✦</span>
      <span class="floater f-5">❄</span>
      <span class="floater f-6">✧</span>
    </div>
    <div class="vignette"></div>
  </div>
  <canvas id="snow" aria-hidden="true"></canvas>

  <main class="ui" id="ui">
    <header class="masthead">
      <h1 class="title" data-text="Cosmic Music Box">Cosmic Music Box</h1>
      <p class="subtitle">wind the key · make a wish</p>
    </header>

    <p class="instruction" id="instruction">A little melody sleeps inside…<br /><span class="hint">wind the golden key to wake it</span></p>

    <button class="box-hit" id="boxHit" aria-label="Wind the music box and play its melody.">
      <span class="touch-cue" id="touchCue" aria-hidden="true">✦ wind the key ✦</span>
      <span class="sr-only">Wind the music box</span>
    </button>

    <div class="now-playing" id="nowPlaying" aria-hidden="true">
      <span class="np-label">now playing</span>
      <span class="np-title" id="npTitle">✦ Bella Ciao ✦</span>
    </div>

    <div class="controls">
      <button id="songMenuBtn" class="ctl" aria-expanded="false" title="Choose a song">♪ songs</button>
      <button id="soundToggle" class="ctl" aria-pressed="true" title="Toggle sound">🔊 sound</button>
      <button id="contrastToggle" class="ctl" aria-pressed="false" title="Toggle high contrast">◐ contrast</button>
    </div>

    <!-- song picker -->
    <div class="song-menu" id="songMenu" aria-hidden="true" role="menu">
      <div class="song-menu-title">✦ choose a melody ✦</div>
      <div class="song-list" id="songList"><!-- filled by JS --></div>
    </div>

    <div class="sr-only" role="status" aria-live="polite" id="live"></div>
    <footer class="colophon">✦ wound by starlight · played by snow ✦</footer>
  </main>

</body>
</html>
