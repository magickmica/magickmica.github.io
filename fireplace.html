<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Hearth</title>

<!--
  Save this file anywhere and double-click it.
  Needs an internet connection the first time (three.js and the fonts come
  from a CDN). The brick, the flame, the wood grain and every sound are
  generated here. No images, no audio files, no build step.

  Drag to look around. Click the fire to stoke it.
-->

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;800&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet" />

<style>
	:root {
		--cold:   #0d111b;   /* the room, away from the fire */
		--slate:  #1a2130;
		--dusk:   #2c3346;
		--ember:  #ff7b3a;   /* every ON state */
		--flame:  #ffc45c;
		--cream:  #f5ece0;
		--slab:   #151a26;
	}

	* { box-sizing: border-box; }

	html, body { margin: 0; height: 100%; overflow: hidden; background: var(--cold); }

	body {
		font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
		color: var(--cream);
		/* A COLD room with one hot thing in it. Warm-on-warm is the obvious
		   fireplace and it goes flat — the fire only looks hot if the walls
		   around it are blue. */
		background:
			radial-gradient(58% 40% at 50% 76%, color-mix(in srgb, var(--ember) 40%, transparent) 0%, transparent 64%),
			radial-gradient(110% 60% at 50% 104%, #4a2a22 0%, transparent 62%),
			linear-gradient(180deg, var(--cold) 0%, var(--slate) 60%, var(--dusk) 100%);
	}

	#stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
	#stage.dragging { cursor: grabbing; }
	#stage.over { cursor: pointer; }
	#stage canvas { display: block; }

	.overlay {
		position: fixed;
		inset: 0;
		display: flex;
		flex-direction: column;
		justify-content: space-between;
		padding: clamp(1.1rem, 3.5vw, 2.4rem);
		pointer-events: none;
	}

	.masthead { max-width: 30ch; }

	.title {
		font-family: 'Big Shoulders Display', ui-sans-serif, sans-serif;
		font-weight: 800;
		font-size: clamp(3.6rem, 14vw, 8.5rem);
		line-height: 0.82;
		letter-spacing: -0.02em;
		text-transform: uppercase;
		margin: 0;
	}

	.standfirst {
		margin: 0.85rem 0 0;
		font-size: 0.9rem;
		line-height: 1.5;
		max-width: 26ch;
		color: color-mix(in srgb, var(--cream) 62%, transparent);
	}

	/* ── console ── */
	.console {
		pointer-events: auto;
		align-self: center;
		display: flex;
		flex-wrap: wrap;
		justify-content: center;
		gap: clamp(0.5rem, 2vw, 1.1rem);
		padding: clamp(0.7rem, 2vw, 1rem) clamp(0.9rem, 2.5vw, 1.4rem);
		border-radius: 14px;
		background: color-mix(in srgb, var(--slab) 82%, transparent);
		border: 1px solid color-mix(in srgb, var(--cream) 14%, transparent);
		box-shadow: 0 18px 50px -18px #000, inset 0 1px 0 color-mix(in srgb, var(--cream) 12%, transparent);
		backdrop-filter: blur(9px);
	}

	.switch {
		appearance: none;
		border: 0;
		background: none;
		padding: 0.35rem 0.15rem;
		display: grid;
		justify-items: center;
		gap: 0.5rem;
		cursor: pointer;
		font: inherit;
		color: inherit;
		border-radius: 9px;
	}
	.switch:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; }

	.throw {
		width: 56px;
		height: 27px;
		border-radius: 999px;
		background: #080b12;
		border: 1px solid color-mix(in srgb, var(--cream) 16%, transparent);
		box-shadow: inset 0 2px 6px #000;
		position: relative;
	}
	.knob {
		position: absolute;
		top: 3px;
		left: 3px;
		width: 19px;
		height: 19px;
		border-radius: 50%;
		background: linear-gradient(180deg, #fffaf2, #c9bda9);
		box-shadow: 0 2px 4px #000a;
		transition: transform 0.34s cubic-bezier(0.34, 1.7, 0.5, 1);
	}
	.switch[aria-pressed="true"] .knob { transform: translateX(29px); }
	.switch[aria-pressed="true"] .throw {
		background: color-mix(in srgb, var(--ember) 26%, #080b12);
		box-shadow: inset 0 2px 6px #0008, 0 0 16px -2px var(--ember);
	}

	.label {
		font-family: 'Big Shoulders Display', ui-sans-serif, sans-serif;
		font-weight: 500;
		font-size: 0.95rem;
		letter-spacing: 0.16em;
		text-transform: uppercase;
		color: color-mix(in srgb, var(--cream) 60%, transparent);
	}
	.switch[aria-pressed="true"] .label { color: var(--cream); }

	.press .throw {
		display: grid;
		place-items: center;
		background: linear-gradient(180deg, #3a2418, #1c1109);
		border-color: color-mix(in srgb, var(--flame) 34%, transparent);
		transition: transform 0.1s ease;
	}
	.press:active .throw { transform: translateY(2px); }
	.press .dot {
		width: 9px; height: 9px; border-radius: 50%;
		background: var(--flame);
		box-shadow: 0 0 12px var(--flame);
		opacity: 0.55;
	}
	.press:active .dot, .press.lit .dot { opacity: 1; }

	/* ── volume ──
	   The fill is painted with a CSS custom property the slider updates, so
	   the track shows the level rather than needing a number beside it. */
	.vol {
		display: grid;
		justify-items: center;
		gap: 0.5rem;
		padding: 0.35rem 0.3rem;
	}
	.vol input {
		-webkit-appearance: none;
		appearance: none;
		width: 74px;
		height: 27px;
		background: none;
		cursor: pointer;
		margin: 0;
	}
	.vol input::-webkit-slider-runnable-track {
		height: 8px;
		border-radius: 999px;
		border: 1px solid color-mix(in srgb, var(--cream) 16%, transparent);
		background: linear-gradient(90deg, var(--ember) var(--fill), #080b12 var(--fill));
		box-shadow: inset 0 1px 3px #000;
	}
	.vol input::-moz-range-track {
		height: 8px;
		border-radius: 999px;
		border: 1px solid color-mix(in srgb, var(--cream) 16%, transparent);
		background: linear-gradient(90deg, var(--ember) var(--fill), #080b12 var(--fill));
	}
	.vol input::-webkit-slider-thumb {
		-webkit-appearance: none;
		width: 17px;
		height: 17px;
		margin-top: -6px;
		border-radius: 50%;
		background: linear-gradient(180deg, #fffaf2, #c9bda9);
		box-shadow: 0 2px 4px #000a;
	}
	.vol input::-moz-range-thumb {
		width: 17px;
		height: 17px;
		border: 0;
		border-radius: 50%;
		background: linear-gradient(180deg, #fffaf2, #c9bda9);
		box-shadow: 0 2px 4px #000a;
	}
	.vol input:focus-visible { outline: 2px solid var(--ember); outline-offset: 4px; }

	/* ── the dock ── */
	.dock {
		position: fixed;
		top: clamp(0.9rem, 3vw, 1.6rem);
		right: clamp(0.9rem, 3vw, 1.6rem);
		display: flex;
		gap: 0.5rem;
		z-index: 5;
	}

	.chip {
		display: inline-flex;
		align-items: center;
		gap: 0.45rem;
		padding: 0.5rem 0.8rem;
		border-radius: 999px;
		text-decoration: none;
		font-family: 'Big Shoulders Display', ui-sans-serif, sans-serif;
		font-weight: 500;
		font-size: 0.9rem;
		letter-spacing: 0.14em;
		text-transform: uppercase;
		color: color-mix(in srgb, var(--cream) 68%, transparent);
		background: color-mix(in srgb, var(--slab) 80%, transparent);
		border: 1px solid color-mix(in srgb, var(--cream) 16%, transparent);
		backdrop-filter: blur(8px);
		transition: color 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, transform 0.1s ease;
	}
	.chip svg { width: 18px; height: 18px; flex: none; }
	.chip:active { transform: translateY(1px); }
	.chip:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }

	.chip.tip:hover, .chip.tip:focus-visible {
		color: var(--flame);
		border-color: var(--flame);
		box-shadow: 0 0 20px -6px var(--flame);
	}
	.chip.arcade:hover, .chip.arcade:focus-visible {
		color: var(--ember);
		border-color: var(--ember);
		box-shadow: 0 0 20px -6px var(--ember);
	}

	.fallback {
		position: fixed; inset: 0; display: none; place-items: center;
		text-align: center; padding: 2rem; line-height: 1.6;
	}

	@media (max-width: 620px) {
		.chip span { display: none; }
		.chip { padding: 0.6rem; }
	}

	@media (max-width: 460px) {
		.console { gap: 0.35rem; padding: 0.6rem 0.7rem; }
		.throw { width: 46px; }
		.switch[aria-pressed="true"] .knob { transform: translateX(19px); }
		.label { font-size: 0.8rem; letter-spacing: 0.1em; }
		.standfirst { display: none; }
	}

	@media (prefers-reduced-motion: reduce) {
		.knob { transition: none; }
	}
</style>

<div class="overlay">
	<header class="masthead">
		<h1 class="title">The<br />Hearth</h1>
		<p class="standfirst">Nothing here needs anything from you. Pull up a chair.</p>
	</header>

	<div class="console" role="group" aria-label="Fire controls">
		<button class="switch" id="sw-fire" aria-pressed="true">

		<div class="vol">
			<input type="range" id="vol" min="0" max="100" value="80" style="--fill: 80%" aria-label="Volume" />
			<span class="label">Volume</span>
		</div>
		<button class="switch press" id="btn-stoke">
			<span class="throw"><span class="dot"></span></span>
			<span class="label">Stoke it</span>
		</button>
	</div>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.184.0/build/three.module.js" } }

<script type="module">
import * as THREE from 'three';

const TWO_PI = Math.PI * 2;
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ══ WOOD ═════════════════════════════════════════════════════════════════
   Grain is rings of density: a plain sine wave whose input coordinate gets
   warped by fractal noise. The warp is the whole trick — unwarped, the same
   sine comes out as corduroy.
*/
const woodTexture = (dark, light, ringFreq = 3.2) => {
	const S = 512;
	const c = document.createElement('canvas');
	c.width = c.height = S;
	const ctx = c.getContext('2d');
	const img = ctx.createImageData(S, S);
	const d = img.data;

	const hash = (x, y) => {
		const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
		return n - Math.floor(n);
	};
	const smooth = (x, y) => {
		const xi = Math.floor(x), yi = Math.floor(y);
		const xf = x - xi, yf = y - yi;
		const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
		return (hash(xi, yi) * (1 - u) + hash(xi + 1, yi) * u) * (1 - v)
		     + (hash(xi, yi + 1) * (1 - u) + hash(xi + 1, yi + 1) * u) * v;
	};
	const fbm = (x, y) => {
		let s = 0, a = 0.5, f = 1;
		for (let i = 0; i < 4; i++) { s += a * smooth(x * f, y * f); a *= 0.5; f *= 2; }
		return s;
	};

	for (let j = 0; j < S; j++) {
		for (let i = 0; i < S; i++) {
			const x = (i / S) * 9, y = (j / S) * 9;
			const warp = fbm(x * 0.55, y * 0.55) * 2.4;
			const rings = Math.sin((y * ringFreq + warp * 1.7) * Math.PI * 2);
			let v = Math.pow(0.5 + 0.5 * rings, 1.7);
			v = v * 0.6 + fbm(x * 5, y * 5) * 0.4;
			const o = (j * S + i) * 4;
			for (let k = 0; k < 3; k++) {
				d[o + k] = Math.round(Math.pow(dark[k] + (light[k] - dark[k]) * v, 1 / 2.2) * 255);
			}
			d[o + 3] = 255;
		}
	}
	ctx.putImageData(img, 0, 0);
	const tex = new THREE.CanvasTexture(c);
	tex.colorSpace = THREE.SRGBColorSpace;
	tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
	return tex;
};

/* ══ THE FIREPLACE ════════════════════════════════════════════════════════
   Every brick is a separate box, which would be hundreds of draw calls —
   so they're one InstancedMesh instead: a single geometry drawn many times
   with a per-instance matrix and color. That per-instance color is what
   earns the detail here. Soot isn't a texture; it's each brick being told
   how close it is to the smoke path, so the wall darkens toward the top
   and the center the way a real one does.
*/

const BW = 3.0, BH = 2.35;             // firebox opening: width, height
const BACK_Z = -0.95;

function buildFireplace() {
	const group = new THREE.Group();

	const brickGeo = new THREE.BoxGeometry(0.44, 0.19, 0.13);
	const slots = [];
	const bw = 0.44, bh = 0.19, gap = 0.016;

	// back wall
	const rows = Math.ceil(BH / (bh + gap));
	for (let r = 0; r < rows; r++) {
		const y = 0.03 + r * (bh + gap) + bh / 2;
		const stagger = (r % 2) ? (bw + gap) / 2 : 0;
		for (let x = -BW / 2 - stagger; x < BW / 2; x += bw + gap) {
			const cx = x + bw / 2;
			if (Math.abs(cx) > BW / 2 + 0.1) continue;
			slots.push({ x: cx, y, z: BACK_Z, ry: 0 });
		}
	}
	// side walls, splayed slightly toward the room the way a real firebox is
	for (const side of [-1, 1]) {
		for (let r = 0; r < rows; r++) {
			const y = 0.03 + r * (bh + gap) + bh / 2;
			const stagger = (r % 2) ? (bw + gap) / 2 : 0;
			for (let z = BACK_Z - stagger; z < BACK_Z + 1.15; z += bw + gap) {
				const cz = z + bw / 2;
				slots.push({ x: side * (BW / 2 + 0.06), y, z: cz, ry: Math.PI / 2, side });
			}
		}
	}

	const bricks = new THREE.InstancedMesh(
		brickGeo,
		new THREE.MeshStandardMaterial({ roughness: 0.94, metalness: 0 }),
		slots.length,
	);
	const dummy = new THREE.Object3D();
	const base = new THREE.Color(0x7a4f3e);
	const soot = new THREE.Color(0x120d0b);
	const col = new THREE.Color();

	slots.forEach((s, i) => {
		dummy.position.set(s.x, s.y, s.z);
		dummy.rotation.set(0, s.ry, (Math.random() - 0.5) * 0.012);   // a little slop
		dummy.scale.setScalar(0.985 + Math.random() * 0.03);
		dummy.updateMatrix();
		bricks.setMatrixAt(i, dummy.matrix);

		// soot: heaviest high and centered, where the smoke actually goes
		const up = Math.pow(Math.min(1, s.y / BH), 1.25);
		const mid = Math.exp(-(s.x * s.x) / 1.9);
		const amt = Math.min(1, up * mid * 1.25 + up * 0.25);
		col.copy(base).lerp(soot, amt * 0.88);
		const jitter = 0.86 + Math.random() * 0.28;
		col.multiplyScalar(jitter);
		bricks.setColorAt(i, col);
	});
	bricks.instanceMatrix.needsUpdate = true;
	bricks.instanceColor.needsUpdate = true;
	group.add(bricks);

	// ── hearth stone ──
	const stone = new THREE.MeshStandardMaterial({ color: 0x4a4a4e, roughness: 0.88, metalness: 0.02 });
	const hearth = new THREE.Mesh(new THREE.BoxGeometry(4.3, 0.16, 2.6), stone);
	hearth.position.set(0, -0.08, BACK_Z + 1.3);
	group.add(hearth);

	// ── surround and mantel ──
	const darkStone = new THREE.MeshStandardMaterial({ color: 0x3a3a40, roughness: 0.9 });
	for (const side of [-1, 1]) {
		const pier = new THREE.Mesh(new THREE.BoxGeometry(0.42, BH + 0.1, 1.5), darkStone);
		pier.position.set(side * (BW / 2 + 0.32), (BH + 0.1) / 2, BACK_Z + 0.72);
		group.add(pier);
	}
	const lintel = new THREE.Mesh(new THREE.BoxGeometry(BW + 1.24, 0.3, 1.5), darkStone);
	lintel.position.set(0, BH + 0.25, BACK_Z + 0.72);
	group.add(lintel);

	const mantelWood = new THREE.MeshStandardMaterial({
		map: woodTexture([0.13, 0.07, 0.035], [0.42, 0.24, 0.11], 2.4),
		roughness: 0.66, metalness: 0.03,
	});
	const mantel = new THREE.Mesh(new THREE.BoxGeometry(BW + 1.7, 0.24, 1.9), mantelWood);
	mantel.position.set(0, BH + 0.52, BACK_Z + 0.78);
	group.add(mantel);

	return group;
}

/* ── logs ──
   Charred, so the wood texture is nearly black with just enough grain left
   to catch the light. The glow between them is separate: little emissive
   spheres bedded down in the ash, which is cheaper and reads better than
   trying to make the logs themselves glow.
*/
function buildLogs() {
	const group = new THREE.Group();
	const charred = new THREE.MeshStandardMaterial({
		map: woodTexture([0.035, 0.024, 0.02], [0.19, 0.12, 0.08], 5.5),
		roughness: 0.95, metalness: 0,
	});

	const log = (x, y, z, rx, ry, len, rad) => {
		const m = new THREE.Mesh(new THREE.CylinderGeometry(rad, rad * 0.93, len, 18, 1), charred);
		m.rotation.set(rx, ry, Math.PI / 2);
		m.position.set(x, y, z);
		group.add(m);
	};

	log(-0.06, 0.15, BACK_Z + 0.55, 0, 0.18, 1.5, 0.135);
	log(0.05, 0.15, BACK_Z + 0.28, 0, -0.32, 1.4, 0.125);
	log(-0.12, 0.36, BACK_Z + 0.44, 0, 0.72, 1.3, 0.12);
	log(0.18, 0.38, BACK_Z + 0.36, 0, -0.85, 1.25, 0.115);

	// the ember bed — brightness is driven per-frame from the flicker
	const emberMat = new THREE.MeshBasicMaterial({ color: 0xff5a12, toneMapped: false });
	const embers = [];
	for (let i = 0; i < 22; i++) {
		const a = Math.random() * TWO_PI;
		const r = Math.random() * 0.62;
		const e = new THREE.Mesh(new THREE.SphereGeometry(0.035 + Math.random() * 0.03, 10, 8), emberMat.clone());
		e.position.set(Math.cos(a) * r, 0.05 + Math.random() * 0.14, BACK_Z + 0.42 + Math.sin(a) * r * 0.55);
		e.userData.phase = Math.random() * TWO_PI;
		group.add(e);
		embers.push(e);
	}

	return { group, embers };
}

/* ══ FLAME ════════════════════════════════════════════════════════════════
   The particles never touch the CPU. Each one gets a seed, a speed and a
   lane once, at build time; the vertex shader derives its whole life from
   fract(time * speed + seed). Thousands of them cost one draw call and no
   per-frame JavaScript, which is why this can be dense enough to look like
   fire instead of like confetti.

   The color ramp is the other half: white-hot at the base, yellow, orange,
   then deep red as it dies. Fire is a TEMPERATURE gradient, and a flame
   that's one color top to bottom always reads as cellophane.
*/
const flameUniforms = {
	uTime: { value: 0 },
	uLevel: { value: 1 },
	uPixel: { value: 1 },
};

function makeParticles(count, spread, cfg) {
	const pos = new Float32Array(count * 3);
	const seed = new Float32Array(count);
	const speed = new Float32Array(count);
	const size = new Float32Array(count);
	for (let i = 0; i < count; i++) {
		const a = Math.random() * TWO_PI;
		const r = Math.sqrt(Math.random());
		pos[i * 3] = Math.cos(a) * r * spread.x;
		pos[i * 3 + 1] = spread.y;
		pos[i * 3 + 2] = BACK_Z + 0.42 + Math.sin(a) * r * spread.z;
		seed[i] = Math.random();
		speed[i] = cfg.speed[0] + Math.random() * (cfg.speed[1] - cfg.speed[0]);
		size[i] = cfg.size[0] + Math.random() * (cfg.size[1] - cfg.size[0]);
	}
	const g = new THREE.BufferGeometry();
	g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
	g.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
	g.setAttribute('aSpeed', new THREE.BufferAttribute(speed, 1));
	g.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
	return g;
}

const VERT = `
	attribute float aSeed;
	attribute float aSpeed;
	attribute float aSize;
	uniform float uTime;
	uniform float uLevel;
	uniform float uPixel;
	uniform float uRise;
	uniform float uConverge;
	uniform float uSway;
	varying float vLife;
	varying float vSeed;

	void main() {
		float life = fract(uTime * aSpeed + aSeed);
		vLife = life;
		vSeed = aSeed;

		vec3 p = position;
		// draw inward as it climbs — a column that stays the same width is
		// a smoke machine, not a flame
		p.x *= 1.0 - life * uConverge;
		p.z *= 1.0 - life * uConverge;
		p.x += sin(uTime * 2.3 + aSeed * 31.0) * uSway * life;
		p.z += cos(uTime * 1.9 + aSeed * 23.0) * uSway * 0.7 * life;
		p.y += life * uRise * (0.45 + uLevel * 0.75);

		vec4 mv = modelViewMatrix * vec4(p, 1.0);
		gl_PointSize = aSize * (1.0 - life * 0.6) * (0.35 + uLevel * 0.8) * uPixel * (320.0 / -mv.z);
		gl_Position = projectionMatrix * mv;
	}
`;

const FLAME_FRAG = `
	uniform float uLevel;
	varying float vLife;
	varying float vSeed;
	void main() {
		vec2 d = gl_PointCoord - 0.5;
		float r = length(d);
		if (r > 0.5) discard;
		float a = smoothstep(0.5, 0.05, r);

		vec3 c;
		if (vLife < 0.22)      c = mix(vec3(1.00, 0.96, 0.80), vec3(1.00, 0.74, 0.24), vLife / 0.22);
		else if (vLife < 0.58) c = mix(vec3(1.00, 0.74, 0.24), vec3(0.96, 0.31, 0.06), (vLife - 0.22) / 0.36);
		else                   c = mix(vec3(0.96, 0.31, 0.06), vec3(0.30, 0.04, 0.01), (vLife - 0.58) / 0.42);

		float fade = 1.0 - smoothstep(0.5, 1.0, vLife);
		gl_FragColor = vec4(c, a * fade * 0.5 * (0.25 + uLevel));
	}
`;

const SMOKE_FRAG = `
	uniform float uLevel;
	varying float vLife;
	varying float vSeed;
	void main() {
		vec2 d = gl_PointCoord - 0.5;
		float r = length(d);
		if (r > 0.5) discard;
		float a = smoothstep(0.5, 0.0, r);
		// in at the bottom, out at the top — smoke that appears at full
		// opacity has a visible spawn line
		float env = smoothstep(0.0, 0.25, vLife) * (1.0 - smoothstep(0.45, 1.0, vLife));
		vec3 c = mix(vec3(0.30, 0.26, 0.24), vec3(0.13, 0.13, 0.15), vLife);
		gl_FragColor = vec4(c, a * env * 0.16 * uLevel);
	}
`;

const EMBER_FRAG = `
	uniform float uTime;
	uniform float uLevel;
	varying float vLife;
	varying float vSeed;
	void main() {
		vec2 d = gl_PointCoord - 0.5;
		float r = length(d);
		if (r > 0.5) discard;
		float a = smoothstep(0.5, 0.1, r);
		// each ember winks at its own rate as it tumbles
		float wink = 0.55 + 0.45 * sin(uTime * (9.0 + vSeed * 14.0) + vSeed * 40.0);
		float fade = (1.0 - smoothstep(0.3, 1.0, vLife)) * smoothstep(0.0, 0.06, vLife);
		vec3 c = mix(vec3(1.0, 0.72, 0.30), vec3(1.0, 0.28, 0.06), vLife);
		gl_FragColor = vec4(c, a * fade * wink * 0.9 * uLevel);
	}
`;

const particleMat = (frag, extra) => new THREE.ShaderMaterial({
	uniforms: Object.assign({}, flameUniforms, extra),
	vertexShader: VERT,
	fragmentShader: frag,
	transparent: true,
	depthWrite: false,
	blending: frag === SMOKE_FRAG ? THREE.NormalBlending : THREE.AdditiveBlending,
});

/* ── the light pool on the hearth ── */
function buildPool() {
	const c = document.createElement('canvas');
	c.width = c.height = 512;
	const g = c.getContext('2d');
	const gr = g.createRadialGradient(256, 256, 12, 256, 256, 250);
	gr.addColorStop(0, 'rgba(255,150,60,0.75)');
	gr.addColorStop(0.5, 'rgba(255,90,30,0.28)');
	gr.addColorStop(1, 'rgba(255,60,20,0)');
	g.fillStyle = gr;
	g.fillRect(0, 0, 512, 512);
	const tex = new THREE.CanvasTexture(c);
	tex.colorSpace = THREE.SRGBColorSpace;
	const m = new THREE.Mesh(
		new THREE.PlaneGeometry(6.5, 6.5),
		new THREE.MeshBasicMaterial({
			map: tex, transparent: true, depthWrite: false,
			blending: THREE.AdditiveBlending, toneMapped: false,
		}),
	);
	m.rotation.x = -Math.PI / 2;
	m.position.set(0, 0.012, BACK_Z + 0.8);
	m.renderOrder = 1;
	return m;
}

const buildLightRoom = () => {
	const room = new THREE.Scene();
	room.background = new THREE.Color(0x0e1119);
	const c = document.createElement('canvas');
	c.width = c.height = 256;
	const ctx = c.getContext('2d');
	const grad = ctx.createRadialGradient(128, 128, 24, 128, 128, 128);
	grad.addColorStop(0, '#ffffff');
	grad.addColorStop(1, '#000000');
	ctx.fillStyle = grad;
	ctx.fillRect(0, 0, 256, 256);
	const tex = new THREE.CanvasTexture(c);
	const panel = (w, h, x, y, z, intensity, tint) => {
		const m = new THREE.Mesh(
			new THREE.PlaneGeometry(w, h),
			new THREE.MeshBasicMaterial({
				map: tex, color: new THREE.Color(tint).multiplyScalar(intensity), side: THREE.DoubleSide,
			}),
		);
		m.position.set(x, y, z);
		m.lookAt(0, 0, 0);
		room.add(m);
	};
	panel(10, 7, -7, 5, 7, 0.5, 0x9fc0ff);   // cold window light from the room
	panel(8, 6, 7, 3, 6, 0.3, 0x8fa8d8);
	panel(7, 5, 0, -1, 2, 1.6, 0xff8a3c);    // the fire's own contribution
	return room;
};

/* ══ SOUND ════════════════════════════════════════════════════════════════
   Fire is not a tone. It's broadband noise shaped two ways at once: a low
   ROAR (noise pushed through a lowpass that wanders) and CRACKLES (very
   short bursts through a sharp resonant filter, scattered at random).

   The scattering matters more than the bursts. Evenly spaced crackles sound
   like a machine; real fire clusters — quiet, quiet, then three at once —
   so the scheduler picks its next gap at random and sometimes fires a whole
   handful. The reverb is short and small, a living room. Nothing here is a
   pitched instrument at all, which is what keeps it clear of the other
   pages.
*/
const Sfx = (() => {
	let ctx = null, master = null, bus = null, noiseBuf = null;
	let roarGain = null, roarFilter = null, sizzleGain = null;
	let on = false, level = 1, vol = 0.8, timer = null, fizzTimer = null;

	const impulse = (seconds, decay) => {
		const len = Math.floor(ctx.sampleRate * seconds);
		const buf = ctx.createBuffer(2, len, ctx.sampleRate);
		for (let ch = 0; ch < 2; ch++) {
			const d = buf.getChannelData(ch);
			for (let i = 0; i < len; i++) {
				d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
			}
		}
		return buf;
	};

	const init = () => {
		if (ctx) return;
		ctx = new (window.AudioContext || window.webkitAudioContext)();
		master = ctx.createGain();
		master.gain.value = 0;
		master.connect(ctx.destination);

		bus = ctx.createGain();
		bus.connect(master);
		const conv = ctx.createConvolver();
		// Short and dry. A long tail smears separate grains into each other
		// until they overlap continuously — which is, once again, water.
		// Transients have to stay separate to read as transients.
		conv.buffer = impulse(0.42, 4.2);
		const wet = ctx.createGain();
		wet.gain.value = 0.16;
		bus.connect(conv).connect(wet).connect(master);

		noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
		const d = noiseBuf.getChannelData(0);
		// leaky integration tilts white noise toward the low end — closer to
		// the pink spectrum real fire has, and much less hissy
		let last = 0;
		for (let i = 0; i < d.length; i++) {
			const w = Math.random() * 2 - 1;
			last = (last + 0.02 * w) / 1.02;
			d[i] = last * 3.2;
		}

		// ONE bed only, and it lives below 130Hz. Anything sustained above
		// that turns into water: a continuous hiss in the 2–8kHz band with
		// movement on it is a stream, full stop. There is no filter setting
		// that rescues it, because the problem isn't the color — it's that
		// the sound never stops.
		//
		// So the entire high end is transient instead. Everything up there
		// arrives as separate grains through this bus, with real silence
		// between them. Fire is impulses; water is a wash.
		const src = ctx.createBufferSource();
		src.buffer = noiseBuf;
		src.loop = true;

		roarFilter = ctx.createBiquadFilter();
		roarFilter.type = 'lowpass';
		roarFilter.frequency.value = 118;
		roarFilter.Q.value = 0.5;
		roarGain = ctx.createGain();
		roarGain.gain.value = 0.3;
		src.connect(roarFilter).connect(roarGain).connect(bus);
		src.start();

		// every crackle and grain lands here, so one knob rides them all
		sizzleGain = ctx.createGain();
		sizzleGain.gain.value = 1;
		sizzleGain.connect(bus);

		// the only slow movement anywhere, and just a few Hz wide
		const drift = ctx.createOscillator();
		drift.frequency.value = 0.06;
		const driftAmt = ctx.createGain();
		driftAmt.gain.value = 14;
		drift.connect(driftAmt).connect(roarFilter.frequency);
		drift.start();
	};

	// one grain: a very short burst through a sharp resonant filter
	const snap = (t, freq, q, gain, dur) => {
		const src = ctx.createBufferSource();
		src.buffer = noiseBuf;
		src.playbackRate.value = 0.8 + Math.random() * 1.6;
		const f = ctx.createBiquadFilter();
		f.type = 'bandpass';
		f.frequency.value = freq;
		f.Q.value = q;
		const g = ctx.createGain();
		g.gain.setValueAtTime(0.0001, t);
		g.gain.exponentialRampToValueAtTime(gain, t + 0.003);
		g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
		src.connect(f).connect(g).connect(sizzleGain);
		src.start(t);
		src.stop(t + dur + 0.05);
	};

	/* The fine layer. This is what replaced the sustained sizzle, and the
	   difference is entirely statistical.

	   Amplitude is random()³ — a heavy tail, so the overwhelming majority
	   of these are inaudible and every so often one isn't. That lopsided
	   distribution is what separates fire from water at the level your ear
	   actually judges it: a stream is thousands of grains all the same
	   size, arriving so evenly they fuse into a wash. Fire is mostly
	   nothing, punctuated. Even at the same density and the same filter
	   settings, the flat distribution sounds wet and this one doesn't. */
	const fizz = () => {
		if (!on || !ctx) return;
		const t0 = ctx.currentTime;
		const n = 1 + Math.floor(Math.random() * 2);
		for (let i = 0; i < n; i++) {
			const amp = 0.34 * Math.pow(Math.random(), 3);
			snap(
				t0 + Math.random() * 0.05,
				2000 + Math.random() * 5200,
				14 + Math.random() * 18,
				amp * level,
				0.004 + Math.random() * 0.011,
			);
		}
		fizzTimer = setTimeout(fizz, (26 + Math.random() * 105) / (0.4 + level));
	};

	const scatter = () => {
		if (!on || !ctx) return;
		const t0 = ctx.currentTime;
		// Clustered, never metronomic: usually one, often a fistful. With
		// the middle of the spectrum now empty, these ARE the fire — so
		// they run denser than before.
		const burst = Math.random() < 0.34 ? 2 + Math.floor(Math.random() * 5) : 1;
		for (let i = 0; i < burst; i++) {
			const t = t0 + Math.random() * 0.14;
			if (Math.random() < 0.13) {
				snap(t, 170 + Math.random() * 240, 3, 0.6 * level, 0.14);   // a pop
			} else {
				snap(t, 950 + Math.random() * 3800, 8 + Math.random() * 10, (0.13 + Math.random() * 0.32) * level, 0.018 + Math.random() * 0.045);
			}
		}
		// Sap boiling out of a knot — a genuinely SUSTAINED hiss, a few
		// hundred milliseconds long. Real fires do this, and it's the one
		// place a continuous sound belongs. Rare on purpose: at 3% it's a
		// detail, and at 30% it would be the stream all over again.
		if (Math.random() < 0.03) {
			snap(t0, 1300 + Math.random() * 2000, 4, 0.12 * level, 0.22 + Math.random() * 0.35);
		}
		timer = setTimeout(scatter, (32 + Math.random() * 250) / (0.35 + level));
	};

	return {
		wake() { init(); if (ctx.state === 'suspended') ctx.resume(); },
		setOn(v) {
			on = v;
			if (!ctx) return;
			master.gain.cancelScheduledValues(ctx.currentTime);
			master.gain.setTargetAtTime(v ? vol : 0, ctx.currentTime, 0.35);
			clearTimeout(timer);
			clearTimeout(fizzTimer);
			if (v) {
				timer = setTimeout(scatter, 120);
				fizzTimer = setTimeout(fizz, 60);
			}
		},
		setVolume(v) {
			vol = v;
			if (ctx && on) master.gain.setTargetAtTime(vol, ctx.currentTime, 0.08);
		},
		// as the fire dies the rumble drops away and the grains thin out;
		// coals are almost entirely low end with the odd tick in them
		setLevel(v) {
			level = v;
			if (!ctx) return;
			roarGain.gain.setTargetAtTime(0.07 + v * 0.26, ctx.currentTime, 0.9);
			roarFilter.frequency.setTargetAtTime(84 + v * 48, ctx.currentTime, 0.9);
			sizzleGain.gain.setTargetAtTime(0.3 + v * 0.8, ctx.currentTime, 0.9);
		},
		click() { if (ctx) snap(ctx.currentTime, 2400, 6, 0.3, 0.02); },
		// stoking: air rushing in, then the fire catching up with it
		stoke() {
			if (!ctx) return;
			const t0 = ctx.currentTime;
			const src = ctx.createBufferSource();
			src.buffer = noiseBuf;
			src.loop = true;
			const f = ctx.createBiquadFilter();
			f.type = 'bandpass';
			f.frequency.setValueAtTime(240, t0);
			f.frequency.exponentialRampToValueAtTime(1500, t0 + 0.5);
			f.frequency.exponentialRampToValueAtTime(420, t0 + 1.5);
			f.Q.value = 1.1;
			const g = ctx.createGain();
			g.gain.setValueAtTime(0.0001, t0);
			g.gain.exponentialRampToValueAtTime(0.75, t0 + 0.28);
			g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.6);
			src.connect(f).connect(g).connect(bus);
			src.start(t0);
			src.stop(t0 + 1.7);
			for (let i = 0; i < 14; i++) {
				snap(t0 + 0.1 + Math.random() * 1.0, 800 + Math.random() * 3800, 9, 0.22, 0.04);
			}
		},
	};
})();

/* ══ SCENE ═══════════════════════════════════════════════════════════════ */

const mount = document.getElementById('stage');
let renderer;
try {
	renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
} catch (err) {
	document.getElementById('fallback').style.display = 'grid';
	mount.style.display = 'none';
	throw err;
}

const DPR = Math.min(window.devicePixelRatio, 2);
renderer.setPixelRatio(DPR);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
mount.appendChild(renderer.domElement);
flameUniforms.uPixel.value = DPR;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 200);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(buildLightRoom(), 0.05).texture;

// The room is lit cold and dim. Everything warm comes from the fire, so
// the flicker below drives the whole picture rather than decorating it.
const roomLight = new THREE.DirectionalLight(0x8fb0ff, 0.34);
roomLight.position.set(-5, 6, 7);
scene.add(roomLight);
scene.add(new THREE.AmbientLight(0x3a4560, 0.34));

const fireLight = new THREE.PointLight(0xff7a2a, 8, 12, 2);
fireLight.position.set(0, 0.55, BACK_Z + 0.5);
scene.add(fireLight);
// a second, tighter light right in the coals, so the logs read as lit from
// within rather than from a lamp hanging in front of them
const coalLight = new THREE.PointLight(0xff4a10, 3.2, 3.2, 2);
coalLight.position.set(0, 0.16, BACK_Z + 0.45);
scene.add(coalLight);

scene.add(buildFireplace());
const { group: logs, embers } = buildLogs();
scene.add(logs);

const flame = new THREE.Points(
	makeParticles(1400, { x: 0.55, y: 0.16, z: 0.34 }, { speed: [0.32, 0.72], size: [0.9, 2.6] }),
	particleMat(FLAME_FRAG, { uRise: { value: 1.5 }, uConverge: { value: 0.62 }, uSway: { value: 0.16 } }),
);
flame.renderOrder = 4;
scene.add(flame);

const smoke = new THREE.Points(
	makeParticles(320, { x: 0.44, y: 1.1, z: 0.3 }, { speed: [0.07, 0.15], size: [7, 16] }),
	particleMat(SMOKE_FRAG, { uRise: { value: 2.6 }, uConverge: { value: -0.9 }, uSway: { value: 0.3 } }),
);
smoke.renderOrder = 3;
scene.add(smoke);

const sparks = new THREE.Points(
	makeParticles(160, { x: 0.5, y: 0.3, z: 0.32 }, { speed: [0.1, 0.26], size: [0.5, 1.5] }),
	particleMat(EMBER_FRAG, { uRise: { value: 3.4 }, uConverge: { value: -1.4 }, uSway: { value: 0.5 } }),
);
sparks.renderOrder = 5;
scene.add(sparks);

const pool = buildPool();
scene.add(pool);

/* ── camera ── */
const target = new THREE.Vector3(0, 0.75, BACK_Z + 0.5);
let azim = 0, elev = 0.13;
const dist = 5.4;
let velA = 0, dragging = false, moved = 0, lastX = 0, lastY = 0;

const placeCamera = () => {
	camera.position.set(
		target.x + dist * Math.cos(elev) * Math.sin(azim),
		target.y + dist * Math.sin(elev),
		target.z + dist * Math.cos(elev) * Math.cos(azim),
	);
	camera.lookAt(target.x, target.y - 0.1, target.z);
};
placeCamera();

/* ── state ── */
const state = { fire: true, smoke: true, sound: false };
let level = 1;        // 0 = coals only, 1 = burning, >1 = stoked
let stoked = 0;

/* ── pointer: drag to orbit, click the fire to stoke ── */
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const hotZone = new THREE.Mesh(
	new THREE.BoxGeometry(1.6, 1.6, 1.2),
	new THREE.MeshBasicMaterial({ visible: false }),
);
hotZone.position.set(0, 0.6, BACK_Z + 0.45);
scene.add(hotZone);

const overFire = (e) => {
	ndc.x = (e.clientX / window.innerWidth) * 2 - 1;
	ndc.y = -(e.clientY / window.innerHeight) * 2 + 1;
	ray.setFromCamera(ndc, camera);
	return ray.intersectObject(hotZone, false).length > 0;
};

const doStoke = () => {
	Sfx.wake();
	Sfx.stoke();
	stoked = 1;
	if (!state.fire) setFire(true);
};

mount.addEventListener('pointerdown', (e) => {
	dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY; velA = 0;
	mount.classList.add('dragging');
});
mount.addEventListener('pointerup', (e) => {
	// under a few pixels is a click; more than that was a drag, and letting
	// go of a spin shouldn't also poke the fire
	if (moved < 6 && overFire(e)) doStoke();
});
const release = () => { dragging = false; mount.classList.remove('dragging'); };
window.addEventListener('pointerup', release);
window.addEventListener('pointercancel', release);

window.addEventListener('pointermove', (e) => {
	if (!dragging) { mount.classList.toggle('over', overFire(e)); return; }
	const dx = e.clientX - lastX, dy = e.clientY - lastY;
	lastX = e.clientX; lastY = e.clientY;
	moved += Math.abs(dx) + Math.abs(dy);
	azim = Math.max(-0.85, Math.min(0.85, azim - dx * 0.005));   // stay in the room
	elev = Math.max(-0.12, Math.min(0.62, elev + dy * 0.004));
	velA = -dx * 0.005;
	if (reduce) placeCamera();
}, { passive: true });

window.addEventListener('resize', () => {
	camera.aspect = window.innerWidth / window.innerHeight;
	camera.updateProjectionMatrix();
	renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ── console ── */
function setFire(v) {
	state.fire = v;
	document.getElementById('sw-fire').setAttribute('aria-pressed', String(v));
	Sfx.setLevel(v ? 1 : 0.12);
}

document.getElementById('sw-fire').addEventListener('click', () => {
	Sfx.wake(); Sfx.click(); setFire(!state.fire);
});
document.getElementById('sw-smoke').addEventListener('click', () => {
	Sfx.wake(); Sfx.click();
	state.smoke = !state.smoke;
	document.getElementById('sw-smoke').setAttribute('aria-pressed', String(state.smoke));
});
document.getElementById('sw-sound').addEventListener('click', () => {
	Sfx.wake(); Sfx.click();
	state.sound = !state.sound;
	document.getElementById('sw-sound').setAttribute('aria-pressed', String(state.sound));
	Sfx.setOn(state.sound);
});

const volEl = document.getElementById('vol');
const applyVol = () => {
	volEl.style.setProperty('--fill', volEl.value + '%');
	Sfx.setVolume((volEl.value / 100) * 0.95);
};
volEl.addEventListener('input', applyVol);
applyVol();

const stokeBtn = document.getElementById('btn-stoke');
stokeBtn.addEventListener('click', () => {
	Sfx.click();
	doStoke();
	stokeBtn.classList.add('lit');
	setTimeout(() => stokeBtn.classList.remove('lit'), 900);
});

/* ── frame ══════════════════════════════════════════════════════════════ */
const clock = new THREE.Clock();
let t = 0;

/* Firelight flicker. Three sines at frequencies that share no common
   multiple — 11.3, 17.7, 29.1 — so the pattern never repeats, plus a slow
   swell underneath. A single sine reads as a pulsing lamp; noise alone
   reads as a bad connection. This is the one thing that has to be right,
   because every surface in the room is lit by it. */
const flicker = (time) =>
	0.74
	+ 0.13 * Math.sin(time * 11.3)
	+ 0.09 * Math.sin(time * 17.7 + 1.3)
	+ 0.06 * Math.sin(time * 29.1 + 2.7)
	+ 0.08 * Math.sin(time * 2.1 + 0.6);

const frame = () => {
	requestAnimationFrame(frame);
	const dt = Math.min(clock.getDelta(), 0.05);
	if (!reduce) t += dt;

	stoked *= Math.pow(0.28, dt);
	const goal = (state.fire ? 1 : 0.1) + stoked * 0.75;
	level += (goal - level) * Math.min(1, dt * 2.4);

	const f = reduce ? 0.85 : flicker(t);
	const lit = level * f;

	flameUniforms.uTime.value = t;
	flameUniforms.uLevel.value = level;

	flame.visible = level > 0.02;
	smoke.visible = state.smoke && level > 0.15;
	sparks.visible = level > 0.25;

	fireLight.intensity = 9 * lit;
	fireLight.position.x = Math.sin(t * 3.1) * 0.09 * level;
	fireLight.position.y = 0.5 + Math.sin(t * 4.7) * 0.06 * level;
	coalLight.intensity = 3.4 * (0.35 + level * 0.65) * (0.85 + 0.15 * f);
	pool.material.opacity = Math.min(1, 0.25 + lit * 0.85);

	// the coals breathe individually — a bed that pulses as one block looks
	// like a single bulb behind the logs
	for (let i = 0; i < embers.length; i++) {
		const e = embers[i];
		const v = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(t * (2.1 + i * 0.31) + e.userData.phase));
		const g = (0.28 + level * 0.72) * v;
		e.material.color.setRGB(g, g * 0.32, g * 0.07);
	}

	if (!dragging && !reduce) {
		azim += velA;
		velA *= 0.93;
		azim += (0 - azim) * 0.006;    // drifts back to face the fire
	}
	if (!reduce || dragging) placeCamera();

	renderer.render(scene, camera);
};

Sfx.setLevel(1);
frame();
</script>
