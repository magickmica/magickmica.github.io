<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✦ Magick Mica — Articles ✦</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap');

  :root {
    --holo1: #ff6ef7;
    --holo2: #6ef7ff;
    --holo3: #f7ff6e;
    --holo4: #6effa0;
    --holo5: #ff9d6e;
    --dark: #05010f;
    --panel: rgba(20, 5, 40, 0.85);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--dark);
    color: #e0d0ff;
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  #stars {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse at 20% 30%, rgba(110,239,255,0.04) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 70%, rgba(255,110,247,0.04) 0%, transparent 60%),
      var(--dark);
  }
  #stars::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, #fff8 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 60%, #fff6 0%, transparent 100%),
      radial-gradient(1px 1px at 50% 10%, #fff9 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 40%, #fff7 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 15% 85%, var(--holo1) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 45% 55%, var(--holo2) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 75% 25%, var(--holo3) 0%, transparent 100%);
    animation: twinkle 4s infinite alternate;
  }
  @keyframes twinkle { from { opacity: 0.4 } to { opacity: 1 } }

  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px);
  }

  .holo-bar {
    height: 5px;
    background: linear-gradient(90deg, var(--holo1), var(--holo2), var(--holo3), var(--holo4), var(--holo5), var(--holo1));
    background-size: 300% 100%;
    animation: holo-slide 3s linear infinite;
    position: relative; z-index: 10;
  }
  @keyframes holo-slide { 0%{background-position:0%} 100%{background-position:300%} }

  header {
    position: relative; z-index: 5;
    text-align: center;
    padding: 3rem 1rem 1.8rem;
    border-bottom: 2px solid rgba(255,110,247,0.25);
  }
  .site-title {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(2rem, 6vw, 4rem);
    font-weight: 900;
    letter-spacing: 0.04em;
    background: linear-gradient(135deg, var(--holo1) 0%, var(--holo2) 33%, var(--holo3) 66%, var(--holo4) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 20px rgba(255,110,247,0.5));
  }
  .site-sub {
    font-family: 'VT323', monospace;
    font-size: 1.2rem;
    color: var(--holo2);
    letter-spacing: 0.25em;
    margin-top: 0.5rem;
    text-shadow: 0 0 10px #6ef7ff;
    text-transform: uppercase;
  }
  .nav-links {
    margin-top: 1.3rem;
    display: flex; justify-content: center; gap: 1.2rem; flex-wrap: wrap;
  }
  .nav-links a {
    font-family: 'VT323', monospace;
    font-size: 1.05rem;
    color: var(--holo3);
    text-decoration: none;
    letter-spacing: 0.12em;
    border: 1px solid var(--holo3);
    padding: 0.2rem 0.7rem;
    transition: all 0.2s;
  }
  .nav-links a:hover { background: var(--holo3); color: #000; box-shadow: 0 0 12px var(--holo3); }

  /* CONTROLS */
  .controls {
    position: relative; z-index: 5;
    max-width: 1200px; margin: 2rem auto 1rem;
    padding: 0 1.5rem;
    display: flex; flex-wrap: wrap; gap: 0.8rem; align-items: center;
  }
  .search-wrap { position: relative; flex: 1; min-width: 220px; }
  .search-wrap::before {
    content: '🔍'; position: absolute; left: 0.9rem; top: 50%; transform: translateY(-50%); font-size: 0.9rem;
  }
  #search {
    width: 100%;
    background: rgba(110,239,255,0.05);
    border: 1px solid var(--holo2);
    color: var(--holo2);
    font-family: 'Share Tech Mono', monospace;
    font-size: 1rem;
    padding: 0.65rem 1rem 0.65rem 2.5rem;
    outline: none;
  }
  #search::placeholder { color: rgba(110,239,255,0.4); }
  .filter-btn {
    font-family: 'VT323', monospace;
    font-size: 0.95rem;
    letter-spacing: 0.1em;
    border: 1px solid var(--holo1);
    color: var(--holo1);
    padding: 0.35rem 0.9rem;
    cursor: pointer;
    background: transparent;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .filter-btn.active, .filter-btn:hover { background: var(--holo1); color: #000; box-shadow: 0 0 12px var(--holo1); }


  /* FEATURED RANDOM ARTICLE SPOTLIGHT */
  .featured-spotlight {
    position: relative; z-index: 5;
    max-width: 900px;
    margin: 0 auto 1.5rem;
    padding: 0 1rem;
  }
  .fs-card {
    display: flex;
    gap: 1.4rem;
    background: linear-gradient(135deg, rgba(255,110,247,0.1), rgba(110,239,255,0.06));
    border: 2px solid var(--holo1);
    box-shadow: 0 0 30px rgba(255,110,247,0.25);
    padding: 1.2rem;
    text-decoration: none;
    color: inherit;
    position: relative;
    overflow: hidden;
    transition: all 0.3s;
  }
  .fs-card:hover { box-shadow: 0 0 40px rgba(255,110,247,0.45); transform: translateY(-3px); }
  .fs-badge {
    position: absolute; top: 0; left: 0;
    font-family: 'VT323', monospace;
    font-size: 0.8rem; letter-spacing: 0.15em;
    color: #0a0518; background: var(--holo3);
    padding: 2px 12px;
  }
  .fs-cover {
    width: 200px; flex-shrink: 0;
    aspect-ratio: 1/1;
    object-fit: cover;
    border: 1px solid rgba(255,110,247,0.4);
  }
  .fs-body { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
  .fs-type {
    font-family: 'VT323', monospace; font-size: 0.9rem;
    letter-spacing: 0.15em; color: var(--holo2);
    margin-bottom: 0.4rem; text-transform: uppercase;
  }
  .fs-title {
    font-family: 'Orbitron', sans-serif; font-weight: 900;
    font-size: 1.3rem; line-height: 1.2; color: #fff;
    margin-bottom: 0.5rem;
  }
  .fs-preview {
    font-size: 0.85rem; color: rgba(200,180,255,0.7);
    line-height: 1.5; margin-bottom: 0.7rem;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .fs-cta {
    font-family: 'VT323', monospace; font-size: 1rem;
    letter-spacing: 0.1em; color: var(--holo1);
  }
  @media (max-width: 600px) {
    .fs-card { flex-direction: column; }
    .fs-cover { width: 100%; aspect-ratio: 16/10; }
  }

  /* RANDOM NOTES SECTION */
  .random-notes-section {
    position: relative; z-index: 5;
    max-width: 900px;
    margin: 0 auto 2rem;
    padding: 0 1rem;
  }
  .rn-section-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 0.9rem;
    flex-wrap: wrap; gap: 0.6rem;
  }
  .rn-section-title {
    font-family: 'Orbitron', sans-serif; font-weight: 700;
    font-size: 1rem; letter-spacing: 0.15em;
    color: var(--holo2);
    text-shadow: 0 0 10px rgba(110,239,255,0.4);
  }
  .rn-refresh-btn {
    font-family: 'VT323', monospace; font-size: 1rem;
    letter-spacing: 0.1em;
    background: transparent; border: 1px solid var(--holo1);
    color: var(--holo1); padding: 0.3rem 1rem; cursor: pointer;
    transition: all 0.2s;
  }
  .rn-refresh-btn:hover { background: var(--holo1); color: #000; box-shadow: 0 0 12px var(--holo1); }
  .random-notes-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 0.8rem;
  }
  @media (max-width: 800px) {
    .random-notes-grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 480px) {
    .random-notes-grid { grid-template-columns: repeat(2, 1fr); }
  }
  .rn-note {
    display: block; text-decoration: none; color: inherit;
    background: var(--card);
    border: 1px solid rgba(110,239,255,0.25);
    overflow: hidden;
    transition: all 0.25s;
  }
  .rn-note:nth-child(3n) { border-color: rgba(255,110,247,0.25); }
  .rn-note:nth-child(3n+1) { border-color: rgba(247,255,110,0.25); }
  .rn-note:hover {
    border-color: #fff;
    box-shadow: 0 0 16px rgba(255,110,247,0.35);
    transform: translateY(-3px);
  }
  .rn-note-img {
    width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block;
    transition: transform 0.4s;
  }
  .rn-note:hover .rn-note-img { transform: scale(1.08); }
  .rn-note-meta {
    padding: 0.4rem 0.5rem;
    font-family: 'VT323', monospace; font-size: 0.8rem;
    color: var(--holo3);
  }

  .results-info {
    position: relative; z-index: 5;
    max-width: 1200px; margin: 0 auto 1.5rem;
    padding: 0 1.5rem;
    font-family: 'VT323', monospace;
    font-size: 1.05rem;
    color: rgba(255,110,247,0.7);
    letter-spacing: 0.1em;
  }

  /* FEATURED HERO POST */
  .featured-wrap {
    position: relative; z-index: 5;
    max-width: 1200px; margin: 0 auto 2.5rem;
    padding: 0 1.5rem;
  }
  .featured-card {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    background: var(--panel);
    border: 1px solid rgba(255,110,247,0.3);
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    transition: all 0.25s;
    box-shadow: 0 0 0 rgba(255,110,247,0);
  }
  .featured-card:hover {
    border-color: var(--holo1);
    box-shadow: 0 0 35px rgba(255,110,247,0.25);
  }
  .featured-img-wrap { position: relative; overflow: hidden; min-height: 260px; }
  .featured-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .featured-img-wrap::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,110,247,0.15), rgba(110,239,255,0.1));
    mix-blend-mode: overlay;
  }
  .featured-content { padding: 2rem; display: flex; flex-direction: column; justify-content: center; }
  .featured-label {
    font-family: 'VT323', monospace;
    font-size: 0.95rem;
    letter-spacing: 0.25em;
    color: var(--holo3);
    text-shadow: 0 0 10px var(--holo3);
    margin-bottom: 0.8rem;
  }
  .featured-title {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(1.4rem, 3vw, 2rem);
    font-weight: 900;
    color: #fff;
    line-height: 1.25;
    margin-bottom: 0.7rem;
  }
  .featured-subtitle {
    font-family: 'Spectral', serif;
    font-style: italic;
    font-size: 1.05rem;
    color: rgba(220,200,255,0.75);
    margin-bottom: 0.8rem;
    line-height: 1.5;
  }
  .featured-date {
    font-family: 'VT323', monospace;
    font-size: 0.95rem;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.1em;
  }
  @media (max-width: 760px) {
    .featured-card { grid-template-columns: 1fr; }
    .featured-img-wrap { min-height: 200px; }
  }

  /* MAGAZINE GRID */
  .mag-grid {
    position: relative; z-index: 5;
    max-width: 1200px; margin: 0 auto 4rem;
    padding: 0 1.5rem;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1.8rem;
  }

  .mag-card {
    display: flex; flex-direction: column;
    text-decoration: none; color: inherit;
    background: var(--panel);
    border: 1px solid rgba(255,110,247,0.2);
    overflow: hidden;
    transition: all 0.25s;
  }
  .mag-card:hover {
    border-color: var(--holo2);
    box-shadow: 0 0 25px rgba(110,239,255,0.25);
    transform: translateY(-3px);
  }
  .mag-img-wrap {
    position: relative;
    aspect-ratio: 16/10;
    overflow: hidden;
    background: rgba(255,255,255,0.03);
  }
  .mag-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s; }
  .mag-card:hover .mag-img-wrap img { transform: scale(1.05); }
  .mag-no-img {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, rgba(255,110,247,0.08), rgba(110,239,255,0.08));
    font-family: 'Orbitron', sans-serif;
    font-size: 2rem;
    color: rgba(255,110,247,0.3);
  }
  .mag-type-badge {
    position: absolute; top: 10px; left: 10px;
    font-family: 'VT323', monospace;
    font-size: 0.78rem;
    letter-spacing: 0.15em;
    background: rgba(0,0,0,0.7);
    border: 1px solid var(--holo1);
    color: var(--holo1);
    padding: 2px 8px;
    text-transform: uppercase;
  }
  .mag-content { padding: 1.1rem 1.2rem 1.3rem; display: flex; flex-direction: column; flex: 1; }
  .mag-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    color: #fff;
    line-height: 1.3;
    margin-bottom: 0.5rem;
  }
  .mag-subtitle {
    font-family: 'Spectral', serif;
    font-style: italic;
    font-size: 0.85rem;
    color: rgba(220,200,255,0.65);
    margin-bottom: 0.6rem;
    line-height: 1.45;
  }
  .mag-preview {
    font-size: 0.8rem;
    color: rgba(220,200,255,0.55);
    line-height: 1.55;
    flex: 1;
    margin-bottom: 0.8rem;
  }
  .mag-footer {
    display: flex; justify-content: space-between; align-items: center;
    font-family: 'VT323', monospace;
    font-size: 0.85rem;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.05em;
    border-top: 1px dashed rgba(255,110,247,0.15);
    padding-top: 0.6rem;
  }
  .mag-read {
    color: var(--holo3);
    font-weight: bold;
  }

  #empty {
    display: none;
    text-align: center; padding: 4rem 1rem;
    font-family: 'VT323', monospace; font-size: 1.4rem;
    color: rgba(255,110,247,0.5);
    letter-spacing: 0.2em;
  }

  footer {
    position: relative; z-index: 5;
    text-align: center;
    padding: 2rem;
    font-family: 'VT323', monospace;
    font-size: 1rem;
    letter-spacing: 0.15em;
    color: rgba(200,180,255,0.35);
    border-top: 1px solid rgba(255,110,247,0.1);
  }
  footer a { color: var(--holo1); text-decoration: none; }
</style>
</head>
<body>

<div id="stars"></div>
<div class="holo-bar"></div>

<header>
  <div class="site-title">✦ ARTICLES ✦</div>
  <div class="site-sub">the full magazine ✧ every issue, every story</div>
  <nav class="nav-links">
    <a href="blog.html">✦ BLOG HOME ✦</a>
    <a href="notes.html">📝 NOTES ARCHIVE</a>
    <a href="https://magickmica.substack.com" target="_blank">📺 SUBSCRIBE</a>
  </nav>
</header>

<div class="controls">
  <div class="search-wrap">
    <input id="search" type="text" placeholder="search articles..." autocomplete="off" />
  </div>
  <button class="filter-btn active" data-filter="all">ALL</button>
  <button class="filter-btn" data-filter="newsletter">NEWSLETTERS</button>
  <button class="filter-btn" data-filter="page">PAGES</button>
  <span style="width:1px; background:rgba(255,255,255,0.2); margin:0 0.3rem;"></span>
  <button class="filter-btn" data-nl="tv">📺 MAGICK MICA TV</button>
  <button class="filter-btn" data-nl="art">🎨 MAGICK MICA ART</button>
</div>

<div class="results-info" id="resultsInfo"></div>

<div class="featured-spotlight" id="featuredSpotlight"></div>

<div class="random-notes-section">
  <div class="rn-section-header">
    <span class="rn-section-title">✦ RANDOM NOTES ✦</span>
    <button class="rn-refresh-btn" id="rnRefreshBtn">🎲 SHUFFLE</button>
  </div>
  <div class="random-notes-grid" id="randomNotesGrid"></div>
</div>

<div class="featured-wrap" id="featuredWrap"></div>

<div class="mag-grid" id="magGrid"></div>
<div id="empty">✦ NO ARTICLES FOUND ✦</div>

<footer>
  ✦ MAGICK MICA ARTICLES ✦ &nbsp;|&nbsp;
  <a href="https://magickmica.substack.com">Subscribe on Substack</a>
</footer>

let activeFilter = 'all', searchVal = '', activeNewsletter = '';

function formatDate(d) {
  return new Date(d + 'T12:00:00').toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function render() {
  const q = searchVal.toLowerCase();
  let filtered = POSTS.filter(p => {
    if (activeFilter !== 'all' && p.type !== activeFilter) return false;
    if (activeNewsletter && p.newsletter !== activeNewsletter) return false;
    if (q && !p.title.toLowerCase().includes(q) && !p.preview.toLowerCase().includes(q) && !p.subtitle.toLowerCase().includes(q)) return false;
    return true;
  });

  const featuredWrap = document.getElementById('featuredWrap');
  const grid = document.getElementById('magGrid');
  const empty = document.getElementById('empty');
  const info = document.getElementById('resultsInfo');

  grid.innerHTML = '';
  featuredWrap.innerHTML = '';

  if (filtered.length === 0) {
    empty.style.display = 'block';
    info.textContent = '';
    return;
  }
  empty.style.display = 'none';
  info.textContent = `◈ ${filtered.length} article${filtered.length!==1?'s':''} found`;

  // Featured = most recent with a cover image, if searching/filtering show none
  let rest = filtered;
  if (!q && activeFilter === 'all') {
    const featured = filtered.find(p => p.cover_url) || filtered[0];
    rest = filtered.filter(p => p !== featured);
    featuredWrap.innerHTML = `
      <a class="featured-card" href="${featured.url}" target="_blank" rel="noopener">
        <div class="featured-img-wrap">
          ${featured.cover_url ? `<img src="${featured.cover_url}" loading="lazy" onerror="this.parentElement.style.display='none'" />` : ''}
        </div>
        <div class="featured-content">
          <div class="featured-label">✦ LATEST ISSUE ✦</div>
          <div class="featured-title">${escapeHtml(featured.title)}</div>
          ${featured.subtitle ? `<div class="featured-subtitle">${escapeHtml(featured.subtitle)}</div>` : ''}
          <div class="featured-date">${formatDate(featured.date)}</div>
        </div>
      </a>
    `;
  }

  rest.forEach(p => {
    const card = document.createElement('a');
    card.className = 'mag-card';
    card.href = p.url;
    card.target = '_blank';
    card.rel = 'noopener';
    card.innerHTML = `
      <div class="mag-img-wrap">
        ${p.cover_url
          ? `<img src="${p.cover_url}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=&quot;mag-no-img&quot;>✦</div>'" />`
          : `<div class="mag-no-img">✦</div>`}
        <span class="mag-type-badge">${p.type}</span>
      </div>
      <div class="mag-content">
        <div class="mag-title">${escapeHtml(p.title)}</div>
        ${p.subtitle ? `<div class="mag-subtitle">${escapeHtml(p.subtitle)}</div>` : ''}
        ${p.preview ? `<div class="mag-preview">${escapeHtml(p.preview)}...</div>` : ''}
        <div class="mag-footer">
          <span>${formatDate(p.date)}</span>
          <span class="mag-read">READ →</span>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
}

document.getElementById('search').addEventListener('input', e => {
  searchVal = e.target.value;
  render();
});
document.querySelectorAll('.filter-btn[data-filter]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn[data-filter]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    render();
  });
});
document.querySelectorAll('.filter-btn[data-nl]').forEach(btn => {
  btn.addEventListener('click', () => {
    const nl = btn.dataset.nl;
    if (activeNewsletter === nl) {
      activeNewsletter = '';
      btn.classList.remove('active');
    } else {
      activeNewsletter = nl;
      document.querySelectorAll('.filter-btn[data-nl]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
    render();
  });
});


// FEATURED RANDOM ARTICLE SPOTLIGHT
function renderFeaturedSpotlight() {
  const withCover = POSTS.filter(p => p.cover_url);
  if (!withCover.length) return;
  const p = withCover[Math.floor(Math.random() * withCover.length)];
  const nl = p.newsletter === 'tv' ? '📺 Magick Mica TV' : '🎨 Magick Mica Art';
  const el = document.getElementById('featuredSpotlight');
  el.innerHTML = `
    <a class="fs-card" href="${p.url}" target="_blank" rel="noopener">
      <div class="fs-badge">✦ FEATURED PICK</div>
      <img class="fs-cover" src="${p.cover_url}" loading="lazy" onerror="this.style.display='none'" />
      <div class="fs-body">
        <div class="fs-type">${nl}</div>
        <div class="fs-title">${p.title}</div>
        ${p.preview ? `<div class="fs-preview">${p.preview}...</div>` : ''}
        <div class="fs-cta">READ THIS ONE →</div>
      </div>
    </a>`;
}
renderFeaturedSpotlight();

// RANDOM NOTES SECTION
function renderRandomNotes() {
  // Pick a count that fills rows evenly based on column count
  const w = window.innerWidth;
  const cols = w <= 480 ? 2 : (w <= 800 ? 3 : 5);
  const count = cols * 3; // always 3 full rows
  const shuffled = [...NOTES_POOL].sort(() => Math.random() - 0.5).slice(0, count);
  const el = document.getElementById('randomNotesGrid');
  el.innerHTML = shuffled.map(n =>
    `<a class="rn-note" href="https://substack.com/@magickmica/note/c-${n.id}" target="_blank" rel="noopener">
      <img class="rn-note-img" src="${n.t}" loading="lazy" onerror="this.parentElement.style.display='none'" />
      <div class="rn-note-meta">❤ ${n.l}</div>
    </a>`
  ).join('');
}
document.getElementById('rnRefreshBtn').addEventListener('click', () => {
  renderRandomNotes();
  renderFeaturedSpotlight();
});
renderRandomNotes();

// Keep the grid even when the window resizes across breakpoints
let rnResizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(rnResizeTimer);
  rnResizeTimer = setTimeout(renderRandomNotes, 200);
});

render();
</script>
